approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"
model_reasoning_summary = "concise"

[mcp_servers.azurpilot-dev]
command = "uv"
args = ["run", "--locked", "--no-sync", "python", "-m", "module.dev_mcp"]
cwd = "."
enabled = true
required = false
startup_timeout_sec = 5
tool_timeout_sec = 180

[mcp_servers.azurpilot_dev]
url = "http://127.0.0.1:8775/mcp"
bearer_token_env_var = "AZURPILOT_DEV_LOCAL_MCP_TOKEN"
enabled = true
required = false
startup_timeout_sec = 10
tool_timeout_sec = 180

[mcp_servers.azurpilot-game]
command = "uv"
args = ["run", "--locked", "--no-sync", "python", "-m", "module.game_mcp"]
cwd = "."
enabled = true
required = false
startup_timeout_sec = 10
tool_timeout_sec = 180

[mcp_servers.azurpilot_game]
url = "http://127.0.0.1:8776/mcp"
bearer_token_env_var = "AZURPILOT_GAME_LOCAL_MCP_TOKEN"
enabled = true
required = false
startup_timeout_sec = 10
tool_timeout_sec = 180

# Прямые регистрации только для чтения. Секреты не хранятся в конфигурации репозитория.
[mcp_servers.context7_direct]
url = "https://mcp.context7.com/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.docker_docs_direct]
url = "https://mcp-docs.docker.com/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 120

# Общие долгоживущие MCP HTTP services: один process на машину, владелец —
# infrastructure/observability/compose.yaml. Клиент предъявляет caller token из
# окружения вызывающей стороны; provider credential остаётся у сервиса.
[mcp_servers.grafana_direct]
url = "http://127.0.0.1:8777/mcp"
bearer_token_env_var = "AZURPILOT_GRAFANA_MCP_CALLER_TOKEN"
enabled_tools = [
    "analyze_loki_labels",
    "check_datasources_health",
    "diff_tempo_traces",
    "generate_deeplink",
    "get_dashboard_by_uid",
    "get_dashboard_panel_queries",
    "get_dashboard_property",
    "get_dashboard_summary",
    "get_datasource",
    "get_tempo_trace",
    "get_tempo_traceql_docs",
    "list_dashboard_versions",
    "list_datasources",
    "list_loki_label_names",
    "list_loki_label_values",
    "list_prometheus_label_names",
    "list_prometheus_label_values",
    "list_prometheus_metric_metadata",
    "list_prometheus_metric_names",
    "list_tempo_attribute_names",
    "list_tempo_attribute_values",
    "query_loki_logs",
    "query_loki_patterns",
    "query_loki_stats",
    "query_prometheus",
    "query_prometheus_histogram",
    "query_tempo_metrics",
    "search_dashboards",
    "search_folders",
    "search_tempo_traces",
]
disabled_tools = [
    "alerting_manage_routing",
    "alerting_manage_rules",
    "create_annotation",
    "create_datasource",
    "create_folder",
    "create_incident",
    "create_snapshot",
    "delete_snapshot",
    "grafana_api_request",
    "install_plugin",
    "update_annotation",
    "update_dashboard",
    "update_datasource",
]
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.dockerhub_direct]
url = "http://127.0.0.1:8778/mcp"
bearer_token_env_var = "AZURPILOT_DOCKER_HUB_MCP_CALLER_TOKEN"
enabled_tools = [
    "checkRepository",
    "checkRepositoryTag",
    "dockerHardenedImages",
    "getPersonalNamespace",
    "getRepositoryInfo",
    "getRepositoryTag",
    "listAllNamespacesMemberOf",
    "listNamespaces",
    "listRepositoriesByNamespace",
    "listRepositoryTags",
    "search",
]
disabled_tools = ["createRepository", "updateRepositoryInfo"]
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.semgrep_local_direct]
command = "semgrep"
args = ["mcp", "-t", "stdio"]
cwd = "."
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 120

[agents]
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "max"

[features.multi_agent_v2]
enabled = true
max_concurrent_threads_per_session = 7
