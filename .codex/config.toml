approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"
model_reasoning_summary = "concise"

[mcp_servers.azurpilot-dev]
command = "uv"
args = ["run", "--locked", "--no-sync", "python", "-m", "module.dev_mcp"]
cwd = "."
enabled = true
required = false
startup_timeout_sec = 5
tool_timeout_sec = 180

[mcp_servers.MCP_DOCKER]
command = "docker"
args = ["mcp", "gateway", "run", "--profile", "azurpilot-development"]
cwd = "."
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 180

# Прямые read-only routes для документации и локального security scan.
# Секреты не хранятся в repository config; Context7 остаётся в user config.
[mcp_servers.docker_docs_direct]
url = "https://mcp-docs.docker.com/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.semgrep_local_direct]
command = "semgrep"
args = ["mcp", "-t", "stdio"]
cwd = "."
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 120
