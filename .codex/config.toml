approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"
model_reasoning_summary = "concise"

[mcp_servers.azurpilot-dev]
command = "uv"
args = ["run", "--locked", "--no-sync", "python", "-m", "module.dev_mcp"]
cwd = "."
enabled = true
required = false
startup_timeout_sec = 5
tool_timeout_sec = 180

[mcp_servers.azurpilot_dev]
url = "http://127.0.0.1:8775/mcp"
bearer_token_env_var = "AZURPILOT_DEV_LOCAL_MCP_TOKEN"
enabled = true
required = false
startup_timeout_sec = 10
tool_timeout_sec = 180

[mcp_servers.azurpilot-game]
command = "uv"
args = ["run", "--locked", "--no-sync", "python", "-m", "module.game_mcp"]
cwd = "."
enabled = true
required = false
startup_timeout_sec = 10
tool_timeout_sec = 180

[mcp_servers.azurpilot_game]
url = "http://127.0.0.1:8776/mcp"
bearer_token_env_var = "AZURPILOT_GAME_LOCAL_MCP_TOKEN"
enabled = true
required = false
startup_timeout_sec = 10
tool_timeout_sec = 180

# Прямые read-only registrations. Секреты не хранятся в repository config.
[mcp_servers.context7_direct]
url = "https://mcp.context7.com/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.docker_docs_direct]
url = "https://mcp-docs.docker.com/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.grafana_direct]
command = "uv"
args = [
    "run",
    "--locked",
    "--no-sync",
    "python",
    "-m",
    "azurpilot.integrations.grafana_stdio",
]
enabled_tools = [
    "check_datasources_health",
    "generate_deeplink",
    "get_dashboard_panel_queries",
    "get_dashboard_property",
    "get_dashboard_summary",
    "get_datasource",
    "list_datasources",
    "list_loki_label_names",
    "list_loki_label_values",
    "list_prometheus_label_names",
    "list_prometheus_label_values",
    "list_prometheus_metric_metadata",
    "list_prometheus_metric_names",
    "query_loki_logs",
    "query_prometheus",
    "query_prometheus_histogram",
    "search_dashboards",
    "tempo_docs-config",
    "tempo_docs-traceql",
    "tempo_get-attribute-names",
    "tempo_get-attribute-values",
    "tempo_get-trace",
    "tempo_traceql-metrics-instant",
    "tempo_traceql-metrics-range",
    "tempo_traceql-search",
]
disabled_tools = [
    "alerting_manage_routing",
    "alerting_manage_rules",
    "create_annotation",
    "create_datasource",
    "create_folder",
    "create_incident",
    "create_snapshot",
    "delete_snapshot",
    "grafana_api_request",
    "install_plugin",
    "update_annotation",
    "update_dashboard",
    "update_datasource",
]
env_vars = ["GRAFANA_SERVICE_ACCOUNT_TOKEN"]
cwd = "."
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.dockerhub_direct]
command = "docker"
args = [
    "run",
    "--rm",
    "-i",
    "mcp/dockerhub@sha256:76454af4edfd21571d9740113104d0d9f707220453d1c8f7c9971b21848d4248",
]
enabled_tools = [
    "checkRepository",
    "checkRepositoryTag",
    "dockerHardenedImages",
    "getPersonalNamespace",
    "getRepositoryInfo",
    "getRepositoryTag",
    "listAllNamespacesMemberOf",
    "listNamespaces",
    "listRepositoriesByNamespace",
    "listRepositoryTags",
    "search",
]
disabled_tools = ["createRepository", "updateRepositoryInfo"]
cwd = "."
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.semgrep_local_direct]
command = "semgrep"
args = ["mcp", "-t", "stdio"]
cwd = "."
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 120
