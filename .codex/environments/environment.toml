# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "AzurPilot"

[setup]
script = ""

[setup.linux]
script = '''
set -euo pipefail

echo 'Подготовка Linux/POSIX-среды AzurPilot...'

if ! command -v uv >/dev/null 2>&1; then
    echo 'Ошибка: uv не найден в PATH.' >&2
    exit 1
fi

uv lock --check
uv sync --locked --python 3.14.6 --group dev --group ci
uv run --locked --no-sync playwright install chromium
uv run --locked --no-sync python -c "import sys, azurpilot, playwright; assert sys.version_info[:3] == (3, 14, 6), sys.version; print(sys.version); print(azurpilot.__file__)"
uv run --locked --no-sync ruff --version
uv run --locked --no-sync pytest --version
'''

[setup.win32]
script = '''
$ErrorActionPreference = 'Stop'
Set-StrictMode -Version Latest

if (-not (Get-Command uv -ErrorAction SilentlyContinue)) {
    throw 'uv не найден в PATH.'
}

Write-Host 'Подготовка Windows-native среды AzurPilot...'
uv lock --check
if ($LASTEXITCODE -ne 0) {
    throw "uv lock --check завершился с кодом $LASTEXITCODE."
}

uv sync --locked --python 3.14.6 --group dev --group ci
if ($LASTEXITCODE -ne 0) {
    throw "uv sync завершился с кодом $LASTEXITCODE."
}

uv run --locked --no-sync playwright install chromium
if ($LASTEXITCODE -ne 0) {
    throw "Установка Chromium для Playwright завершилась с кодом $LASTEXITCODE."
}

uv run --locked --no-sync python -c "import sys, azurpilot, playwright; assert sys.version_info[:3] == (3, 14, 6), sys.version; print(sys.version); print(azurpilot.__file__)"
if ($LASTEXITCODE -ne 0) {
    throw "Проверка Python и импорта завершилась с кодом $LASTEXITCODE."
}

uv run --locked --no-sync ruff --version
if ($LASTEXITCODE -ne 0) {
    throw "Проверка ruff завершилась с кодом $LASTEXITCODE."
}

uv run --locked --no-sync pytest --version
if ($LASTEXITCODE -ne 0) {
    throw "Проверка pytest завершилась с кодом $LASTEXITCODE."
}

Write-Host ("Среда готова: " + [System.IO.Path]::GetFullPath((Join-Path $PWD '.venv')))
'''
