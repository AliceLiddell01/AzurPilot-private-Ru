stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

live_store:
  max_block_duration: 5m

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 168h

query_frontend:
  metrics:
    max_duration: 168h
  mcp_server:
    enabled: true

storage:
  trace:
    backend: local
    block:
      version: vParquet4
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
