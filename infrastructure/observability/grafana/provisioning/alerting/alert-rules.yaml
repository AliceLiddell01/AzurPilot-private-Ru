apiVersion: 1

groups:
  - orgId: 1
    name: AzurPilot
    folder: AzurPilot
    interval: 1m
    rules:
      - uid: azurpilot-task-failures
        title: Рост ошибок scheduler task
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: sum(rate(azurpilot_task_run_total{azurpilot_task_outcome="failure"}[15m])) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: azurpilot-overview
        panelId: 3
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          description: Есть непрерывный поток неуспешных scheduler task за последние 15 минут.
          summary: Рост ошибок scheduler task
        labels:
          severity: warning
          source: azurpilot
        isPaused: false

      - uid: azurpilot-task-duration-p95
        title: Высокая p95 длительность scheduler task
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: histogram_quantile(0.95, sum by (le) (rate(azurpilot_task_duration_seconds_bucket[15m]))) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 300
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: azurpilot-overview
        panelId: 8
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          description: 95-й перцентиль длительности scheduler task превышает 5 минут.
          summary: Высокая длительность scheduler task
        labels:
          severity: warning
          source: azurpilot
        isPaused: false
