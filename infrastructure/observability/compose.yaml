name: azurpilot-infrastructure

services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    profiles:
      - remote-ingress
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      AZURPILOT_CADDY_HOST: ${AZURPILOT_CADDY_HOST:-}
      AZURPILOT_GAME_MCP_PUBLIC_HOST: ${AZURPILOT_GAME_MCP_PUBLIC_HOST:-}
      AZURPILOT_NOTIFICATION_AGENT_BACKEND: ${AZURPILOT_NOTIFICATION_AGENT_BACKEND:-host.docker.internal:25548}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - type: bind
        source: ../caddy
        target: /etc/caddy
        read_only: true
      - type: volume
        source: caddy-data
        target: /data
      - type: volume
        source: caddy-config
        target: /config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  postgres:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${AZURPILOT_POSTGRES_DATABASE:-azurpilot}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
      POSTGRES_INITDB_ARGS: --auth-local=peer --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:${AZURPILOT_POSTGRES_PORT:-5432}:5432"
    secrets:
      - postgres_bootstrap_password
    volumes:
      - type: bind
        source: ./postgres/init
        target: /docker-entrypoint-initdb.d
        read_only: true
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "gosu postgres pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  redis:
    image: redis:8.10.1@sha256:8a1efc5f479551822b47424ccae982026b633f28818eab0387348120a61e10e2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: redis
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        app_password="$$(cat /run/secrets/redis_app_password)"
        admin_password="$$(cat /run/secrets/redis_admin_password)"
        test -n "$$app_password"
        test -n "$$admin_password"
        rm -f -- /data/acl.conf
        mkdir -p /run/redis
        case "$$app_password$$admin_password" in
          *[!A-Za-z0-9._~+=:@%/,-]*)
            echo "Redis secrets contain unsupported characters" >&2
            exit 1
            ;;
        esac
        printf '%s\n' \
          'user default off -@all' \
          "user azurpilot_app on >$$app_password ~azurpilot:* +ping +get +set +del +expire +expireat +ttl" \
          "user azurpilot_admin on >$$admin_password ~* +@all" \
          >/run/redis/acl.conf
        exec redis-server --appendonly yes --appendfsync everysec --aclfile /run/redis/acl.conf
    ports:
      - "127.0.0.1:${AZURPILOT_REDIS_PORT:-6379}:6379"
    secrets:
      - redis_app_password
      - redis_admin_password
    volumes:
      - type: volume
        source: redis-data
        target: /data
    tmpfs:
      - /run/redis:rw,noexec,nosuid,nodev,uid=999,gid=999,mode=0700
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$$(cat /run/secrets/redis_app_password)" redis-cli --user azurpilot_app ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  postgres-bootstrap:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - bootstrap
    restart: "no"
    security_opt:
      - no-new-privileges:true
    user: postgres
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: ${AZURPILOT_POSTGRES_DATABASE:-azurpilot}
    entrypoint: ["/bin/bash", "/bootstrap/01-bootstrap.sh"]
    secrets:
      - postgres_bootstrap_password
      - postgres_app_password
      - postgres_migrator_password
    volumes:
      - type: bind
        source: ./postgres/bootstrap
        target: /bootstrap
        read_only: true
  pgadmin:
    image: dpage/pgadmin4:9.17@sha256:2f4ce946ddf8360680d7eff4eaba1d91859eb6b4003e6623bad5c63a322c2f4d
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${AZURPILOT_OBSERVABILITY_PGADMIN_PORT:-5050}:8080"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${AZURPILOT_OBSERVABILITY_PGADMIN_ADMIN_EMAIL:-admin@azurpilot.dev}
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_admin_password
      PGADMIN_DISABLE_POSTFIX: "1"
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
      PGADMIN_LISTEN_PORT: "8080"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGPASS_FILE: /run/secrets/pgadmin_pgpass
    secrets:
      - pgadmin_admin_password
      - pgadmin_pgpass
    volumes:
      - type: bind
        source: ./pgadmin/servers.json
        target: /pgadmin4/servers.json
        read_only: true
      - type: volume
        source: pgadmin-data
        target: /var/lib/pgadmin
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/misc/ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  redisinsight:
    image: redis/redisinsight:3.8.0@sha256:b5e19ee240abef6edb435871b90ff8a210995422e8e018ab61c0339d318a1f84
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/usr/src/app/docker-entry.sh"]
    ports:
      - "127.0.0.1:${AZURPILOT_REDISINSIGHT_PORT:-5540}:5540"
    environment:
      RI_APP_HOST: 0.0.0.0
      RI_APP_PORT: "5540"
      RI_ENCRYPTION_KEY: ${AZURPILOT_REDISINSIGHT_ENCRYPTION_KEY:-}
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: AzurPilot Redis
      RI_REDIS_USERNAME: azurpilot_admin
    command:
      - /bin/sh
      - -ec
      - |
        if [ -z "$${RI_ENCRYPTION_KEY}" ]; then
          echo "RedisInsight encryption key is required" >&2
          exit 1
        fi
        exec node redisinsight/api/dist/src/main
    volumes:
      - type: volume
        source: redisinsight-data
        target: /data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:5540/api/health/",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  alloy:
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - type: bind
        source: ./alloy/config.alloy
        target: /etc/alloy/config.alloy
        read_only: true
      - type: volume
        source: alloy-data
        target: /var/lib/alloy/data
  loki:
    image: grafana/loki:3.7.7@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500
    command:
      - -config.file=/etc/loki/config.yaml
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "3100"
    volumes:
      - type: bind
        source: ./loki/config.yaml
        target: /etc/loki/config.yaml
        read_only: true
      - type: volume
        source: loki-data
        target: /loki
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "9090"
    volumes:
      - type: bind
        source: ./prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: volume
        source: prometheus-data
        target: /prometheus
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:9090/-/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  tempo:
    image: grafana/tempo:3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5
    command:
      - -config.file=/etc/tempo/config.yaml
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "3200"
      - "4317"
      - "4318"
    volumes:
      - type: bind
        source: ./tempo/config.yaml
        target: /etc/tempo/config.yaml
        read_only: true
      - type: volume
        source: tempo-data
        target: /var/tempo
  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    depends_on:
      alloy:
        condition: service_started
      loki:
        condition: service_started
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${AZURPILOT_OBSERVABILITY_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_ID_RESPONSE_HEADER_ENABLED: "true"
      GF_AUTH_ID_RESPONSE_HEADER_PREFIX: X-Grafana
      GF_AUTH_ID_RESPONSE_HEADER_NAMESPACES: service-account
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    secrets:
      - grafana_admin_password
    volumes:
      - type: bind
        source: ./grafana/provisioning/datasources
        target: /etc/grafana/provisioning/datasources
        read_only: true
      - type: bind
        source: ./grafana/provisioning/dashboards
        target: /etc/grafana/provisioning/dashboards
        read_only: true
      - type: bind
        source: ./grafana/provisioning/alerting
        target: /etc/grafana/provisioning/alerting
        read_only: true
      - type: bind
        source: ./grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
      - type: volume
        source: grafana-data
        target: /var/lib/grafana
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Общие внешние MCP HTTP services: один долгоживущий процесс на машину,
  # к которому подключаются несколько локальных клиентов и checkout-ов.
  # Профиль external-mcp делает запуск явным: без него инфраструктура игры
  # поднимается без интеграционных кредалов.
  grafana-mcp:
    profiles:
      - external-mcp
    image: grafana/mcp-grafana:1.6.0@sha256:c668a6cc87e7b2b69a0e414bc2c5cf12b37dcca02809df500842b690d592e91f
    depends_on:
      grafana:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    entrypoint:
      - /bin/sh
      - /opt/azurpilot/entrypoint.sh
    command:
      - "--transport=streamable-http"
      - "--address=0.0.0.0:8000"
      - "--endpoint-path=/mcp"
      - "--healthz-address=0.0.0.0:8081"
      - "--disable-write"
      - "--disable-api"
      - "--enabled-tools=search,datasource,prometheus,loki,dashboard,navigation,tempo"
      - "--allowed-hosts=127.0.0.1:8777,localhost:8777,grafana-mcp:8000,127.0.0.1:8000,localhost:8000"
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN:-}
      MCP_GRAFANA_SERVER_TOKEN: ${AZURPILOT_GRAFANA_MCP_CALLER_TOKEN:-}
    ports:
      - "127.0.0.1:8777:8000/tcp"
    volumes:
      - type: bind
        source: ./mcp/grafana-mcp
        target: /opt/azurpilot
        read_only: true
    healthcheck:
      test: ["CMD", "bash", "/opt/azurpilot/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  dockerhub-mcp:
    profiles:
      - external-mcp
    image: azurpilot-infrastructure/dockerhub-mcp:4c01b635d523
    build:
      context: ./mcp/dockerhub-mcp
      args:
        HUBCP_COMMIT: 4c01b635d5239192e5d1b5e0f659a6d224a44ab6
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      # upstream logger пишет файл в /app/logs, поэтому rootfs остаётся read-only.
      - /app/logs
    command:
      - "--transport=http"
      - "--port=3000"
      - "--host=0.0.0.0"
      - "--allowed-hosts=127.0.0.1:8778,localhost:8778,dockerhub-mcp:3000,127.0.0.1:3000,localhost:3000"
      - "--username=${DOCKERHUB_USERNAME:-}"
    environment:
      MCP_AUTH_TOKEN: ${AZURPILOT_DOCKER_HUB_MCP_CALLER_TOKEN:-}
      HUB_PAT_TOKEN: ${DOCKERHUB_PAT:-}
    ports:
      - "127.0.0.1:8778:3000/tcp"
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.mjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
    name: azurpilot-postgres-data
  redis-data:
    name: azurpilot-redis-data
  redisinsight-data:
    name: azurpilot-redisinsight-data
  pgadmin-data:
    name: azurpilot-pgadmin-data
  alloy-data:
    external: true
    name: azurpilot-observability_alloy-data
  loki-data:
    external: true
    name: azurpilot-observability_loki-data
  prometheus-data:
    external: true
    name: azurpilot-observability_prometheus-data
  tempo-data:
    external: true
    name: azurpilot-observability_tempo-data
  grafana-data:
    external: true
    name: azurpilot-observability_grafana-data
  caddy-data:
    name: azurpilot-caddy-data
  caddy-config:
    name: azurpilot-caddy-config

secrets:
  postgres_bootstrap_password:
    environment: AZURPILOT_POSTGRES_DOCKER_BOOTSTRAP_PASSWORD
  postgres_app_password:
    environment: AZURPILOT_POSTGRES_PASSWORD
  postgres_migrator_password:
    environment: AZURPILOT_POSTGRES_MIGRATOR_PASSWORD
  grafana_admin_password:
    environment: AZURPILOT_OBSERVABILITY_GRAFANA_ADMIN_PASSWORD
  pgadmin_admin_password:
    environment: AZURPILOT_OBSERVABILITY_PGADMIN_ADMIN_PASSWORD
  pgadmin_pgpass:
    environment: AZURPILOT_OBSERVABILITY_PGADMIN_PGPASS
  redis_app_password:
    environment: AZURPILOT_REDIS_PASSWORD
  redis_admin_password:
    environment: AZURPILOT_REDIS_ADMIN_PASSWORD
