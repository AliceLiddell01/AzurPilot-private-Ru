name: azurpilot-infrastructure

services:
  postgres:
    image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${AZURPILOT_POSTGRES_DATABASE:-azurpilot}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
      POSTGRES_INITDB_ARGS: --auth-local=peer --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:${AZURPILOT_POSTGRES_PORT:-5432}:5432"
    secrets:
      - postgres_bootstrap_password
      - postgres_app_password
      - postgres_migrator_password
    volumes:
      - type: bind
        source: ./postgres/init
        target: /docker-entrypoint-initdb.d
        read_only: true
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "gosu postgres pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  alloy:
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - type: bind
        source: ./alloy/config.alloy
        target: /etc/alloy/config.alloy
        read_only: true
      - type: volume
        source: alloy-data
        target: /var/lib/alloy/data
  loki:
    image: grafana/loki:3.7.4@sha256:87f0a067673756a3cede1bcbf0c74875f7df9b09fddb53e399d0c576f756cfcc
    command:
      - -config.file=/etc/loki/config.yaml
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "3100"
    volumes:
      - type: bind
        source: ./loki/config.yaml
        target: /etc/loki/config.yaml
        read_only: true
      - type: volume
        source: loki-data
        target: /loki
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "9090"
    volumes:
      - type: bind
        source: ./prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: volume
        source: prometheus-data
        target: /prometheus
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:9090/-/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  tempo:
    image: grafana/tempo:2.10.5@sha256:ee21727732c7a7199cb71c3eee9153bbf23f9b0b87619f0555a0cf21a67f1a33
    command:
      - -config.file=/etc/tempo/config.yaml
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "3200"
      - "4317"
      - "4318"
    volumes:
      - type: bind
        source: ./tempo/config.yaml
        target: /etc/tempo/config.yaml
        read_only: true
      - type: volume
        source: tempo-data
        target: /var/tempo
  grafana:
    image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    depends_on:
      alloy:
        condition: service_started
      loki:
        condition: service_started
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${AZURPILOT_OBSERVABILITY_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    secrets:
      - grafana_admin_password
    volumes:
      - type: bind
        source: ./grafana/provisioning/datasources
        target: /etc/grafana/provisioning/datasources
        read_only: true
      - type: volume
        source: grafana-data
        target: /var/lib/grafana
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
    name: azurpilot-postgres-data
  alloy-data:
    external: true
    name: azurpilot-observability_alloy-data
  loki-data:
    external: true
    name: azurpilot-observability_loki-data
  prometheus-data:
    external: true
    name: azurpilot-observability_prometheus-data
  tempo-data:
    external: true
    name: azurpilot-observability_tempo-data
  grafana-data:
    external: true
    name: azurpilot-observability_grafana-data

secrets:
  postgres_bootstrap_password:
    environment: AZURPILOT_POSTGRES_DOCKER_BOOTSTRAP_PASSWORD
  postgres_app_password:
    environment: AZURPILOT_POSTGRES_PASSWORD
  postgres_migrator_password:
    environment: AZURPILOT_POSTGRES_MIGRATOR_PASSWORD
  grafana_admin_password:
    environment: AZURPILOT_OBSERVABILITY_GRAFANA_ADMIN_PASSWORD
