Deploy:
  Python:
    PythonExecutable: ./.venv/bin/python
    PypiMirror: null
    InstallDependencies: true

  Adb:
    AdbExecutable: ./.venv/bin/adb
    ReplaceAdb: true
    AutoConnect: true
    InstallUiautomator2: true

  Ocr:
    UseOcrServer: false
    StartOcrServer: false
    OcrServerPort: 22268
    OcrClientAddress: 127.0.0.1:22268

  Misc:
    DiscordRichPresence: false

  RemoteAccess:
    EnableRemoteAccess: false
    RemoteAccessMode: auto
    SSHUser: null
    SSHServer: null
    SSHExecutable: ssh
    AllowedRedirectHosts: null
    MaxRedirects: 2
    SignalingServer: null
    StunServers: ["stun:stun.l.google.com:19302"]
    TurnServers: null
    TurnCredentialMode: static

  Webui:
    WebuiHost: 0.0.0.0
    WebuiPort: 25548
    RuntimeHandoverGraceSeconds: 30
    Language: ru-RU
    Theme: default
    DpiScaling: true
    EnableReload: true
    Password: null
    CDN: false
    Run: null
    WebuiSSLKey: null
    WebuiSSLCert: null
