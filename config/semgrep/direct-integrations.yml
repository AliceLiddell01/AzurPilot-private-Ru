rules:
  - id: azurpilot-shell-invocation
    languages:
      - python
    message: "Не используйте shell invocation в ограниченном subprocess прямой интеграции."
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: os.system(...)
          - pattern: os.popen(...)
          - pattern: subprocess.$FUNCTION(..., shell=$FLAG, ...)
      - pattern-not: subprocess.$FUNCTION(..., shell=False, ...)
