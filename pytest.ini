[pytest]
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning
    # Внешний cached-property остаётся транзитивной зависимостью
    # uiautomator2 2.x; фильтр ограничен его точным сообщением.
    ignore:^'asyncio\.iscoroutinefunction' is deprecated and slated for removal in Python 3\.16; use inspect\.iscoroutinefunction\(\) instead$:DeprecationWarning:^cached_property$
    # PyWebIO 1.7.1 и актуальный upstream используют этот устаревший API;
    # фильтр временный и не скрывает другие предупреждения библиотеки.
    ignore:^'asyncio\.iscoroutinefunction' is deprecated and slated for removal in Python 3\.16; use inspect\.iscoroutinefunction\(\) instead$:DeprecationWarning:^pywebio\.utils$
max_warnings = 0
markers =
    windows_integration: тесты, требующие реальный Windows project venv и runtime-процессы
