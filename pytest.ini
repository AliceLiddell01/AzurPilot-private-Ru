[pytest]
testpaths = tests
addopts = --strict-markers
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning
    # Внешний cached-property остаётся транзитивной зависимостью
    # uiautomator2 2.x; фильтр ограничен его точным сообщением.
    ignore:^'asyncio\.iscoroutinefunction' is deprecated and slated for removal in Python 3\.16; use inspect\.iscoroutinefunction\(\) instead$:DeprecationWarning:^cached_property$
    # PyWebIO и актуальный upstream используют этот устаревший API;
    # фильтр временный и не скрывает другие предупреждения библиотеки.
    ignore:^'asyncio\.iscoroutinefunction' is deprecated and slated for removal in Python 3\.16; use inspect\.iscoroutinefunction\(\) instead$:DeprecationWarning:^pywebio\.utils$
    # Starlette 1.6.0 пока обращается к устаревшему alias AnyIO в аннотации;
    # фильтр ограничен точным сообщением и модулем upstream.
    ignore:^The anyio\.abc\.BlockingPortal alias is deprecated, use anyio\.from_thread\.BlockingPortal instead\.$:DeprecationWarning:^starlette\.testclient$
    # Python 3.14 сообщает о существующей конструкции внешней зависимости;
    # фильтр ограничен точным текстом предупреждения.
    ignore:^'return' in a 'finally' block$:SyntaxWarning
max_warnings = 0
markers =
    windows_integration: тесты, требующие реальный Windows project venv и runtime-процессы
    xdist_group(name): группа тестов pytest-xdist, требующая последовательного назначения одному worker
