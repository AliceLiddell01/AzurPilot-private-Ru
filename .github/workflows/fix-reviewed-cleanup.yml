name: One-time reviewed cleanup fixes

on:
  push:
    branches:
      - chatgpt/remove-upstream-announcements
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.ref_name == 'chatgpt/remove-upstream-announcements' || github.head_ref == 'chatgpt/remove-upstream-announcements' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: chatgpt/remove-upstream-announcements
          fetch-depth: 1
          persist-credentials: true

      - name: Apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def block(lines):
              return "\n".join(lines) + "\n"

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one sentinel, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8", newline="")

          docker_path = Path("deploy/docker/deploy-image.sh")
          docker_lines = docker_path.read_text(encoding="utf-8").splitlines()
          printf_index = next(
              (index for index, line in enumerate(docker_lines)
               if line.startswith("    printf 'deb [arch=%s signed-by=/etc/apt/keyrings/docker.gpg]")),
              None,
          )
          value_index = next(
              (index for index, line in enumerate(docker_lines)
               if "dpkg --print-architecture" in line and "${VERSION_CODENAME}" in line),
              None,
          )
          if printf_index is None or value_index is None or value_index != printf_index + 1:
              raise SystemExit("deploy-image.sh: Docker apt repository sentinel not found")
          docker_lines[value_index] = docker_lines[value_index].replace(
              "${VERSION_CODENAME}", "${codename}", 1
          )
          docker_lines[printf_index:printf_index] = [
              '    local codename="${VERSION_CODENAME}"',
              '    if [ "${distro}" = "ubuntu" ]; then',
              '        codename="${UBUNTU_CODENAME:-${VERSION_CODENAME}}"',
              "    fi",
              "",
          ]
          docker_path.write_text("\n".join(docker_lines) + "\n", encoding="utf-8", newline="")

          replace_once(
              ".github/scripts/ai_issue_labeler.py",
              block([
                  '    parts = split_repository(os.environ.get("GITHUB_REPOSITORY", ""))',
                  "    if parts:",
                  "        return parts",
              ]),
              block([
                  '    parts = split_repository(os.environ.get("GITHUB_REPOSITORY", ""))',
                  '    if parts and all(parts) and "/" not in parts[1]:',
                  "        return parts",
              ]),
          )

          replace_once(
              "tests/test_no_upstream_project_network_defaults.py",
              block([
                  "def _iter_text_files():",
                  "    for path in SCAN_FILES:",
                  "        if path.is_file():",
                  "            yield path",
                  "    for root in SCAN_ROOTS:",
                  "        if not root.exists():",
                  "            continue",
                  '        for path in root.rglob("*"):',
                  "            if path.is_file() and path.suffix.lower() in TEXT_SUFFIXES:",
                  "                yield path",
              ]),
              block([
                  "def _iter_text_files():",
                  "    tracked = subprocess.run(",
                  '        ["git", "ls-files", "-z"],',
                  "        cwd=ROOT,",
                  "        check=True,",
                  "        capture_output=True,",
                  "    ).stdout",
                  '    for raw_path in tracked.split(b"\\0"):',
                  "        if not raw_path:",
                  "            continue",
                  '        path = ROOT / raw_path.decode("utf-8", errors="surrogateescape")',
                  "        if not path.is_file():",
                  "            continue",
                  "        try:",
                  '            with path.open("rb") as stream:',
                  "                prefix = stream.read(8192)",
                  "        except OSError:",
                  "            continue",
                  '        if b"\\0" in prefix:',
                  "            continue",
                  "        yield path",
              ]),
          )

          replace_once(
              "tests/test_no_upstream_project_network_defaults.py",
              block([
                  '    assert "max_tokens=1200" in llm_runtime',
                  '    assert "lines[-200:]" in llm_runtime',
              ]),
              block([
                  '    assert "max_tokens=1200" in llm_runtime',
                  '    assert "_read_log_tail(logger.log_file)" in llm_runtime',
                  '    assert "max_bytes=64 * 1024" in llm_runtime',
                  '    assert "max_lines=200" in llm_runtime',
                  '    assert "stream.read(max_bytes)" in llm_runtime',
                  '    assert ".readlines()" not in llm_runtime',
              ]),
          )

          replace_once(
              "tests/test_no_upstream_project_network_defaults.py",
              '    assert "https://download.docker.com/linux/" in docker_deploy\n',
              block([
                  '    assert "https://download.docker.com/linux/" in docker_deploy',
                  '    assert \'codename="${UBUNTU_CODENAME:-${VERSION_CODENAME}}"\' in docker_deploy',
                  '    assert \'"${distro}" "${codename}"\' in docker_deploy',
              ]),
          )

          replace_once(
              "tests/test_no_upstream_project_network_defaults.py",
              '    assert "uiautomator2cache" in u2_sources[2]\n',
              block([
                  '    assert "uiautomator2cache" in u2_sources[2]',
                  '    assert "if not cache_dir or not os.path.isdir(cache_dir):" in u2_sources[2]',
                  '    assert "raise RuntimeError(message)" in u2_sources[2]',
                  '    assert "внешний источник ресурсов" in u2_sources[2]',
              ]),
          )

          replace_once(
              "tests/test_shared_runtime_handlers_messages.py",
              '    assert "https://www.baidu.com" not in server\n',
              '    assert "https://www." + "baidu.com" not in server\n',
          )
          PY

      - name: Retire one-time workflow
        shell: bash
        run: rm .github/workflows/fix-reviewed-cleanup.yml

      - name: Verify focused changes
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/docker/deploy-image.sh
          python -m py_compile .github/scripts/ai_issue_labeler.py
          python -m py_compile module/llm.py deploy/patch.py
          git diff --check

      - name: Commit reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No reviewed fixes generated.' >&2; exit 1; }
          git commit -m "fix(review): harden cleanup edge cases"
          git push origin HEAD:chatgpt/remove-upstream-announcements
