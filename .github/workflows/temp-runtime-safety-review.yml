name: TEMP Runtime safety review fixes

on:
  pull_request:
    branches:
      - personal/stable
    paths:
      - .github/temp_runtime_safety_fix.py

permissions:
  contents: write

concurrency:
  group: temp-runtime-safety-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  fix-and-verify:
    name: Runtime safety fixes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - name: Validate environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          uv lock --check
          uv sync --locked --group ci

      - name: Apply fixes
        shell: bash
        run: |
          set -euo pipefail
          python .github/temp_runtime_safety_fix.py

      - name: Verify fixes
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked ruff check . --select E9,F63,F7,F82 --ignore F821,F722
          uv run --locked --group ci python -m compileall -q \
            module/logger.py \
            dev_tools/map_extractor.py \
            module/map/map_fleet_preparation.py \
            module/retire/retirement.py \
            module/shop_event/ui.py
          uv run --locked --group ci python -m pytest -q \
            tests/test_logging_core.py \
            tests/test_event_map_extractor_collision.py \
            tests/test_map_fleet_preparation_clear.py \
            tests/test_retirement_game_tips_scope.py \
            tests/test_event_shop_scroll_stability.py \
            tests/test_event_shop_scroll_terminal.py \
            tests/test_event_shop_reidentify_recovery.py
          git diff --check

      - name: Commit verified code changes
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            dev_tools/map_extractor.py \
            module/logger.py \
            module/map/map_fleet_preparation.py \
            module/retire/retirement.py \
            module/shop_event/ui.py \
            tests/test_event_map_extractor_collision.py \
            tests/test_event_shop_scroll_stability.py \
            tests/test_logging_core.py \
            tests/test_map_fleet_preparation_clear.py \
            tests/test_retirement_game_tips_scope.py
          actual=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' \
            dev_tools/map_extractor.py \
            module/logger.py \
            module/map/map_fleet_preparation.py \
            module/retire/retirement.py \
            module/shop_event/ui.py \
            tests/test_event_map_extractor_collision.py \
            tests/test_event_shop_scroll_stability.py \
            tests/test_logging_core.py \
            tests/test_map_fleet_preparation_clear.py \
            tests/test_retirement_game_tips_scope.py | sort)
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(runtime): усилить безопасный отказ на пограничных состояниях"
          git push origin HEAD:refactor/stage5-event-architecture
