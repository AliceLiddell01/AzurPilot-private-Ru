name: Regenerate Data Logger audit baselines

on:
  push:
    branches:
      - fix/opsi-data-logger
    paths:
      - .github/workflows/opsi-data-logger-regenerate.yml

permissions:
  contents: write

concurrency:
  group: opsi-data-logger-regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: fix/opsi-data-logger
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: |
          uv sync --frozen
          uv pip install pytest

      - name: Run focused Data Logger tests
        run: >-
          PYTHONPATH=. uv run pytest -q
          tests/test_opsi_data_logger.py
          tests/test_opsi_data_logger_review_contract.py

      - name: Regenerate Russianization audit results
        run: PYTHONPATH=. uv run python -m dev_tools.russianization_audit --write

      - name: Reject unexpected generated changes
        shell: bash
        run: |
          unexpected="$(git diff --name-only | grep -v '^dev_tools/russianization/results/' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected files changed by generator:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git diff --check

      - name: Commit generated audit results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev_tools/russianization/results
          if git diff --cached --quiet; then
            echo "Audit results are already current"
            exit 0
          fi
          git commit -m "chore(audit): refresh Data Logger baselines"
          git push origin HEAD:fix/opsi-data-logger
