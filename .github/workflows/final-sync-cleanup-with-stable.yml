name: One-time final cleanup sync with stable

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.head_ref == 'chatgpt/remove-upstream-announcements' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: chatgpt/remove-upstream-announcements
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current personal/stable without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin personal/stable
          git merge --no-commit --no-ff origin/personal/stable
          rm .github/workflows/final-sync-cleanup-with-stable.yml
          git add -A
          git diff --check --cached
          git commit -m "chore(sync): подтянуть актуальный personal/stable"
          git push origin HEAD:chatgpt/remove-upstream-announcements
