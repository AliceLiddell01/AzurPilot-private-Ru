name: One-time legacy AzurStats config cleanup

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.head_ref == 'chatgpt/remove-upstream-announcements' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: chatgpt/remove-upstream-announcements
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --group ci

      - name: Remove dead remote AzurStats schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str = "") -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one sentinel, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8", newline="")

          replace_once(
              "module/config/argument/argument.yaml",
              "  AzurStatsID: null\n"
              "  API:\n"
              "    value: default\n"
              "    option: [default, cn_gz_reverse_proxy]\n",
          )
          replace_once(
              "module/config/config_updater.py",
              "        # 处理 AzurStatsID\n"
              "        if is_template:\n"
              "            deep_set(new, 'Alas.DropRecord.AzurStatsID', None)\n"
              "        else:\n"
              "            deep_default(new, 'Alas.DropRecord.AzurStatsID', random_id())\n",
          )
          PY

      - name: Regenerate config artifacts
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked -m dev_tools.button_extract
          uv run --locked -m module.config.config_updater

      - name: Remove obsolete translation-only entries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          for filename in ("ru-RU.json", "en-US.json"):
              path = Path("module/config/i18n") / filename
              data = json.loads(path.read_text(encoding="utf-8"))
              group = data.get("DropRecord")
              if not isinstance(group, dict):
                  raise SystemExit(f"{filename}: DropRecord group missing")
              group.pop("AzurStatsID", None)
              group.pop("API", None)
              path.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
                  newline="",
              )
          PY

      - name: Add focused regression test
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/test_azurstats_legacy_remote_config_removed.py <<'PY'
          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]


          def test_legacy_remote_azurstats_config_is_absent():
              paths = (
                  "module/config/argument/argument.yaml",
                  "module/config/argument/args.json",
                  "module/config/config_generated.py",
                  "config/template.json",
                  "module/config/i18n/ru-RU.json",
                  "module/config/i18n/en-US.json",
                  "module/config/config_updater.py",
                  "module/config/redirect_utils/utils.py",
              )
              forbidden = (
                  "AzurStats" + "ID",
                  "cn_gz_" + "reverse_proxy",
                  "azur-stats." + "lyoko.io",
              )
              hits = {}
              for relative in paths:
                  text = (ROOT / relative).read_text(encoding="utf-8")
                  for token in forbidden:
                      if token in text:
                          hits.setdefault(token, []).append(relative)

              assert not hits, "Legacy remote AzurStats configuration returned: " + repr(hits)
          PY

      - name: Retire one-time workflow and trigger marker
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/cleanup-azurstats-legacy.yml
          rm -f .github/azurstats-cleanup-trigger.tmp

      - name: Verify cleanup
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --group ci python -m pytest -q \
            tests/test_azurstats_local_runtime.py \
            tests/test_azurstats_legacy_remote_config_removed.py \
            tests/test_no_upstream_project_network_defaults.py
          git diff --check

      - name: Commit generated cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No AzurStats cleanup changes generated.' >&2; exit 1; }
          git commit -m "refactor(stats): удалить legacy remote AzurStats config"
          git push origin HEAD:chatgpt/remove-upstream-announcements
