name: One-time explicit public IP cleanup

on:
  push:
    branches:
      - chatgpt/remove-upstream-announcements
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.ref_name == 'chatgpt/remove-upstream-announcements' || github.head_ref == 'chatgpt/remove-upstream-announcements' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: chatgpt/remove-upstream-announcements
          fetch-depth: 1

      - name: Make public IP lookup explicit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script = Path("deploy/docker/deploy-image.sh")
          text = script.read_text(encoding="utf-8")
          old = '''get_public_ip() {
    local ip
    if ip="$(curl -fsSL --max-time 5 "https://ifconfig.me/ip" 2>/dev/null)"; then
        printf '%s\\n' "${ip}"
        return
    fi
    t ip_failed
}
'''
          new = '''get_public_ip() {
    # Публичный IP нельзя надёжно определить без внешнего сервиса.
    # Не делаем скрытый запрос: владелец может передать адрес явно.
    if [ -n "${AZURPILOT_PUBLIC_IP:-}" ]; then
        printf '%s\\n' "${AZURPILOT_PUBLIC_IP}"
        return
    fi
    t ip_failed
}
'''
          if text.count(old) != 1:
              raise SystemExit("deploy-image.sh: public-IP sentinel not found exactly once")
          script.write_text(text.replace(old, new, 1), encoding="utf-8", newline="")

          test_path = Path("tests/test_no_upstream_project_network_defaults.py")
          test_text = test_path.read_text(encoding="utf-8")
          old_test = '    assert "https://ifconfig.me/ip" in docker_deploy\n'
          new_test = (
              '    assert "https://ifconfig.me/ip" not in docker_deploy\n'
              '    assert "AZURPILOT_PUBLIC_IP" in docker_deploy\n'
          )
          if test_text.count(old_test) != 1:
              raise SystemExit("network test: ifconfig assertion not found exactly once")
          test_path.write_text(test_text.replace(old_test, new_test, 1), encoding="utf-8", newline="")
          PY

      - name: Retire one-time workflow
        shell: bash
        run: |
          rm .github/workflows/cleanup-public-ip.yml
          rm -f .github/public-ip-cleanup-trigger.tmp

      - name: Verify focused cleanup
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/docker/deploy-image.sh
          ! grep -F 'https://ifconfig.me/ip' deploy/docker/deploy-image.sh
          grep -F 'AZURPILOT_PUBLIC_IP' deploy/docker/deploy-image.sh
          uv run --locked --group ci python -m pytest -q tests/test_no_upstream_project_network_defaults.py
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No public-IP cleanup changes generated.' >&2; exit 1; }
          git commit -m "refactor(docker): сделать public IP lookup явным"
          git push origin HEAD:chatgpt/remove-upstream-announcements
