name: One-time final residue cleanup v3

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.head_ref == 'chatgpt/remove-upstream-announcements' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chatgpt/remove-upstream-announcements
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --group ci

      - name: Remove dormant GitCode compatibility from AI labeler
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str = "") -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one sentinel, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="")

          script = Path(".github/scripts/ai_issue_labeler.py")
          replace_once(
              script,
              '''def platform_name():\n    platform = os.environ.get("LABELER_PLATFORM", "github").strip().lower()\n    if platform not in {"github", "gitcode"}:\n        raise RuntimeError(f"Unsupported LABELER_PLATFORM: {platform}")\n\n    return platform\n''',
              '''def platform_name():\n    """This private fork runs the labeler only on GitHub Actions."""\n    return "github"\n''',
          )
          replace_once(
              script,
              '''def read_event():\n    event_path = (\n        os.environ.get("GITHUB_EVENT_PATH")\n        or os.environ.get("GITCODE_EVENT_PATH")\n        or os.environ.get("CI_EVENT_PATH")\n    )\n    if not event_path:\n        event_json = (\n            os.environ.get("GITHUB_EVENT_JSON")\n            or os.environ.get("GITCODE_EVENT_JSON")\n            or os.environ.get("CI_EVENT_JSON")\n        )\n        if event_json:\n            return json.loads(event_json)\n\n        return {}\n\n    with open(event_path, "r", encoding="utf-8") as fp:\n        return json.load(fp)\n''',
              '''def read_event():\n    event_path = os.environ.get("GITHUB_EVENT_PATH")\n    if not event_path:\n        event_json = os.environ.get("GITHUB_EVENT_JSON")\n        return json.loads(event_json) if event_json else {}\n\n    with open(event_path, "r", encoding="utf-8") as fp:\n        return json.load(fp)\n''',
          )

          text = script.read_text(encoding="utf-8")
          start = text.index("def repo_parts(event, platform):\n")
          end = text.index("\n\ndef api_request(", start)
          replacement = '''def repo_parts(event, platform):\n    del event, platform\n    parts = split_repository(os.environ.get("GITHUB_REPOSITORY", ""))\n    if parts:\n        return parts\n    raise RuntimeError("Missing or invalid GITHUB_REPOSITORY")\n'''
          script.write_text(text[:start] + replacement + text[end:], encoding="utf-8", newline="")

          text = script.read_text(encoding="utf-8")
          start = text.index("def gitcode_api(")
          end = text.index("\n\ndef api(platform,", start)
          script.write_text(text[:start] + text[end + 2:], encoding="utf-8", newline="")
          replace_once(
              script,
              '''def api(platform, method, path, token, payload=None):\n    if platform == "github":\n        return github_api(method, path, token, payload)\n    if platform == "gitcode":\n        return gitcode_api(method, path, token, payload)\n\n    raise RuntimeError(f"Unsupported platform: {platform}")\n''',
              '''def api(platform, method, path, token, payload=None):\n    if platform != "github":\n        raise RuntimeError(f"Unsupported platform: {platform}")\n    return github_api(method, path, token, payload)\n''',
          )
          replace_once(
              script,
              '''    while True:\n        path = f"/repos/{safe_owner}/{safe_repo}/labels"\n        if platform == "github":\n            path = f"{path}?per_page=100&page={page}"\n\n        batch = api(\n            platform,\n            "GET",\n            path,\n            token,\n        )\n        if not batch:\n            return labels\n\n        labels.extend(batch)\n\n        if platform == "gitcode" or len(batch) < 100:\n            return labels\n\n        page += 1\n''',
              '''    while True:\n        path = f"/repos/{safe_owner}/{safe_repo}/labels?per_page=100&page={page}"\n        batch = api(\n            platform,\n            "GET",\n            path,\n            token,\n        )\n        if not batch:\n            return labels\n\n        labels.extend(batch)\n        if len(batch) < 100:\n            return labels\n        page += 1\n''',
          )
          replace_once(
              script,
              '    payload = {"labels": labels} if platform == "github" else labels\n',
              '    payload = {"labels": labels}\n',
          )

          text = script.read_text(encoding="utf-8")
          start = text.index("def gitcode_event_issue(")
          end = text.index("\n\ndef issue_number_from_event(", start)
          script.write_text(text[:start] + text[end + 2:], encoding="utf-8", newline="")
          text = script.read_text(encoding="utf-8")
          start = text.index("def issue_number_from_event(event):\n")
          end = text.index("\n\ndef pr_number_from_event(", start)
          replacement = '''def issue_number_from_event(event):\n    inputs = event.get("inputs") or {}\n    return inputs.get("issue_number") or os.environ.get("ISSUE_NUMBER")\n'''
          script.write_text(text[:start] + replacement + text[end:], encoding="utf-8", newline="")
          replace_once(
              script,
              '''    if platform == "gitcode":\n        issue = gitcode_event_issue(event)\n        if issue:\n            return issue\n\n''',
          )
          replace_once(
              script,
              '''    token = (\n        os.environ.get("GITHUB_TOKEN")\n        if platform == "github"\n        else os.environ.get("GITCODE_TOKEN") or os.environ.get("GITCODE_ACCESS_TOKEN")\n    )\n    if not token:\n        token_name = "GITHUB_TOKEN" if platform == "github" else "GITCODE_TOKEN"\n        raise RuntimeError(f"Missing {token_name}")\n''',
              '''    token = os.environ.get("GITHUB_TOKEN")\n    if not token:\n        raise RuntimeError("Missing GITHUB_TOKEN")\n''',
          )
          PY

      - name: Remove dead announcement frontend and translation key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          js = Path("assets/gui/js/alas-utils.js")
          text = js.read_text(encoding="utf-8")
          old_header = " * 公告弹窗、截图查看器、自动刷新等前端功能\n"
          if text.count(old_header) != 1:
              raise SystemExit("alas-utils.js: announcement header sentinel missing")
          text = text.replace(old_header, " * 截图查看器、自动刷新等前端功能\n", 1)
          marker = "// ============================================================\n// 公告系统\n// ============================================================\n(function () {\n"
          if text.count(marker) != 1:
              raise SystemExit("alas-utils.js: announcement block marker missing")
          js.write_text(text.split(marker, 1)[0].rstrip() + "\n", encoding="utf-8", newline="")

          gui = Path("module/config/argument/gui.yaml")
          text = gui.read_text(encoding="utf-8")
          old = "MenuDevelop:\n  HomePage:\n  Translate:\n  Announcement:\n  Remote:\n  Setting:\n  Utils:\n"
          new = "MenuDevelop:\n  HomePage:\n  Translate:\n  Remote:\n  Setting:\n  Utils:\n"
          if text.count(old) != 1:
              raise SystemExit("gui.yaml: MenuDevelop announcement sentinel missing")
          gui.write_text(text.replace(old, new, 1), encoding="utf-8", newline="")
          PY

      - name: Remove obsolete ApiClient shim and stale tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          combat = Path("module/combat/combat.py")
          text = combat.read_text(encoding="utf-8")
          sentinel = "from module.base.api_client import ApiClient\n"
          if text.count(sentinel) != 1:
              raise SystemExit("combat.py: ApiClient import sentinel missing or duplicated")
          combat.write_text(text.replace(sentinel, "", 1), encoding="utf-8", newline="")

          test = Path("tests/test_shared_handlers_base_runtime_messages.py")
          text = test.read_text(encoding="utf-8")
          old = '''    def test_live_first_party_cjk_false_negatives_are_removed(self):\n        api = source("module/base/api_client.py")\n        fast_forward = source("module/handler/fast_forward.py")\n        assert 'domain_type = "主域名"' not in api\n        assert 'domain_type = "备用域名"' not in api\n        assert "task_stop('无法确保自动搜索设置。')" not in fast_forward\n\n    def test_project_api_network_contract_is_removed(self):\n        text = source("module/base/api_client.py")\n        forbidden = (\n            "PRIMARY_DOMAIN",\n            "FALLBACK_DOMAIN",\n            "ANNOUNCEMENT_PATH",\n            "ANNOUNCEMENT_CHECK_INTERVAL",\n            "requests.get(",\n            "get_announcement",\n            'data.get("announcementId")',\n            'data.get("title")',\n            'data.get("content")',\n            'data.get("url")',\n        )\n        for token in forbidden:\n            assert token not in text, token\n        assert "class ApiClient:" in text\n        assert "pass" in text\n\n'''
          new = '''    def test_live_first_party_cjk_false_negatives_are_removed(self):\n        fast_forward = source("module/handler/fast_forward.py")\n        assert "task_stop('无法确保自动搜索设置。')" not in fast_forward\n\n    def test_project_api_network_contract_is_removed(self):\n        assert not (ROOT / "module/base/api_client.py").exists()\n        combat = source("module/combat/combat.py")\n        assert "module.base." + "api_client" not in combat\n        assert "Api" + "Client" not in combat\n\n'''
          if text.count(old) != 1:
              raise SystemExit("runtime messages test: ApiClient contract sentinel missing")
          test.write_text(text.replace(old, new, 1), encoding="utf-8", newline="")
          PY
          git rm module/base/api_client.py

      - name: Regenerate GUI/config artifacts
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked -m dev_tools.button_extract
          uv run --locked -m module.config.config_updater
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("module/config/i18n/en-US.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          menu = data.get("Gui", {}).get("MenuDevelop", {})
          removed = menu.pop("Announcement", None)
          if removed is None:
              raise SystemExit("en-US Gui.MenuDevelop.Announcement legacy key not found")
          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
              newline="",
          )
          PY

      - name: Extend regression contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_no_upstream_project_network_defaults.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''    issue_labeler = (ROOT / ".github/workflows/ai-issue-labeler.yml").read_text(\n        encoding="utf-8"\n    )\n'''
          replacement = anchor + '''    issue_labeler_script = (ROOT / ".github/scripts/ai_issue_labeler.py").read_text(\n        encoding="utf-8"\n    )\n    alas_utils = (ROOT / "assets/gui/js/alas-utils.js").read_text(encoding="utf-8")\n    gui_argument = (ROOT / "module/config/argument/gui.yaml").read_text(encoding="utf-8")\n    ru_i18n = (ROOT / "module/config/i18n/ru-RU.json").read_text(encoding="utf-8")\n    en_i18n = (ROOT / "module/config/i18n/en-US.json").read_text(encoding="utf-8")\n    combat_runtime = (ROOT / "module/combat/combat.py").read_text(encoding="utf-8")\n'''
          if text.count(anchor) != 1:
              raise SystemExit("network cleanup test: issue_labeler anchor missing")
          text = text.replace(anchor, replacement, 1)
          anchor = '''    # AI labeler остаётся доступен, но запускается только вручную и не навязывает провайдера/модель.\n'''
          block = '''    # Остатки удалённой announcement/API инфраструктуры не должны возвращаться.\n    announcement_tokens = (\n        "alasShow" + "Announcement",\n        "alas_shown_" + "announcements",\n        "alas-announcement-" + "modal",\n    )\n    for token in announcement_tokens:\n        assert token not in alas_utils\n    assert "  Announcement:\\n" not in gui_argument\n    assert '\"Announcement\":' not in ru_i18n\n    assert '\"Announcement\":' not in en_i18n\n    assert not (ROOT / "module/base/api_client.py").exists()\n    assert "module.base." + "api_client" not in combat_runtime\n    assert "Api" + "Client" not in combat_runtime\n\n    # Labeler теперь GitHub-only: dormant GitCode transport/event compatibility удалена.\n    gitcode_token = "git" + "code"\n    assert gitcode_token not in issue_labeler_script.lower()\n    assert "LABELER_PLATFORM" not in issue_labeler\n    assert "GITHUB_REPOSITORY" in issue_labeler_script\n    assert "https://api.github.com" in issue_labeler_script\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit("network cleanup test: AI labeler contract anchor missing")
          path.write_text(text.replace(anchor, block + anchor, 1), encoding="utf-8", newline="")
          PY

      - name: Verify focused cleanup
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python -m py_compile .github/scripts/ai_issue_labeler.py module/combat/combat.py
          uv run --locked --group ci python -m pytest -q \
            tests/test_no_upstream_project_network_defaults.py \
            tests/test_shared_handlers_base_runtime_messages.py \
            tests/test_shared_webui_localization_contracts.py
          if git grep -ni 'gitcode' -- .github/scripts/ai_issue_labeler.py; then
            echo 'Dormant GitCode labeler support remains.' >&2
            exit 1
          fi
          if git grep -n -E 'alasShowAnnouncement|alas_shown_announcements|alas-announcement-modal' -- assets/gui/js/alas-utils.js; then
            echo 'Dead announcement frontend remains.' >&2
            exit 1
          fi
          if git grep -n -E 'module\.base\.api_client|ApiClient' -- '*.py' ':!tests/test_no_upstream_project_network_defaults.py' ':!tests/test_shared_handlers_base_runtime_messages.py'; then
            echo 'ApiClient references remain after shim deletion.' >&2
            exit 1
          fi
          git diff --check

      - name: Commit non-workflow cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --name-status
          git diff --cached --quiet && { echo 'Expected cleanup changes were not generated.' >&2; exit 1; }
          git commit -m "refactor(network): удалить остатки announcement API и GitCode"
          git push origin HEAD:chatgpt/remove-upstream-announcements
