name: One-time uncensored cleanup codegen

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.head_ref == 'chatgpt/remove-upstream-announcements' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chatgpt/remove-upstream-announcements
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --group ci

      - name: Remove CN-only uncensored feature at generator sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str = "") -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one sentinel, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8", newline="")

          replace_once(
              "module/config/argument/argument.yaml",
              "AzurLaneUncensored:\n"
              "  Repository:\n"
              "    value: https://gitee.com/LmeSzinc/AzurLaneUncensored\n"
              "    display: disabled\n",
          )
          replace_once(
              "module/config/argument/task.yaml",
              "    AzurLaneUncensored:\n"
              "      - AzurLaneUncensored\n",
          )
          replace_once(
              "alas.py",
              "    def azur_lane_uncensored(self):\n"
              "        from module.daemon.uncensored import AzurLaneUncensored\n"
              "        AzurLaneUncensored(config=self.config, device=self.device, task=\"AzurLaneUncensored\").run()\n"
              "\n",
          )
          replace_once(
              "module/submodule/utils.py",
              "        'AzurLaneUncensored',\n",
          )

          test_path = Path("tests/test_no_upstream_project_network_defaults.py")
          test_text = test_path.read_text(encoding="utf-8")
          scan_anchor = "    ROOT / \"PRIVACY_AND_DISCLAIMER.md\",\n)"
          if scan_anchor not in test_text:
              raise SystemExit("network cleanup test: SCAN_FILES anchor not found")
          test_text = test_text.replace(
              scan_anchor,
              "    ROOT / \"PRIVACY_AND_DISCLAIMER.md\",\n    ROOT / \"alas.py\",\n)",
              1,
          )
          guard = '''\n\ndef test_global_only_fork_has_no_cn_uncensored_tool():\n    token = "AzurLane" + "Uncensored"\n    hits: list[str] = []\n    for path in _iter_text_files():\n        text = path.read_text(encoding="utf-8", errors="ignore")\n        if token in text:\n            hits.append(str(path.relative_to(ROOT)))\n\n    assert not (ROOT / "module/daemon/uncensored.py").exists()\n    assert not hits, "CN-only uncensored feature returned: " + ", ".join(hits)\n'''
          if "test_global_only_fork_has_no_cn_uncensored_tool" in test_text:
              raise SystemExit("network cleanup test: uncensored guard already exists")
          test_path.write_text(test_text.rstrip() + guard + "\n", encoding="utf-8", newline="")
          PY
          git rm module/daemon/uncensored.py

      - name: Regenerate config and localization artifacts
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked -m dev_tools.button_extract
          uv run --locked -m module.config.config_updater

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("module/config/i18n/en-US.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          task = data.get("Task", {})
          removed_task = task.pop("AzurLaneUncensored", None)
          removed_group = data.pop("AzurLaneUncensored", None)
          if removed_task is None or removed_group is None:
              raise SystemExit("en-US legacy uncensored entries were not both present")
          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
              newline="",
          )
          PY

      - name: Retire one-time workflow before validation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/cleanup-uncensored-codegen.yml
          printf '%s\n' 'generated cleanup complete; remove this marker with the GitHub connector' > .github/uncensored-cleanup.done

      - name: Verify complete removal and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n 'AzurLaneUncensored' -- . ':!tests/test_no_upstream_project_network_defaults.py'; then
            echo 'AzurLaneUncensored references remain after regeneration.' >&2
            exit 1
          fi
          if git grep -n 'gitee.com/LmeSzinc/AzurLaneUncensored' -- .; then
            echo 'Gitee uncensored endpoint remains after regeneration.' >&2
            exit 1
          fi
          if git grep -n 'e.coding.net/llop18870/alas/AzurLaneUncensored.git' -- .; then
            echo 'Coding.net uncensored mirror remains after regeneration.' >&2
            exit 1
          fi
          uv run --locked --group ci python -m pytest -q tests/test_no_upstream_project_network_defaults.py
          git diff --check

      - name: Commit generated cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --name-status
          git diff --cached --quiet && { echo 'Expected cleanup changes were not generated.' >&2; exit 1; }
          git commit -m "refactor(global): удалить CN-only AzurLaneUncensored"
          git push origin HEAD:chatgpt/remove-upstream-announcements
