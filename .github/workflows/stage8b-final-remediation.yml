name: Stage 8B final remediation

on:
  pull_request:
    paths:
      - dev_tools/stage8b_patch_remaining.py
      - .github/workflows/stage8b-final-remediation.yml

permissions:
  contents: write

concurrency:
  group: stage8b-final-remediation
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/stage8b-ocr-recognition-logs'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          ref: codex/stage8b-ocr-recognition-logs

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"

      - name: Apply targeted fixes
        run: python dev_tools/stage8b_patch_remaining.py

      - name: Compile touched files
        run: >-
          python -m py_compile
          module/daemon/ocr_benchmark.py
          module/campaign/campaign_ocr.py
          tests/test_stage8b_prompt_scenario_matrix.py

      - name: Check diff formatting
        run: git diff --check

      - name: Remove temporary remediation files
        run: |
          git rm dev_tools/stage8b_patch_remaining.py
          git rm .github/workflows/stage8b-final-remediation.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(stage8b): close remaining verifier findings"
          git push origin HEAD:codex/stage8b-ocr-recognition-logs
