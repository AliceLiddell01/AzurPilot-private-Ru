name: Stage 7 repair diagnostics

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose repair semantic scope
    if: github.event.pull_request.head.ref == 'codex/stage7-log-russianization-recovery'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Decode verified repair sources
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/stage7-repair-diagnostics"
          mkdir -p "$work/extracted"
          cat \
            .codex/tmp/stage7-repair/payload.part00 \
            .codex/tmp/stage7-repair/payload.part01a \
            .codex/tmp/stage7-repair/payload.part01b \
            .codex/tmp/stage7-repair/payload.part02 \
            .codex/tmp/stage7-repair/payload.part03a \
            .codex/tmp/stage7-repair/payload.part03b \
            .codex/tmp/stage7-repair/payload.part04 \
            .codex/tmp/stage7-repair/payload.part05 \
            .codex/tmp/stage7-repair/payload.part06 \
            > "$work/payload.b64"
          echo 'a21bbf73719a5b382aa451f7bac398e6cd558a902b86fb1a52fa894c886861c0  PAYLOAD' \
            | sed "s#PAYLOAD#$work/payload.b64#" | sha256sum -c -
          base64 --decode "$work/payload.b64" > "$work/payload.tar.gz"
          echo 'fcbca93bb65bdedb8d1fb80bb1ae506d5d276490274ad97dd0c40ed352c6fd3e  PAYLOAD' \
            | sed "s#PAYLOAD#$work/payload.tar.gz#" | sha256sum -c -
          tar -xzf "$work/payload.tar.gz" -C "$work/extracted"
          cp "$work/extracted/gui.py" gui.py
          cp "$work/extracted/dev_tools/stage7_gui_contract.py" dev_tools/stage7_gui_contract.py
          cp "$work/extracted/dev_tools/stage7_log_audit.py" dev_tools/stage7_log_audit.py
          cp "$work/extracted/dev_tools/verify_stage7.py" dev_tools/verify_stage7.py
          rm dev_tools/stage7_gui_stable_policy.py

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Generate diagnostic outputs
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen
          mkdir -p artifacts/stage7-repair-diagnostics
          set +e
          uv run python -m dev_tools.verify_stage7 \
            --base-ref origin/personal/stable \
            --output-dir artifacts/stage7-repair-diagnostics \
            > artifacts/stage7-repair-diagnostics/verifier.stdout.log \
            2> artifacts/stage7-repair-diagnostics/verifier.stderr.log
          status=$?
          set -e
          printf '%s\n' "$status" > artifacts/stage7-repair-diagnostics/exit-code.txt
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/stage7-repair-diagnostics')
          scope = json.loads((root / 'scope.json').read_text(encoding='utf-8'))
          columns = scope['columns']
          unresolved = []
          for row in scope['entries']:
              item = dict(zip(columns, row, strict=True))
              if item.get('stage_owner') == 'stage7' and item.get('translation_required'):
                  unresolved.append(item)
          (root / 'unresolved.json').write_text(
              json.dumps(unresolved, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(unresolved, ensure_ascii=False, indent=2))
          PY

      - name: Upload diagnostic outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage7-repair-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/stage7-repair-diagnostics
          if-no-files-found: error
          retention-days: 3
