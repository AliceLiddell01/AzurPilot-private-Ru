name: One-time suspicious host audit

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: read

jobs:
  audit:
    if: ${{ github.head_ref == 'chatgpt/remove-upstream-announcements' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chatgpt/remove-upstream-announcements
          fetch-depth: 1

      - name: Print suspicious external host contexts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          hosts = (
              "www.lookcos.cn",
              "www.yiiven.cn",
              "mumu.163.com",
              "wiki.biligame.com",
              "blog.csdn.net",
              "ark.yituliu.cn",
              "yituliu.site",
              "prts.maa.plus",
              "prts.plus",
              "azur-stats.lyoko.io",
              "penguin-stats.io",
              "tool.appetizer.io",
          )
          roots = [Path(".github"), Path("config"), Path("deploy"), Path("module"), Path("scripts"), Path("submodule")]
          suffixes = {".py", ".js", ".json", ".yaml", ".yml", ".md", ".sh", ".ps1", ".toml", ".txt"}

          for host in hosts:
              print(f"\n===== {host} =====")
              found = False
              for root in roots:
                  if not root.exists():
                      continue
                  for path in root.rglob("*"):
                      if not path.is_file() or path.suffix.lower() not in suffixes:
                          continue
                      try:
                          lines = path.read_text(encoding="utf-8", errors="ignore").splitlines()
                      except OSError:
                          continue
                      for number, line in enumerate(lines, 1):
                          if host.lower() in line.lower():
                              found = True
                              lo = max(1, number - 2)
                              hi = min(len(lines), number + 2)
                              print(f"--- {path}:{number} ---")
                              for index in range(lo, hi + 1):
                                  print(f"{index:>5}: {lines[index - 1]}")
              if not found:
                  print("<no matches>")
          PY
