name: TEMP Stage 9 confirmed review fixes

on:
  pull_request:
    branches:
      - personal/stable
    paths:
      - .github/temp_stage9_review_trigger.txt

permissions:
  contents: write

concurrency:
  group: temp-stage9-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  fix-and-verify:
    name: Confirmed Stage 9 review fixes
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - name: Validate environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          uv lock --check
          uv sync --locked --group ci

      - name: Apply confirmed fixes
        shell: bash
        run: |
          set -euo pipefail
          python .github/temp_stage9_review_fix.py
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_generated_event_ui_policy.py")
          text = path.read_text(encoding="utf-8")
          old = '''@pytest.mark.parametrize("layout", (None, "legacy"))
def test_legacy_or_missing_layout_keeps_config_untouched(layout):
    class Config:
        marker = object()

    marker = Config.marker
    _apply_generated_campaign_ui_policy(_module_with_config(Config), layout)

    assert vars(Config) == {
        "__module__": Config.__module__,
        "marker": marker,
        "__dict__": vars(Config)["__dict__"],
        "__weakref__": vars(Config)["__weakref__"],
        "__doc__": None,
    }
'''
          new = '''@pytest.mark.parametrize("layout", (None, "legacy"))
def test_legacy_or_missing_layout_keeps_config_untouched(layout):
    class Config:
        marker = object()

    before = dict(vars(Config))
    _apply_generated_campaign_ui_policy(_module_with_config(Config), layout)

    assert dict(vars(Config)) == before
'''
          if text.count(old) != 1:
              raise SystemExit("Не найден ожидаемый временный блок generated UI test")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify exact scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          expected = {
              ".codex/context/01-PROJECT-MAP.md",
              "module/event_datamine/artifact.py",
              "module/event_datamine/patches.py",
              "module/shop_event/catalog.py",
              "module/webui/app_event_datamine.py",
              "module/webui/app_event_general_presentation.py",
              "module/webui/app_event_general_v2.py",
              "module/webui/app_event_layout.py",
              "module/webui/app_event_planner.py",
              "module/webui/event_assets.py",
              "module/webui/event_shop_observation.py",
              "tests/test_event_compatibility_data.py",
              "tests/test_event_currency_wakeup.py",
              "tests/test_event_datamine_artifact.py",
              "tests/test_event_runtime_semantics.py",
              "tests/test_event_shop_catalog_evidence.py",
              "tests/test_event_supplemental_fail_closed.py",
              "tests/test_event_webui_display_assets.py",
              "tests/test_generated_event_ui_policy.py",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"], text=True, encoding="utf-8"
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  "Неожиданный scope diff:\n"
                  f"missing={sorted(expected - actual)}\n"
                  f"extra={sorted(actual - expected)}"
              )
          PY
          git diff --check

      - name: Verify code and regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked ruff check . --select E9,F63,F7,F82 --ignore F821,F722
          uv run --locked python -m compileall -q \
            module/event_datamine/artifact.py \
            module/event_datamine/patches.py \
            module/shop_event/catalog.py \
            module/webui/app_event_datamine.py \
            module/webui/app_event_general_presentation.py \
            module/webui/app_event_general_v2.py \
            module/webui/app_event_layout.py \
            module/webui/app_event_planner.py \
            module/webui/event_assets.py \
            module/webui/event_shop_observation.py
          uv run --locked --group ci python -m pytest -q \
            tests/test_event_datamine_artifact.py \
            tests/test_event_compatibility_data.py \
            tests/test_event_currency_wakeup.py \
            tests/test_event_runtime_semantics.py \
            tests/test_event_shop_catalog_evidence.py \
            tests/test_event_supplemental_fail_closed.py \
            tests/test_generated_event_ui_policy.py \
            tests/test_event_general_v2_layout.py \
            tests/test_event_webui_display_assets.py \
            tests/test_event_observation_rmw.py
          git diff --check

      - name: Commit verified code changes
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha }}"
          remote_head="$(git ls-remote origin refs/heads/refactor/stage5-event-architecture | cut -f1)"
          if [ "$remote_head" != "$expected_head" ]; then
            echo "Ветка изменилась во время проверки: expected=$expected_head actual=$remote_head" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .codex/context/01-PROJECT-MAP.md \
            module/event_datamine/artifact.py \
            module/event_datamine/patches.py \
            module/shop_event/catalog.py \
            module/webui/app_event_datamine.py \
            module/webui/app_event_general_presentation.py \
            module/webui/app_event_general_v2.py \
            module/webui/app_event_layout.py \
            module/webui/app_event_planner.py \
            module/webui/event_assets.py \
            module/webui/event_shop_observation.py \
            tests/test_event_compatibility_data.py \
            tests/test_event_currency_wakeup.py \
            tests/test_event_datamine_artifact.py \
            tests/test_event_runtime_semantics.py \
            tests/test_event_shop_catalog_evidence.py \
            tests/test_event_supplemental_fail_closed.py \
            tests/test_event_webui_display_assets.py \
            tests/test_generated_event_ui_policy.py
          git diff --cached --check
          git commit -m "fix(review): закрыть подтверждённые контракты Stage 9"
          git push origin "HEAD:refactor/stage5-event-architecture"
