name: Apply CI cleanup fixes

on:
  pull_request:
    branches:
      - personal/stable
    paths:
      - ".github/workflows/ci-fix-apply.yml"

permissions:
  contents: write

concurrency:
  group: apply-ci-cleanup-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/ci-reset' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply fixes
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/fix_ci_cleanup_regressions.py
          git diff --check

      - name: Commit and push fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests tools
          git commit -m "ci: исправить product regressions после cleanup"
          git push origin HEAD:codex/ci-reset
