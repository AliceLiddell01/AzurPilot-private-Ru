name: Optimize Security checkout

on:
  pull_request:
    branches:
      - personal/stable
    paths:
      - ".github/workflows/ci-security-optimize.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/ci-reset' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/optimize_security_checkout.py
            .github/workflows/ci.yml
            .github/workflows/ci-security-optimize.yml
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Optimize permanent Security job
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/optimize_security_checkout.py
          rm -f \
            .github/scripts/optimize_security_checkout.py \
            .github/workflows/ci-security-optimize.yml
          git diff --check

      - name: Commit attempted update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "ci: ускорить загрузку Security history"
          git push origin HEAD:codex/ci-reset
