name: Stage 8A review remediation apply

on:
  pull_request:
    branches:
      - personal/stable
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'codex/stage8a-device-adb-logs-clean'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Decode and apply remediation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import zlib
          from pathlib import Path

          chunks = ''.join(
              path.read_text(encoding='ascii')
              for path in sorted(Path('.stage8a-remediation-final').glob('*.b64'))
          )
          patch = zlib.decompress(base64.b64decode(chunks))
          expected = '61e622999eab8cff26a6222ea8892ffd4005a8090ff7fd17554082f289506b2d'
          actual = hashlib.sha256(patch).hexdigest()
          if actual != expected:
              raise SystemExit(f'Patch digest mismatch: {actual}')
          Path('/tmp/stage8a-review.patch').write_bytes(patch)
          PY
          git apply --check --whitespace=nowarn /tmp/stage8a-review.patch
          git apply --whitespace=nowarn /tmp/stage8a-review.patch
          python - <<'PY'
          import base64
          import hashlib
          import zlib
          from pathlib import Path

          encoded = ''
          patch = zlib.decompress(base64.b64decode(encoded))
          expected = '83140f4595cf444bd6406682b0689c3121cd68e3eb344f0019495cf8c774b8af'
          actual = hashlib.sha256(patch).hexdigest()
          if actual != expected:
              raise SystemExit(f'External contract fix digest mismatch: {actual}')
          Path('/tmp/stage8a-external-contract-fix.patch').write_bytes(patch)
          PY
          git apply --check --whitespace=nowarn /tmp/stage8a-external-contract-fix.patch
          git apply --whitespace=nowarn /tmp/stage8a-external-contract-fix.patch
          python - <<'PY'
          import base64
          import hashlib
          import zlib
          from pathlib import Path

          chunks = ''.join(
              path.read_text(encoding='ascii')
              for path in sorted(Path('.stage8a-remediation-security').glob('*.b64'))
          )
          patch = zlib.decompress(base64.b64decode(chunks))
          expected = '0b451e18ebfe42980958e2d53da7d58912316783250d697ed251551094d36020'
          actual = hashlib.sha256(patch).hexdigest()
          if actual != expected:
              raise SystemExit(f'Semantic/security fix digest mismatch: {actual}')
          Path('/tmp/stage8a-semantic-security-fix.patch').write_bytes(patch)
          PY
          git apply --check --whitespace=nowarn /tmp/stage8a-semantic-security-fix.patch
          git apply --whitespace=nowarn /tmp/stage8a-semantic-security-fix.patch
          uv sync --frozen
          uv run python -m unittest discover -s tests -p 'test_stage8a_*.py' -v
          git diff --check

      - name: Run Stage 8A verifier and retain diagnostics
        id: verifier
        shell: bash
        run: |
          set +e
          uv run python -m dev_tools.verify_stage8a --output-dir artifacts/stage8a-review
          verifier_status=$?
          set -e
          echo "$verifier_status" > artifacts/stage8a-review/verifier-exit-code.txt
          if [[ -f artifacts/stage8a-review/report.md ]]; then
            cat artifacts/stage8a-review/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Upload remediation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage8a-remediation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/stage8a-review
          if-no-files-found: error
          retention-days: 14

      - name: Enforce verifier result
        shell: bash
        run: |
          set -euo pipefail
          verifier_status="$(cat artifacts/stage8a-review/verifier-exit-code.txt)"
          if [[ "$verifier_status" != '0' ]]; then
            echo "Stage 8A verifier failed with exit code ${verifier_status}."
            exit "$verifier_status"
          fi

      - name: Commit validated clean tree
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git rm -r .stage8a-remediation-final .stage8a-remediation-security .github/workflows/stage8a-remediation-final.yml
          git add -A
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(stage8a-review): закрыть findings независимого ревью'
          git push origin "HEAD:${HEAD_BRANCH}"
