name: One-time random background endpoint cleanup

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.head_ref == 'chatgpt/remove-upstream-announcements' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chatgpt/remove-upstream-announcements
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --group ci

      - name: Replace external random background with local CSS gradient
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("assets/gui/css/advanced-material-alas.css")
          text = path.read_text(encoding="utf-8")
          old = '\t--alas-apple-bg-image: url("https://api.yppp.net/api.php");\n'
          new = (
              '\t--alas-apple-bg-image: '
              'linear-gradient(135deg, rgba(226, 236, 255, 0.96) 0%, '
              'rgba(245, 245, 247, 0.94) 48%, rgba(232, 240, 255, 0.92) 100%);\n'
          )
          if text.count(old) != 1:
              raise SystemExit("advanced-material-alas.css: external background sentinel missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="")

          test_path = Path("tests/test_no_upstream_project_network_defaults.py")
          test_text = test_path.read_text(encoding="utf-8")
          old_contract = '''    # Пользовательский случайный фон WebUI пока намеренно сохраняется.\n    assert 'https://api.yppp.net/api.php' in theme\n\n'''
          new_contract = '''    # Advanced Material theme больше не делает скрытый браузерный запрос за случайным фоном.\n    external_background = "api.yppp" + ".net"\n    assert external_background not in theme\n    assert "--alas-apple-bg-image: linear-gradient(" in theme\n\n'''
          if test_text.count(old_contract) != 1:
              raise SystemExit("network cleanup test: old random-background contract missing")
          test_path.write_text(test_text.replace(old_contract, new_contract, 1), encoding="utf-8", newline="")
          PY

      - name: Verify no random-background endpoint remains
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n 'api.yppp.net' -- assets module config deploy scripts; then
            echo 'External random-background endpoint remains.' >&2
            exit 1
          fi
          uv run --locked --group ci python -m pytest -q tests/test_no_upstream_project_network_defaults.py
          git diff --check

      - name: Commit non-workflow cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gui/css/advanced-material-alas.css tests/test_no_upstream_project_network_defaults.py
          git diff --cached --name-status
          git diff --cached --quiet && { echo 'Expected background cleanup changes were not generated.' >&2; exit 1; }
          git commit -m "refactor(webui): убрать внешний random-background endpoint"
          git push origin HEAD:chatgpt/remove-upstream-announcements
