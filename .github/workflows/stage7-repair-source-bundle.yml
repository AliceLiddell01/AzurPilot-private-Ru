name: Stage 7 repair source bundle

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle Stage 7 repair sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Collect exact-head sources
        shell: bash
        run: |
          set -euo pipefail
          out='artifacts/stage7-repair-source'
          mkdir -p "$out"
          files=(
            AGENTS.md
            .codex/context/02-RUNTIME-ARCHITECTURE.md
            .codex/context/03-CONFIG-I18N.md
            .codex/context/07-WEBUI-INFRASTRUCTURE.md
            .codex/context/08-VERIFICATION.md
            .codex/context/10-GLOSSARY.md
            .codex/context/GIT-WORKFLOW.md
            .codex/context/POWERSHELL-GIT-RULES.md
            gui.py
            dev_tools/stage7_gui_stable_policy.py
            dev_tools/stage7_log_audit.py
            dev_tools/stage7_semantic_policy.py
            dev_tools/stage7_semantic_delta_policy.py
            dev_tools/stage7_semantic_diagnostics.py
            dev_tools/verify_stage7.py
            tests/test_stage7_log_audit.py
            tests/test_stage7_process_lifecycle_logs.py
            tests/test_stage7_stable_contracts.py
            tests/test_webui_worker_registry.py
            tests/test_webui_no_reload_recovery.py
            docs/stage7-recovery-migration-map.md
            .github/workflows/lint.yml
          )
          for file in "${files[@]}"; do
            test -f "$file"
            mkdir -p "$out/$(dirname "$file")"
            cp "$file" "$out/$file"
          done
          git rev-parse HEAD > "$out/HEAD"
          git rev-parse origin/personal/stable > "$out/BASE"

      - name: Upload source bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage7-repair-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/stage7-repair-source
          if-no-files-found: error
          retention-days: 3
