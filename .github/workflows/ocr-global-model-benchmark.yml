name: OCR EN benchmark validation

on:
  push:
    paths:
      - 'bin/ocr_models/**'
      - 'dev_tools/ocr_english_model_benchmark.py'
      - 'docs/benchmarks/ocr-english-models.md'
      - 'module/daemon/ocr_benchmark.py'
      - 'module/ocr/**'
      - 'module/webui/app.py'
      - 'module/webui/app_personal_ocr.py'
      - 'tests/test_ocr_global_model_benchmark.py'
      - '.github/workflows/ocr-global-model-benchmark.yml'
  pull_request:
    paths:
      - 'bin/ocr_models/**'
      - 'dev_tools/ocr_english_model_benchmark.py'
      - 'docs/benchmarks/ocr-english-models.md'
      - 'module/daemon/ocr_benchmark.py'
      - 'module/ocr/**'
      - 'module/webui/app.py'
      - 'module/webui/app_personal_ocr.py'
      - 'tests/test_ocr_global_model_benchmark.py'
      - '.github/workflows/ocr-global-model-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ocr-en-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: English OCR model benchmark policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Synchronize locked dependencies
        run: uv sync --frozen

      - name: Run Ruff
        run: >-
          uv run ruff check
          dev_tools/ocr_english_model_benchmark.py
          module/daemon/ocr_benchmark.py
          module/ocr/model_policy.py
          module/ocr/models.py
          module/ocr/ncnn_ocr.py
          module/webui/app.py
          module/webui/app_personal_ocr.py
          tests/test_ocr_global_model_benchmark.py

      - name: Run EN-only OCR regression tests
        run: >-
          uv run python -m unittest -v
          tests/test_ocr_global_model_benchmark.py

      - name: Compile changed Python modules
        run: >-
          uv run python -m compileall -q
          dev_tools/ocr_english_model_benchmark.py
          module/daemon/ocr_benchmark.py
          module/ocr
          module/webui/app.py
          module/webui/app_personal_ocr.py
          tests/test_ocr_global_model_benchmark.py

      - name: Check diff formatting
        run: git diff --check
