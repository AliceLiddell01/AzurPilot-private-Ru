name: Temporary comment residual scan

on:
  push:
    branches:
      - cleanup/remove-legacy-upstream-junk
    paths:
      - .github/workflows/temp-comment-residual-scan.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Получить exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Построить raw residual manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import io
          import json
          import pathlib
          import re
          import subprocess
          import tokenize

          CJK_RE = re.compile(r"[\u3400-\u4dbf\u4e00-\u9fff]")
          HASH_COMMENT_SUFFIXES = {
              ".ps1", ".psm1", ".psd1", ".sh", ".bash", ".zsh",
              ".yml", ".yaml", ".toml", ".ini", ".cfg", ".conf",
          }
          SLASH_COMMENT_SUFFIXES = {
              ".js", ".jsx", ".ts", ".tsx", ".css", ".scss",
              ".c", ".cc", ".cpp", ".h", ".hpp", ".java",
          }
          XML_COMMENT_SUFFIXES = {".html", ".htm", ".xml"}

          def tracked_paths() -> list[pathlib.Path]:
              raw = subprocess.check_output(["git", "ls-files", "-z"])
              return [pathlib.Path(item.decode("utf-8")) for item in raw.split(b"\0") if item]

          def add_candidate(items, path, line, token, kind):
              if CJK_RE.search(token):
                  items.append({
                      "path": path.as_posix(),
                      "line": line,
                      "kind": kind,
                      "text": token.rstrip("\n"),
                  })

          def scan_python(path: pathlib.Path, items, errors):
              try:
                  data = path.read_bytes()
                  for tok in tokenize.tokenize(io.BytesIO(data).readline):
                      if tok.type == tokenize.COMMENT:
                          add_candidate(items, path, tok.start[0], tok.string, "python-comment")
              except Exception as exc:
                  errors.append({"path": path.as_posix(), "error": repr(exc)})

          def scan_hash_comments(path: pathlib.Path, items, errors):
              try:
                  text = path.read_text(encoding="utf-8")
              except Exception as exc:
                  errors.append({"path": path.as_posix(), "error": repr(exc)})
                  return
              in_block = False
              for lineno, line in enumerate(text.splitlines(), 1):
                  stripped = line.lstrip()
                  if path.suffix.lower() in {".ps1", ".psm1", ".psd1"}:
                      if in_block:
                          add_candidate(items, path, lineno, line, "powershell-block-comment")
                          if "#>" in line:
                              in_block = False
                          continue
                      if "<#" in line:
                          in_block = True
                          add_candidate(items, path, lineno, line, "powershell-block-comment")
                          if "#>" in line.split("<#", 1)[1]:
                              in_block = False
                          continue
                  if stripped.startswith("#"):
                      add_candidate(items, path, lineno, line, "hash-comment")

          def scan_slash_comments(path: pathlib.Path, items, errors):
              try:
                  text = path.read_text(encoding="utf-8")
              except Exception as exc:
                  errors.append({"path": path.as_posix(), "error": repr(exc)})
                  return
              in_block = False
              for lineno, line in enumerate(text.splitlines(), 1):
                  stripped = line.lstrip()
                  if in_block:
                      add_candidate(items, path, lineno, line, "slash-block-comment")
                      if "*/" in line:
                          in_block = False
                      continue
                  if stripped.startswith("/*"):
                      in_block = "*/" not in stripped[2:]
                      add_candidate(items, path, lineno, line, "slash-block-comment")
                      continue
                  if stripped.startswith("//"):
                      add_candidate(items, path, lineno, line, "slash-line-comment")

          def scan_xml_comments(path: pathlib.Path, items, errors):
              try:
                  text = path.read_text(encoding="utf-8")
              except Exception as exc:
                  errors.append({"path": path.as_posix(), "error": repr(exc)})
                  return
              in_block = False
              for lineno, line in enumerate(text.splitlines(), 1):
                  if in_block:
                      add_candidate(items, path, lineno, line, "xml-comment")
                      if "-->" in line:
                          in_block = False
                      continue
                  if "<!--" in line:
                      in_block = "-->" not in line.split("<!--", 1)[1]
                      add_candidate(items, path, lineno, line, "xml-comment")

          candidates = []
          errors = []
          paths = tracked_paths()
          for path in paths:
              suffix = path.suffix.lower()
              if suffix == ".py":
                  scan_python(path, candidates, errors)
              elif suffix in HASH_COMMENT_SUFFIXES:
                  scan_hash_comments(path, candidates, errors)
              elif suffix in SLASH_COMMENT_SUFFIXES:
                  scan_slash_comments(path, candidates, errors)
              elif suffix in XML_COMMENT_SUFFIXES:
                  scan_xml_comments(path, candidates, errors)

          candidates.sort(key=lambda item: (item["path"], item["line"], item["kind"], item["text"]))
          payload = {
              "head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "tracked_files": len(paths),
              "raw_cjk_comment_candidates": len(candidates),
              "candidate_files": len({item["path"] for item in candidates}),
              "candidates": candidates,
              "scan_errors": errors,
          }
          pathlib.Path("residual-comments.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with pathlib.Path("residual-comments.txt").open("w", encoding="utf-8") as out:
              out.write(f"HEAD {payload['head']}\n")
              out.write(f"RAW_CJK_COMMENT_CANDIDATES {payload['raw_cjk_comment_candidates']}\n")
              out.write(f"CANDIDATE_FILES {payload['candidate_files']}\n")
              out.write(f"SCAN_ERRORS {len(errors)}\n\n")
              current = None
              for item in candidates:
                  if item["path"] != current:
                      current = item["path"]
                      out.write(f"[{current}]\n")
                  out.write(f"L{item['line']} [{item['kind']}] {item['text']}\n")
              if errors:
                  out.write("\n[SCAN_ERRORS]\n")
                  for item in errors:
                      out.write(f"{item['path']}: {item['error']}\n")
          print(json.dumps({
              "head": payload["head"],
              "raw_cjk_comment_candidates": payload["raw_cjk_comment_candidates"],
              "candidate_files": payload["candidate_files"],
              "scan_errors": len(errors),
          }, ensure_ascii=False))
          PY

      - name: Загрузить residual manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comment-residual-manifest-${{ github.sha }}
          path: |
            residual-comments.json
            residual-comments.txt
          if-no-files-found: error
          retention-days: 1
