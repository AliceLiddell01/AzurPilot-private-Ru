name: CI non-Global inventory

on:
  pull_request:
    branches:
      - personal/stable
    paths:
      - ".github/workflows/ci-nonglobal-inventory.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout inventory scope
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            bin/ocr_models
            config
            deploy
            module/config
            module/ocr
            assets
          sparse-checkout-cone-mode: true
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Print remaining non-Global paths and runtime references
        shell: bash
        run: |
          set -euo pipefail
          echo '--- tracked path candidates ---'
          python - <<'PY'
          import re
          import subprocess

          paths = subprocess.run(
              ['git', 'ls-files'], check=True, capture_output=True, text=True
          ).stdout.splitlines()
          pattern = re.compile(
              r'(?:^|[/_.-])(?:ja-jp|zh-cn|zh-tw|zh-miao|jp|cn|tw)(?:$|[/_.-])|azur_lane_jp|sets_zh|sets_jp',
              re.I,
          )
          for path in paths:
              if pattern.search(path):
                  print(path)
          PY
          echo '--- runtime/config references ---'
          git grep -n -I -E 'ja-JP|zh-CN|zh-TW|zh-MIAO|azur_lane_jp|cnocr|ppocr_v6' -- \
            config deploy module/config module/ocr || true
