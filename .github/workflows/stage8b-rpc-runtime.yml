name: Stage 8B RPC runtime

on:
  pull_request:
    paths:
      - "module/ocr/rpc.py"
      - "module/ocr/stage8b_rpc_security.py"
      - "tests/test_stage8b_rpc_runtime.py"
      - ".github/workflows/stage8b-rpc-runtime.yml"

permissions:
  contents: read

concurrency:
  group: stage8b-rpc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rpc-runtime:
    name: Stage 8B RPC fallback and boundary tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"

      - name: Synchronize locked dependencies
        run: uv sync --frozen

      - name: Verify exact head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          printf 'exact_head=%s\n' "$(git rev-parse HEAD)" | tee rpc-exact-head.txt

      - name: Run Ruff
        run: uv run ruff check tests/test_stage8b_rpc_runtime.py

      - name: Run RPC runtime regression tests
        shell: bash
        run: |
          set -o pipefail
          uv run python -m unittest -v tests.test_stage8b_rpc_runtime 2>&1 | tee rpc-runtime-tests.txt

      - name: Upload RPC runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stage8b-rpc-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rpc-exact-head.txt
            rpc-runtime-tests.txt
          if-no-files-found: error
          retention-days: 14
