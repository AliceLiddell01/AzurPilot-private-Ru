name: One-time deploy i18n generator cleanup

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.head_ref == 'chatgpt/remove-upstream-announcements' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chatgpt/remove-upstream-announcements
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --group ci

      - name: Remove dead deploy translation generator keys
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("module/config/argument/gui.yaml")
          text = path.read_text(encoding="utf-8")
          old = '''  Repository:\n  RepositoryHelp:\n  Branch:\n  BranchHelp:\n  GitExecutable:\n  GitExecutableHelp:\n  GitProxy:\n  GitProxyHelp:\n  SSLVerify:\n  SSLVerifyHelp:\n'''
          if text.count(old) != 1:
              raise SystemExit("gui.yaml: legacy deploy translation key block missing")
          path.write_text(text.replace(old, "", 1), encoding="utf-8", newline="")

          test_path = Path("tests/test_no_upstream_project_network_defaults.py")
          test_text = test_path.read_text(encoding="utf-8")
          anchor = '''    # Старый встроенный Git-updater уже удалён из runtime: его CN-oriented UI residues не должны возвращаться.\n'''
          addition = '''    dead_deploy_gui_keys = (\n        "  Repository:\\n",\n        "  RepositoryHelp:\\n",\n        "  Branch:\\n",\n        "  BranchHelp:\\n",\n        "  GitExecutable:\\n",\n        "  GitExecutableHelp:\\n",\n        "  GitProxy:\\n",\n        "  GitProxyHelp:\\n",\n        "  SSLVerify:\\n",\n        "  SSLVerifyHelp:\\n",\n    )\n    for key in dead_deploy_gui_keys:\n        assert key not in gui_argument\n\n'''
          if test_text.count(anchor) != 1:
              raise SystemExit("network cleanup test: legacy updater anchor missing")
          test_path.write_text(test_text.replace(anchor, anchor + addition, 1), encoding="utf-8", newline="")
          PY

      - name: Regenerate and verify clean working tree contract
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked -m dev_tools.button_extract
          uv run --locked -m module.config.config_updater
          uv run --locked --group ci python -m pytest -q tests/test_no_upstream_project_network_defaults.py
          if git grep -n -E 'git://git\.pull/AzurPilot|CN users may use|Пользователи из КНР' -- module/config/i18n; then
            echo 'Stale CN updater guidance remains.' >&2
            exit 1
          fi
          git diff --check

      - name: Commit non-workflow cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module/config/argument/gui.yaml module/config/i18n/ru-RU.json tests/test_no_upstream_project_network_defaults.py
          git diff --cached --name-status
          git diff --cached --quiet && { echo 'Expected generator cleanup changes were not produced.' >&2; exit 1; }
          git commit -m "refactor(global): удалить мёртвые updater i18n generator keys"
          git push origin HEAD:chatgpt/remove-upstream-announcements
