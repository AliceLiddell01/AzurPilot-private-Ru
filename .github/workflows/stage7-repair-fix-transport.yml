name: Stage 7 repair transport fix

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: write

concurrency:
  group: stage7-repair-transport-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix:
    name: Fix repair payload transport
    if: github.event.pull_request.head.ref == 'codex/stage7-log-russianization-recovery'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact head and replacement chunks
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          remote_head="$(git ls-remote --heads origin "$PR_HEAD_REF" | awk '{print $1}')"
          test "$remote_head" = "$PR_HEAD_SHA"
          sha256sum -c <<'EOF'
          126db5619a32e8b097568efe0f5968eb8618083cf8b2cf815ad7fbc47d712dc9  .codex/tmp/stage7-repair/payload.part01a
          4501296aa1e2b17bf2c110098a1860a393f5c268806cb1521e627c0d3781a763  .codex/tmp/stage7-repair/payload.part01b
          1b90197e1b304d6325321b1bc86479933e0857b5e9914e471e8e85f33443f431  .codex/tmp/stage7-repair/payload.part03a
          0e1054cd7582e716f8d05342e80a62a83c3eb11b3b4e999bbb52e91f2cff8e5a  .codex/tmp/stage7-repair/payload.part03b
          EOF

      - name: Patch apply workflow and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/stage7-repair-apply.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = '          test "$(find .codex/tmp/stage7-repair -maxdepth 1 -type f -name \'payload.part*\' | wc -l)" -eq 7\n'
          end_marker = '\n\n      - name: Decode and validate repair payload'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('Unexpected apply workflow validation block')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''          parts=(
            .codex/tmp/stage7-repair/payload.part00
            .codex/tmp/stage7-repair/payload.part01a
            .codex/tmp/stage7-repair/payload.part01b
            .codex/tmp/stage7-repair/payload.part02
            .codex/tmp/stage7-repair/payload.part03a
            .codex/tmp/stage7-repair/payload.part03b
            .codex/tmp/stage7-repair/payload.part04
            .codex/tmp/stage7-repair/payload.part05
            .codex/tmp/stage7-repair/payload.part06
          )
          for part in "${parts[@]}"; do
            test -f "$part"
          done
          sha256sum -c <<'EOF'
          8125a4b8d5758129bc010e3d390f633110efd5a0c0ad9c1ee196f4d01dda1e68  .codex/tmp/stage7-repair/payload.part00
          126db5619a32e8b097568efe0f5968eb8618083cf8b2cf815ad7fbc47d712dc9  .codex/tmp/stage7-repair/payload.part01a
          4501296aa1e2b17bf2c110098a1860a393f5c268806cb1521e627c0d3781a763  .codex/tmp/stage7-repair/payload.part01b
          63b7d84329a37923243913f317f6ffd7eb02b777c4d65ead5a702a59884a57e6  .codex/tmp/stage7-repair/payload.part02
          1b90197e1b304d6325321b1bc86479933e0857b5e9914e471e8e85f33443f431  .codex/tmp/stage7-repair/payload.part03a
          0e1054cd7582e716f8d05342e80a62a83c3eb11b3b4e999bbb52e91f2cff8e5a  .codex/tmp/stage7-repair/payload.part03b
          512231e74cde54b1ef13009707cbd823a751d738036415344becd70d12c1858f  .codex/tmp/stage7-repair/payload.part04
          8bda0b028bd29cbade02cd3872c874fd2bb238cb555e11acf1ec8a7a06adc9c0  .codex/tmp/stage7-repair/payload.part05
          bcd370f305c728b7f6d337ddbf25eddba0e1b12c99203b7bc1ffe03d07376e9c  .codex/tmp/stage7-repair/payload.part06
          EOF'''
          text = text[:start] + replacement + text[end:]
          old_cat = '          cat .codex/tmp/stage7-repair/payload.part* > "$work/payload.b64"'
          new_cat = '''          cat \\
            .codex/tmp/stage7-repair/payload.part00 \\
            .codex/tmp/stage7-repair/payload.part01a \\
            .codex/tmp/stage7-repair/payload.part01b \\
            .codex/tmp/stage7-repair/payload.part02 \\
            .codex/tmp/stage7-repair/payload.part03a \\
            .codex/tmp/stage7-repair/payload.part03b \\
            .codex/tmp/stage7-repair/payload.part04 \\
            .codex/tmp/stage7-repair/payload.part05 \\
            .codex/tmp/stage7-repair/payload.part06 \\
            > "$work/payload.b64"'''
          if text.count(old_cat) != 1:
              raise SystemExit('Unexpected payload concatenation command')
          path.write_text(text.replace(old_cat, new_cat), encoding='utf-8')
          PY
          rm .github/workflows/stage7-repair-fix-transport.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/stage7-repair-apply.yml
          git add -u .github/workflows/stage7-repair-fix-transport.yml
          git diff --cached --check
          git commit -m 'chore(stage7): восстановить transport repair payload'

      - name: Push transport fix without rewriting history
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --heads origin "$PR_HEAD_REF" | awk '{print $1}')"
          test "$remote_head" = "$PR_HEAD_SHA"
          git push origin "HEAD:$PR_HEAD_REF"
