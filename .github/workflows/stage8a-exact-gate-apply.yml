name: Stage 8A exact-head scenario execution gate apply

on:
  pull_request:
    branches:
      - personal/stable
    paths:
      - '.stage8a-exact-gate/**'
      - '.github/workflows/stage8a-exact-gate-apply.yml'

permissions:
  contents: write

concurrency:
  group: stage8a-exact-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/stage8a-scenario-matrix-fix'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact trigger head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Apply and validate exact-head fixture execution gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/stage8a-exact-gate
          python - <<'PY'
          import base64
          import hashlib
          import zlib
          from pathlib import Path

          encoded = Path('.stage8a-exact-gate/patch.b64').read_text(encoding='ascii')
          patch = zlib.decompress(base64.b64decode(encoded))
          expected = '703965f66e4c9ce7dfc08e15cd297e774c046d29df9accbafeb8d7405e9b7efd'
          actual = hashlib.sha256(patch).hexdigest()
          if actual != expected:
              raise SystemExit(f'Patch digest mismatch: {actual}')
          Path('/tmp/stage8a-exact-gate.patch').write_bytes(patch)
          print(f'patch_sha256={actual}')
          PY
          git apply --check --whitespace=nowarn /tmp/stage8a-exact-gate.patch
          git apply --whitespace=nowarn /tmp/stage8a-exact-gate.patch
          uv sync --frozen
          uv run python -m unittest -v tests/test_stage8a_evidence_policy.py \
            2>&1 | tee artifacts/stage8a-exact-gate/evidence-policy.log
          uv run python -m dev_tools.verify_stage8a \
            --output-dir artifacts/stage8a-exact-gate/verifier \
            2>&1 | tee artifacts/stage8a-exact-gate/verifier.log
          uv run python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/stage8a-exact-gate/verifier')
          scenario = json.loads((root / 'scenario-evidence.json').read_text())
          execution = json.loads((root / 'scenario-execution.json').read_text())
          if scenario['status'] != 'PASS':
              raise SystemExit('scenario-evidence status is not PASS')
          if execution['status'] != 'PASS':
              raise SystemExit('scenario-execution status is not PASS')
          if execution['requirements'] != 127 or execution['executed'] != 127:
              raise SystemExit(f"unexpected scenario execution count: {execution}")
          if execution['missing']:
              raise SystemExit(f"missing fixtures: {execution['missing']}")
          print('scenario_execution=127/127')
          PY
          git diff --check 2>&1 | tee artifacts/stage8a-exact-gate/diff-check.log

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage8a-exact-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/stage8a-exact-gate
          if-no-files-found: error
          retention-days: 14

      - name: Publish validated clean tree
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git rm -r .stage8a-exact-gate .github/workflows/stage8a-exact-gate-apply.yml
          git add -A
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(stage8a): исполнять scenario matrix в exact-head verifier'
          git push origin "HEAD:${HEAD_BRANCH}"
