name: Finalize CI terminology

on:
  pull_request:
    branches:
      - personal/stable
    paths:
      - ".github/workflows/ci-finalize-text.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/ci-reset' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/finalize_ci_text.py
            .codex/context/GIT-WORKFLOW.md
            tests/serve_webui_traceback.py
            tools/acceptance/ocr.py
            tools/acceptance/webui_smoke.py
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply terminology cleanup
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/finalize_ci_text.py
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .codex tests tools
          git commit -m "ci: убрать остаточную Stage-терминологию"
          git push origin HEAD:codex/ci-reset
