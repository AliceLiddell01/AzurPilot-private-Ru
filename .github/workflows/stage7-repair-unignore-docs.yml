name: Stage 7 repair docs staging

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: write

concurrency:
  group: stage7-repair-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  unignore:
    name: Allow tracked Stage 7 migration map staging
    if: github.event.pull_request.head.ref == 'codex/stage7-log-russianization-recovery'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add exact migration-map exception
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          remote_head="$(git ls-remote --heads origin "$PR_HEAD_REF" | awk '{print $1}')"
          test "$remote_head" = "$PR_HEAD_SHA"
          if grep -Fqx '!/docs/stage7-recovery-migration-map.md' .gitignore; then
            exit 0
          fi
          cat >> .gitignore <<'EOF'

# Временное исключение Stage 7 repair; удаляется после применения payload
!/docs/
/docs/*
!/docs/stage7-recovery-migration-map.md
EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore
          git diff --cached --check
          git commit -m 'chore(stage7): разрешить staging migration map'
          remote_head="$(git ls-remote --heads origin "$PR_HEAD_REF" | awk '{print $1}')"
          test "$remote_head" = "$PR_HEAD_SHA"
          git push origin "HEAD:$PR_HEAD_REF"
