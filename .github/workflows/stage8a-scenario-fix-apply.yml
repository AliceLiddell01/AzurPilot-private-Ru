name: Stage 8A scenario matrix remediation apply

on:
  pull_request:
    branches:
      - personal/stable
    paths:
      - '.stage8a-scenario-fix/**'
      - '.github/workflows/stage8a-scenario-fix-apply.yml'

permissions:
  contents: write

concurrency:
  group: stage8a-scenario-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/stage8a-scenario-matrix-fix'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact trigger head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Decode, apply and validate executable scenario matrix
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/stage8a-scenario-fix
          python - <<'PY' 2>&1 | tee artifacts/stage8a-scenario-fix/patch-decode.log
          import base64
          import hashlib
          import zlib
          from pathlib import Path

          payload = Path('.stage8a-scenario-fix/patch.b64').read_text(encoding='ascii')
          patch = zlib.decompress(base64.b64decode(payload))
          expected = 'cf155268f665178824aef2c617647aa1405ecbf16e461c1fdc631dd765e11ad4'
          actual = hashlib.sha256(patch).hexdigest()
          if actual != expected:
              raise SystemExit(f'Patch digest mismatch: {actual}')
          Path('/tmp/stage8a-scenario-fix.patch').write_bytes(patch)
          print(f'patch_sha256={actual}')
          PY
          decode_status=${PIPESTATUS[0]}

          git apply --check --whitespace=nowarn /tmp/stage8a-scenario-fix.patch 2>&1 | tee artifacts/stage8a-scenario-fix/git-apply-check.log
          apply_check_status=${PIPESTATUS[0]}
          if [ "$apply_check_status" -eq 0 ]; then
            git apply --whitespace=nowarn /tmp/stage8a-scenario-fix.patch 2>&1 | tee artifacts/stage8a-scenario-fix/git-apply.log
            apply_status=${PIPESTATUS[0]}
          else
            apply_status=1
          fi

          if [ "$decode_status" -eq 0 ] && [ "$apply_check_status" -eq 0 ] && [ "$apply_status" -eq 0 ]; then
            uv sync --frozen 2>&1 | tee artifacts/stage8a-scenario-fix/uv-sync.log
            sync_status=${PIPESTATUS[0]}
          else
            sync_status=1
          fi

          if [ "$sync_status" -eq 0 ]; then
            uv run python -m unittest discover -s tests -p 'test_stage8a_*.py' -v 2>&1 | tee artifacts/stage8a-scenario-fix/unittest.log
            unittest_status=${PIPESTATUS[0]}
            uv run python -m dev_tools.verify_stage8a --output-dir artifacts/stage8a-scenario-fix/verifier 2>&1 | tee artifacts/stage8a-scenario-fix/verifier.log
            verifier_status=${PIPESTATUS[0]}
            git diff --check 2>&1 | tee artifacts/stage8a-scenario-fix/diff-check.log
            diff_status=${PIPESTATUS[0]}
          else
            unittest_status=1
            verifier_status=1
            diff_status=1
          fi

          cat > artifacts/stage8a-scenario-fix/status.txt <<EOF
          decode_status=$decode_status
          apply_check_status=$apply_check_status
          apply_status=$apply_status
          sync_status=$sync_status
          unittest_status=$unittest_status
          verifier_status=$verifier_status
          diff_status=$diff_status
          EOF

          test "$decode_status" -eq 0
          test "$apply_check_status" -eq 0
          test "$apply_status" -eq 0
          test "$sync_status" -eq 0
          test "$unittest_status" -eq 0
          test "$verifier_status" -eq 0
          test "$diff_status" -eq 0

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage8a-scenario-fix-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/stage8a-scenario-fix
          if-no-files-found: error
          retention-days: 14

      - name: Publish validated clean tree
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git rm -r .stage8a-scenario-fix .github/workflows/stage8a-scenario-fix-apply.yml
          git add -A
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(stage8a): добавить исполняемую scenario matrix и исправить stable CI'
          git push origin "HEAD:${HEAD_BRANCH}"
