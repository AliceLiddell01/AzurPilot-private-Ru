name: One-time AzurStats remote residue cleanup

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.head_ref == 'chatgpt/remove-upstream-announcements' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: chatgpt/remove-upstream-announcements
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --group ci

      - name: Remove dead AzurStats remote configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str = "") -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one sentinel, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8", newline="")

          replace_once(
              "module/config/argument/argument.yaml",
              '''  AzurStatsID: null
  API:
    value: default
    option: [default, cn_gz_reverse_proxy]
''',
          )

          replace_once(
              "module/config/config_updater.py",
              '''        # 处理 AzurStatsID
        if is_template:
            deep_set(new, 'Alas.DropRecord.AzurStatsID', None)
        else:
            deep_default(new, 'Alas.DropRecord.AzurStatsID', random_id())
''',
          )

          replace_once(
              "module/config/redirect_utils/utils.py",
              '''def api_redirect(value):
    """
    redirect attr about api.
    """
    if value == 'auto':
        return 'default'
    elif to_server(value) == 'cn':
        return 'cn_gz_reverse_proxy'
    else:
        return 'default'


''',
          )
          replace_once(
              "module/config/redirect_utils/utils.py",
              '''def api_redirect2(value):
    """
    remove shanghai proxy, use guangzhou
    """
    if value == 'cn_sh_reverse_proxy':
        return 'cn_gz_reverse_proxy'
    else:
        return value


''',
          )

          redirect_path = Path("module/config/redirect_utils/utils.py")
          redirect_text = redirect_path.read_text(encoding="utf-8")
          if "to_server(" not in redirect_text:
              redirect_text = redirect_text.replace(
                  "from module.config.server import to_server\n\n\n", "", 1
              )
              redirect_path.write_text(redirect_text, encoding="utf-8", newline="")
          PY

      - name: Regenerate configuration artifacts
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked -m dev_tools.button_extract
          uv run --locked -m module.config.config_updater

          python - <<'PY'
          import json
          from pathlib import Path

          for filename in ("ru-RU.json", "en-US.json"):
              path = Path("module/config/i18n") / filename
              data = json.loads(path.read_text(encoding="utf-8"))
              group = data.get("DropRecord", {})
              group.pop("AzurStatsID", None)
              group.pop("API", None)
              path.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
                  newline="",
              )
          PY

      - name: Add regression contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_no_upstream_project_network_defaults.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''    time_source = (ROOT / "module/config/time_source.py").read_text(encoding="utf-8")
'''
          replacement = anchor + '''    azurstats_runtime = (ROOT / "module/statistics/azurstats.py").read_text(encoding="utf-8")
    config_updater = (ROOT / "module/config/config_updater.py").read_text(encoding="utf-8")
    redirect_utils = (ROOT / "module/config/redirect_utils/utils.py").read_text(encoding="utf-8")
'''
          if text.count(anchor) != 1:
              raise SystemExit("network test: time_source anchor not found exactly once")
          text = text.replace(anchor, replacement, 1)

          anchor = '''    # NTP-механизм и пользовательское переопределение сохранены, China-first defaults удалены.
'''
          block = '''    # Старый удалённый AzurStats upload contract удалён; текущий AzurStats остаётся локальным.
    for token in ("AzurStatsID", "cn_gz_reverse_proxy"):
        assert token not in llm_argument
        assert token not in config_updater
        assert token not in redirect_utils
        assert token not in ru_i18n
        assert token not in en_i18n
    assert "DropRecord_API" not in config_updater
    assert "requests." not in azurstats_runtime
    assert "urlopen(" not in azurstats_runtime
    assert "urllib" not in azurstats_runtime
    assert "LOCAL_DB = './config/azurstats_local.db'" in azurstats_runtime

'''
          if text.count(anchor) != 1:
              raise SystemExit("network test: NTP anchor not found exactly once")
          path.write_text(text.replace(anchor, block + anchor, 1), encoding="utf-8", newline="")
          PY

      - name: Retire audit and one-time cleanup workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/audit-azurstats.yml
          rm .github/workflows/cleanup-azurstats-remote.yml

      - name: Verify focused cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'AzurStatsID|cn_gz_reverse_proxy' -- . ':!dev_tools/research_optimizer.py'; then
            echo 'Dead AzurStats remote configuration remains.' >&2
            exit 1
          fi
          uv run --locked --group ci python -m pytest -q tests/test_no_upstream_project_network_defaults.py
          git diff --check

      - name: Commit generated cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'Expected AzurStats cleanup changes were not generated.' >&2; exit 1; }
          git commit -m "refactor(stats): удалить мёртвый remote AzurStats contract"
          git push origin HEAD:chatgpt/remove-upstream-announcements
