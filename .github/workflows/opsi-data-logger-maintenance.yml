name: Opsi Data Logger maintenance

on:
  pull_request:
    branches:
      - personal/stable
    paths:
      - .github/workflows/opsi-data-logger-maintenance.yml

permissions:
  contents: read

jobs:
  validate-and-regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          uv sync --frozen
          uv pip install pytest

      - name: Run focused Data Logger tests
        run: uv run pytest -q tests/test_opsi_data_logger.py

      - name: Regenerate Russianization audit artifacts
        run: uv run python -m dev_tools.russianization_audit

      - name: Package regenerated artifacts
        run: |
          mkdir -p /tmp/opsi-russianization/dev_tools/russianization/results
          cp dev_tools/russianization/results/summary.json /tmp/opsi-russianization/dev_tools/russianization/results/
          cp dev_tools/russianization/results/first_party_logs.json /tmp/opsi-russianization/dev_tools/russianization/results/
          cp dev_tools/russianization/results/asset_manifest.json /tmp/opsi-russianization/dev_tools/russianization/results/
          cp dev_tools/russianization/results/locale_dependency_map.json /tmp/opsi-russianization/dev_tools/russianization/results/
          cp dev_tools/russianization/results/stage4_report.md /tmp/opsi-russianization/dev_tools/russianization/results/

      - uses: actions/upload-artifact@v4
        with:
          name: opsi-russianization-results
          path: /tmp/opsi-russianization
          if-no-files-found: error
