name: Opsi Data Logger maintenance

on:
  pull_request:
    branches:
      - personal/stable
    paths:
      - .github/workflows/opsi-data-logger-maintenance.yml

permissions:
  contents: write

jobs:
  validate-regenerate-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/opsi-data-logger
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          uv sync --frozen
          uv pip install pytest

      - name: Build direct scheduler integration
        run: |
          python - <<'PY'
          from pathlib import Path

          config_path = Path("module/config/config.py")
          config = config_path.read_text(encoding="utf-8")
          import_anchor = "from module.config.deep import deep_get, deep_set\n"
          import_replacement = (
              import_anchor
              + "from module.config.opsi_data_logger import data_logger_is_active_from_data\n"
          )
          if import_replacement not in config:
              if import_anchor not in config:
                  raise SystemExit("config import anchor not found")
              config = config.replace(import_anchor, import_replacement, 1)

          replacement = (
              '        def is_special_radar(task):\n'
              '            if task == "OpsiExplore":\n'
              '                return data_logger_is_active_from_data(self.data)\n'
              '            return deep_get(\n'
              '                self.data, keys=f"{task}.OpsiExplore.SpecialRadar", default=False\n'
              '            )'
          )
          start_marker = "        def is_special_radar(task):\n"
          end_marker = "\n\n        if recon_scan:"
          start = config.find(start_marker)
          if start < 0:
              if replacement not in config:
                  raise SystemExit("is_special_radar start marker not found")
          else:
              end = config.find(end_marker, start)
              if end < 0:
                  raise SystemExit("is_special_radar end marker not found")
              config = config[:start] + replacement + config[end:]
          config_path.write_text(config, encoding="utf-8", newline="\n")

          state_path = Path("module/config/opsi_data_logger.py")
          state = state_path.read_text(encoding="utf-8")
          state = state.replace("from functools import wraps\n", "")
          state = state.replace("from threading import RLock\n", "")
          state = state.replace(
              "from module.config.deep import deep_get, deep_set\n",
              "from module.config.deep import deep_get\n",
          )
          state = state.replace("\n_SCHEDULER_BRIDGE_LOCK = RLock()\n", "")
          bridge_marker = "\ndef install_data_logger_scheduler_bridge() -> None:\n"
          if bridge_marker in state:
              state = state.split(bridge_marker, 1)[0].rstrip() + "\n"
          state_path.write_text(state, encoding="utf-8", newline="\n")
          PY

      - name: Run focused Data Logger tests
        run: PYTHONPATH=. uv run pytest -q tests/test_opsi_data_logger.py

      - name: Regenerate Russianization audit artifacts
        run: PYTHONPATH=. uv run python -m dev_tools.russianization_audit --write

      - name: Commit verified candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module/config/config.py
          git add module/config/opsi_data_logger.py
          git add dev_tools/russianization/results/summary.json
          git add dev_tools/russianization/results/first_party_logs.json
          git add dev_tools/russianization/results/asset_manifest.json
          git add dev_tools/russianization/results/locale_dependency_map.json
          git add dev_tools/russianization/results/stage4_report.md
          git diff --cached --quiet && exit 0
          git commit -m "fix(opsi): integrate monthly state into scheduler"
          git push origin HEAD:fix/opsi-data-logger
