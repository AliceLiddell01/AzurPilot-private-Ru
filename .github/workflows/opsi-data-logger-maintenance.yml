name: Opsi Data Logger maintenance

on:
  push:
    branches:
      - fix/opsi-data-logger
    paths:
      - .github/workflows/opsi-data-logger-maintenance.yml

permissions:
  contents: write

jobs:
  validate-and-regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/opsi-data-logger
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          uv sync --frozen
          uv pip install pytest

      - name: Run focused Data Logger tests
        run: uv run pytest -q tests/test_opsi_data_logger.py

      - name: Regenerate Russianization audit artifacts
        run: uv run python -m dev_tools.russianization_audit

      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev_tools/russianization/results/summary.json
          git add dev_tools/russianization/results/first_party_logs.json
          git add dev_tools/russianization/results/asset_manifest.json
          git add dev_tools/russianization/results/locale_dependency_map.json
          git add dev_tools/russianization/results/stage4_report.md
          git diff --cached --quiet && exit 0
          git commit -m "chore(audit): regenerate Data Logger baselines"
          git push origin HEAD:fix/opsi-data-logger
