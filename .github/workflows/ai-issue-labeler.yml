name: AI Issue Labeler

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to label
        required: true
        type: number

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-issue-labeler-${{ github.event.inputs.issue_number || github.run_id }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: python -m pip install "openai>=1,<2"

      - name: Analyze issue
        env:
          AI_BASE_URL: ${{ vars.AI_LABELER_BASE_URL }}
          AI_MODEL: ${{ vars.AI_LABELER_MODEL }}
          AI_API_KEY: ${{ secrets.AI_LABELER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.AI_ISSUE_LABELER_TOKEN || github.token }}
        run: python .github/scripts/ai_issue_labeler.py
