name: PR158 temporary stable integration diagnostic

on:
  push:
    branches:
      - codex/morale-stage3-production-integration
    paths:
      - .github/workflows/pr158-sync-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    name: Диагностика точек semantic merge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Получить текущую ветку
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Проверить merge и точки интеграции
        shell: bash
        env:
          EXPECTED_PARENT_SHA: 611c3da22e2853c5bf49b9bc31322ccf41a70d81
          STABLE_SHA: cf54dfb3901c8d1ab8374840549db7deaa29b2f8
          TARGET_BRANCH: codex/morale-stage3-production-integration
        run: |
          set -euo pipefail
          diagnostic=.github/pr158-integration-diagnostic.txt
          : > "${diagnostic}"
          printf 'ref=%s\n' "${GITHUB_REF_NAME}" >> "${diagnostic}"
          printf 'head=%s\n' "$(git rev-parse HEAD)" >> "${diagnostic}"
          printf 'parent=%s\n' "$(git rev-parse HEAD^)" >> "${diagnostic}"
          printf 'expected_parent=%s\n' "${EXPECTED_PARENT_SHA}" >> "${diagnostic}"
          git fetch --no-tags origin "${STABLE_SHA}"

          set +e
          git merge --no-ff --no-commit "${STABLE_SHA}" >> "${diagnostic}" 2>&1
          merge_status=$?
          set -e
          printf 'merge_status=%s\n' "${merge_status}" >> "${diagnostic}"
          printf 'merge_head=%s\n' "$(git rev-parse MERGE_HEAD)" >> "${diagnostic}"
          printf '%s\n' 'conflicts:' >> "${diagnostic}"
          git diff --name-only --diff-filter=U | LC_ALL=C sort >> "${diagnostic}"

          git checkout --theirs -- module/application/__init__.py
          git checkout --ours -- module/application/morale.py
          git checkout --theirs -- module/persistence/runtime.py

          python - <<'PY' >> "${diagnostic}" 2>&1
          from pathlib import Path

          checks = {
              "app:fleet_page_import": (
                  "module/application/__init__.py",
                  "from module.application.fleet_page import (\n",
              ),
              "app:fleet_slot_view": (
                  "module/application/__init__.py",
                  "    FleetSlotViewModel,\n)\nfrom module.application.fleet_state import (\n",
              ),
              "app:morale_events": (
                  "module/application/__init__.py",
                  "    MoraleContinuityError,\n    MoraleFleetState,\n",
              ),
              "app:record_morale": (
                  "module/application/__init__.py",
                  "    MoraleSlotState,\n    RecordMoraleObservation,\n    project_morale,\n",
              ),
              "app:exports_tail": (
                  "module/application/__init__.py",
                  '    "UNKNOWN_TASK",\n    "finalize_rehearsal",\n    "project_morale",\n',
              ),
              "morale:instance_import": (
                  "module/application/morale.py",
                  "from module.application.instance_identity import resolve_runtime_instance\n",
              ),
              "morale:state_in_uow": (
                  "module/application/morale.py",
                  "    def state_in_uow(\n",
              ),
              "runtime:fleet_import": (
                  "module/persistence/runtime.py",
                  "from module.application.fleet_state import (\n    FleetScanService,\n    FleetStateService,\n    FormationFleetScanController,\n)\n",
              ),
              "runtime:timezone_global": (
                  "module/persistence/runtime.py",
                  "_runtime_timezone: ZoneInfo | None = None\n",
              ),
              "runtime:fleet_page_fields": (
                  "module/persistence/runtime.py",
                  "    query_service: FleetPageQueryService\n    command_service: FleetManualScanCommandService\n    runtime_timezone: ZoneInfo\n",
              ),
              "runtime:readonly_class": (
                  "module/persistence/runtime.py",
                  "@dataclass(slots=True)\nclass ReadOnlyPersistenceComposition:\n",
              ),
              "runtime:dispose": (
                  "module/persistence/runtime.py",
                  "def dispose_runtime_storage() -> None:\n    global _engine, _engine_settings, _runtime_timezone, _service\n",
              ),
          }
          for label, (path, needle) in checks.items():
              text = Path(path).read_text(encoding="utf-8")
              print(f"{label}={text.count(needle)}")
          PY

          git merge --abort
          git add -- "${diagnostic}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(pr158): уточнить semantic merge'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
