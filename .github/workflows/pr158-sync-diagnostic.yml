name: PR158 temporary sync diagnostic

on:
  push:
    branches:
      - codex/morale-stage3-production-integration
    paths:
      - .github/workflows/pr158-sync-diagnostic.yml

permissions:
  contents: write

jobs:
  merge-tree:
    name: Диагностика merge tree
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Получить текущую ветку
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Проверить границы и сохранить merge tree
        shell: bash
        env:
          EXPECTED_PARENT_SHA: 1f8b798ba889b233ac4cafdac6c4ee946f38c937
          STABLE_SHA: cf54dfb3901c8d1ab8374840549db7deaa29b2f8
          TARGET_BRANCH: codex/morale-stage3-production-integration
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT_SHA}"
          git fetch --no-tags origin "${STABLE_SHA}"
          set +e
          output="$(git merge-tree --write-tree --name-only HEAD "${STABLE_SHA}" 2>&1)"
          status=$?
          set -e
          {
            printf 'merge_tree_exit_code=%s\n' "${status}"
            printf '%s\n' "${output}"
          } > .github/pr158-merge-diagnostic.txt
          git add -- .github/pr158-merge-diagnostic.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(pr158): сохранить диагностику merge'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
