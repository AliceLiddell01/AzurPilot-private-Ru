name: One-time stale deploy i18n cleanup

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.head_ref == 'chatgpt/remove-upstream-announcements' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chatgpt/remove-upstream-announcements
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --group ci

      - name: Remove dead updater translations and neutralize ADB help
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          legacy_keys = (
              "Repository",
              "RepositoryHelp",
              "Branch",
              "BranchHelp",
              "GitExecutable",
              "GitExecutableHelp",
              "GitProxy",
              "GitProxyHelp",
              "SSLVerify",
              "SSLVerifyHelp",
          )

          replacements = {
              "ru-RU.json": (
                  "Заменяет встроенный ADB поддерживаемых эмуляторов на выбранный ADB, чтобы избежать конфликтов версий.",
                  "Репозиторий Git, используемый для установки и обновления. Пользователи из КНР могут использовать git://git.pull/AzurPilot.",
              ),
              "en-US.json": (
                  "Replace the bundled ADB of supported emulators with the selected ADB to avoid version conflicts.",
                  "Git repository used for install and update. CN users may use git://git.pull/AzurPilot.",
              ),
          }

          def find_deploy_group(node, path=()):
              matches = []
              if isinstance(node, dict):
                  if "RepositoryHelp" in node and "ReplaceAdbHelp" in node:
                      matches.append((path, node))
                  for key, value in node.items():
                      matches.extend(find_deploy_group(value, path + (key,)))
              elif isinstance(node, list):
                  for index, value in enumerate(node):
                      matches.extend(find_deploy_group(value, path + (str(index),)))
              return matches

          for filename, (adb_help, old_repo_help) in replacements.items():
              path = Path("module/config/i18n") / filename
              data = json.loads(path.read_text(encoding="utf-8"))
              matches = find_deploy_group(data)
              if len(matches) != 1:
                  raise SystemExit(f"{filename}: expected one deploy i18n group, found {len(matches)}")
              group_path, group = matches[0]
              if group.get("RepositoryHelp") != old_repo_help:
                  raise SystemExit(f"{filename}: unexpected RepositoryHelp before cleanup at {group_path}")
              missing = [key for key in legacy_keys if key not in group]
              if missing:
                  raise SystemExit(f"{filename}: legacy deploy keys missing before cleanup: {missing}")
              for key in legacy_keys:
                  del group[key]
              group["ReplaceAdbHelp"] = adb_help
              path.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
                  newline="",
              )
          PY

      - name: Extend cleanup regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_no_upstream_project_network_defaults.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''    # Docker publish остаётся, но публикует image в GHCR самого форка без DockerHub secrets.\n'''
          block = '''    # Старый встроенный Git-updater уже удалён из runtime: его CN-oriented UI residues не должны возвращаться.\n    deploy_config = (ROOT / "deploy/config.py").read_text(encoding="utf-8")\n    for key in ("Repository", "Branch", "GitExecutable", "GitProxy", "SSLVerify"):\n        assert f'"{key}"' in deploy_config\n    legacy_repo_hint = "git://git." + "pull/AzurPilot"\n    assert legacy_repo_hint not in ru_i18n\n    assert legacy_repo_hint not in en_i18n\n    assert "Пользователи из КНР" not in ru_i18n\n    assert "CN users may use" not in en_i18n\n    assert "китайскими эмуляторами Android" not in ru_i18n\n    assert "Chinese Android emulators" not in en_i18n\n    assert "конфликтов версий" in ru_i18n\n    assert "version conflicts" in en_i18n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit("network cleanup test: Docker publish anchor not found")
          path.write_text(text.replace(anchor, block + anchor, 1), encoding="utf-8", newline="")
          PY

      - name: Verify dead updater contract and focused tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          config = Path("deploy/config.py").read_text(encoding="utf-8")
          ignored_block = config.split("LEGACY_IGNORED_KEYS =", 1)[1].split(")\n\n\nclass ExecutionError", 1)[0]
          for key in ("Repository", "Branch", "GitExecutable", "GitProxy", "SSLVerify"):
              if f'"{key}"' not in ignored_block:
                  raise SystemExit(f"{key} is not a legacy ignored deploy key")

          templates = [
              Path("config/deploy.template.yaml"),
              Path("config/deploy.template-linux.yaml"),
              Path("config/deploy.template-docker.yaml"),
              Path("config/deploy.template-AidLux.yaml"),
              Path("deploy/template"),
          ]
          for template in templates:
              text = template.read_text(encoding="utf-8")
              for key in ("Repository:", "Branch:", "GitExecutable:", "GitProxy:", "SSLVerify:"):
                  if re.search(rf"(?m)^\s*{re.escape(key)}", text):
                      raise SystemExit(f"{template}: dead updater key returned: {key}")
          PY

          if git grep -n -E 'git://git\.pull/AzurPilot|CN users may use|Пользователи из КНР' -- module/config/i18n; then
            echo 'Stale CN updater guidance remains.' >&2
            exit 1
          fi
          uv run --locked --group ci python -m pytest -q tests/test_no_upstream_project_network_defaults.py
          git diff --check

      - name: Commit non-workflow cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module/config/i18n/en-US.json module/config/i18n/ru-RU.json tests/test_no_upstream_project_network_defaults.py
          git diff --cached --name-status
          git diff --cached --quiet && { echo 'Expected deploy-i18n cleanup changes were not generated.' >&2; exit 1; }
          git commit -m "refactor(global): удалить CN-oriented updater i18n residues"
          git push origin HEAD:chatgpt/remove-upstream-announcements
