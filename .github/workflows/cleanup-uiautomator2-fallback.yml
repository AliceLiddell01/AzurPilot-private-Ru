name: One-time uiautomator2 fallback cleanup

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.head_ref == 'chatgpt/remove-upstream-announcements' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chatgpt/remove-upstream-announcements
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --group ci

      - name: Remove external uiautomator2 fallback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one sentinel, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8", newline="")

          old_loop = '''                for _ in range(2):\n                    try:\n                        initer.install()\n                        break\n                    except AssertionError:\n                        logger.info(f'AssertionError при установке uiautomator2 на устройство {device.serial}')\n                        logger.info('Если вы используете BlueStacks, LDPlayer или WSA, '\n                                    'включите ADB в настройках эмулятора')\n                        exit(1)\n                    except ConnectionError:\n                        if _ == 1:\n                            raise\n                        init.GITHUB_BASEURL = 'http://tool.appetizer.io/openatx'\n'''
          new_loop = '''                try:\n                    initer.install()\n                except AssertionError:\n                    logger.info(f'AssertionError при установке uiautomator2 на устройство {device.serial}')\n                    logger.info('Если вы используете BlueStacks, LDPlayer или WSA, '\n                                'включите ADB в настройках эмулятора')\n                    exit(1)\n                except ConnectionError:\n                    logger.error('Не удалось установить ресурсы uiautomator2; внешний fallback отключён')\n                    raise\n'''
          replace_once("deploy/adb.py", old_loop, new_loop)
          replace_once("deploy/Windows/adb.py", old_loop, new_loop)

          replace_once(
              "module/device/connection.py",
              '''        try:\n            init.install()\n        except ConnectionError:\n            u2.init.GITHUB_BASEURL = 'http://tool.appetizer.io/openatx'\n            init.install()\n''',
              '''        try:\n            init.install()\n        except ConnectionError:\n            logger.error('[Устройство — соединение] Не удалось установить ресурсы uiautomator2; внешний fallback отключён')\n            raise\n''',
          )

          replace_once(
              "deploy/patch.py",
              '''    uiautomator2 默认从 tool.appetizer.io 或 github.com/openatx 下载资源，\n    但这些地址在国内可能不可用或速度慢。因此修补为使用本地缓存 uiautomator2cache/cache。\n\n    同时移除 minicap 安装，因为模拟器不需要它。\n''',
              '''    uiautomator2 旧版安装器 может загружать ресурсы из внешних источников.\n    AzurPilot использует локальный uiautomator2cache/cache, чтобы установка не зависела\n    от скрытых сетевых fallback-адресов.\n\n    Одновременно отключается установка minicap, который эмуляторам не требуется.\n''',
          )
          PY

      - name: Extend network cleanup regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_no_upstream_project_network_defaults.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''    # MAA updater сохраняет обновление, но использует только официальный GitHub API и release assets.\n'''
          block = '''    # Старый uiautomator2 installer больше не переключается на скрытый внешний fallback.\n    u2_sources = [\n        (ROOT / "deploy/adb.py").read_text(encoding="utf-8"),\n        (ROOT / "deploy/Windows/adb.py").read_text(encoding="utf-8"),\n        (ROOT / "deploy/patch.py").read_text(encoding="utf-8"),\n        (ROOT / "module/device/connection.py").read_text(encoding="utf-8"),\n    ]\n    hidden_u2_host = "tool.appetizer" + ".io"\n    for source in u2_sources:\n        assert hidden_u2_host not in source\n    assert "uiautomator2cache" in u2_sources[2]\n    assert "внешний fallback отключён" in u2_sources[0]\n    assert "внешний fallback отключён" in u2_sources[1]\n    assert "внешний fallback отключён" in u2_sources[3]\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit("network cleanup test: MAA updater anchor not found")
          path.write_text(text.replace(anchor, block + anchor, 1), encoding="utf-8", newline="")
          PY

      - name: Verify focused contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python -m py_compile deploy/adb.py deploy/Windows/adb.py deploy/patch.py module/device/connection.py
          if git grep -n 'tool.appetizer.io' -- deploy module; then
            echo 'Hidden uiautomator2 fallback remains.' >&2
            exit 1
          fi
          uv run --locked --group ci python -m pytest -q tests/test_no_upstream_project_network_defaults.py
          git diff --check

      - name: Commit non-workflow cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/adb.py deploy/Windows/adb.py deploy/patch.py module/device/connection.py tests/test_no_upstream_project_network_defaults.py
          git diff --cached --name-status
          git diff --cached --quiet && { echo 'Expected uiautomator2 cleanup changes were not generated.' >&2; exit 1; }
          git commit -m "refactor(network): удалить скрытый uiautomator2 fallback"
          git push origin HEAD:chatgpt/remove-upstream-announcements
