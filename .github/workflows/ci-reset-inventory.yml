name: CI reset inventory

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: read

concurrency:
  group: ci-reset-inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inventory:
    name: CI reset inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout productized CI paths
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            .codex
            dev_tools/security
            docs/benchmarks
            module/daemon
            module/ocr
            tests
            tools
          sparse-checkout-cone-mode: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Print remaining Stage references in productized paths
        shell: bash
        run: |
          set -euo pipefail
          git grep -n -i -E 'stage(3|4|5|6|7|8a|8b)' -- \
            .github/workflows/ci.yml \
            dev_tools/security \
            docs/benchmarks \
            module/daemon \
            module/ocr \
            tests/test_binary_log_audit.py \
            tests/test_binary_log_audit_arguments.py \
            tests/test_device_acceptance.py \
            tests/test_device_security.py \
            tests/test_exception_context_audit.py \
            tests/test_ocr_acceptance.py \
            tests/test_ocr_debug_privacy.py \
            tests/test_ocr_rpc_runtime.py \
            tests/test_opsi_zone_ocr_acceptance.py \
            tests/test_webui_traceback_security.py \
            tests/run_webui_traceback_browser.py \
            tests/serve_webui_traceback.py \
            tools || true
