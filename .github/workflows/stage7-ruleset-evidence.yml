name: Stage 7 ruleset evidence

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: read

jobs:
  evidence:
    name: Collect personal/stable ruleset evidence
    if: github.event.pull_request.head.ref == 'codex/stage7-log-russianization-recovery'
    runs-on: ubuntu-24.04
    steps:
      - name: Query applicable rules and required checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/stage7-ruleset
          api='https://api.github.com'
          headers=(
            -H 'Accept: application/vnd.github+json'
            -H "Authorization: Bearer $GH_TOKEN"
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )
          curl --fail-with-body --silent --show-error --location \
            "${headers[@]}" \
            "$api/repos/$REPOSITORY/rules/branches/personal%2Fstable" \
            > artifacts/stage7-ruleset/applicable-rules.json
          curl --fail-with-body --silent --show-error --location \
            "${headers[@]}" \
            "$api/repos/$REPOSITORY/rulesets" \
            > artifacts/stage7-ruleset/rulesets.json
          status=0
          curl --fail-with-body --silent --show-error --location \
            "${headers[@]}" \
            "$api/repos/$REPOSITORY/branches/personal%2Fstable/protection/required_status_checks" \
            > artifacts/stage7-ruleset/classic-required-status-checks.json || status=$?
          printf '%s\n' "$status" > artifacts/stage7-ruleset/classic-endpoint-exit-code.txt
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/stage7-ruleset')
          applicable = json.loads((root / 'applicable-rules.json').read_text(encoding='utf-8'))
          contexts = []
          for rule in applicable:
              if rule.get('type') != 'required_status_checks':
                  continue
              for check in rule.get('parameters', {}).get('required_status_checks', []):
                  context = check.get('context')
                  if context:
                      contexts.append(context)
          summary = {
              'applicable_rule_types': [rule.get('type') for rule in applicable],
              'required_status_check_contexts': sorted(set(contexts)),
          }
          (root / 'summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload ruleset evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage7-ruleset-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/stage7-ruleset
          if-no-files-found: error
          retention-days: 3
