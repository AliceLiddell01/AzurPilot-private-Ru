name: CI reset preservation apply

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: write

concurrency:
  group: ci-reset-preservation-apply
  cancel-in-progress: true

jobs:
  apply:
    name: Apply preservation map
    if: github.repository == 'AliceLiddell01/AzurPilot-private-Ru' && github.head_ref == 'codex/ci-reset'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ref: codex/ci-reset

      - name: Apply mechanical product renames
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply-ci-reset-preservation.py
          git restore .github/workflows/ci.yml
          git restore docs/benchmarks/ocr-english-models.md
          git restore docs/benchmarks/screenshot-interval.md
          git diff --check
          test -n "$(git status --porcelain -- dev_tools module tests tools)"

      - name: Commit atomic preservation map
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- dev_tools/security module/ocr module/daemon/screenshot_interval_benchmark.py tests tools
          git commit -m 'refactor: вынести product regressions из Stage namespace'
          git push origin HEAD:codex/ci-reset
