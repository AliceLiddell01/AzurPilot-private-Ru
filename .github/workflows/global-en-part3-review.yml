name: Global EN Part 3 Review

on:
  pull_request:
    branches:
      - personal/stable
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: global-en-part3-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  review:
    name: Global EN Part 3 Review
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/global-en-cleanup') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact review head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact review head and branch boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor e392880602bc83986f42107fc87b1ce7c1d52ef0 HEAD
          test "$(git rev-list --count e392880602bc83986f42107fc87b1ce7c1d52ef0..1c80d2cfeb6be075102924a27557f625c3cf290f)" = "12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - name: Validate locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --group ci

      - name: Download immutable Part 1 inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/part1-inventory"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/8948427118/zip" \
            > "${RUNNER_TEMP}/part1-inventory.zip"
          echo "cef21318c3b9934dc91177602814f8d9947d2442dcdb2ebb4b4b6fd85c217839  ${RUNNER_TEMP}/part1-inventory.zip" | sha256sum --check
          unzip -q "${RUNNER_TEMP}/part1-inventory.zip" -d "${RUNNER_TEMP}/part1-inventory"

      - name: Apply bounded remediation and reconcile exact assets
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python tools/global_en_part3_patch.py
          uv run --locked python tools/global_en_part3_review.py \
            "${RUNNER_TEMP}/part1-inventory" \
            "${RUNNER_TEMP}/global-en-part3-review"
          while IFS= read -r path; do
            mkdir -p "${RUNNER_TEMP}/global-en-part3-review/files/$(dirname "$path")"
            cp "$path" "${RUNNER_TEMP}/global-en-part3-review/files/$path"
          done <<'EOF'
          module/config/server.py
          module/webui/oobe.py
          tests/test_global_en_runtime.py
          tests/test_oobe_global_en_security.py
          README.md
          .codex/context/03-CONFIG-I18N.md
          .codex/context/04-DEVICE-UI-OCR.md
          EOF

      - name: Run complete verification contour
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked ruff check . --select E9,F63,F7,F82 --ignore F821,F722
          uv run --locked python - <<'PY'
          import compileall
          from pathlib import Path

          roots = (
              Path("alas.py"),
              Path("gui.py"),
              Path("mcp_server_sse.py"),
              Path("module"),
              Path("dev_tools"),
              Path("tests"),
              Path("tools"),
          )
          failed = False
          for root in roots:
              if not root.exists():
                  continue
              if root.is_file():
                  failed = not compileall.compile_file(root, quiet=1) or failed
              else:
                  failed = not compileall.compile_dir(root, quiet=1) or failed
          if failed:
              raise SystemExit("Python compilation failed.")
          PY
          uv run --locked --group ci python -m pytest -q tests
          uv run --locked python -m dev_tools.button_extract
          git diff --exit-code -- ':(glob)module/*/assets.py'
          uv run --locked python -m dev_tools.button_extract
          git diff --exit-code -- ':(glob)module/*/assets.py'
          uv run --locked python -m module.config.config_updater
          git diff --exit-code -- module/config/argument/args.json module/config/argument/menu.json module/config/config_generated.py config/template.json module/config/i18n/ru-RU.json module/config/i18n/en-US.json
          cp module/config/argument/args.json "${RUNNER_TEMP}/args-first.json"
          cp module/config/config_generated.py "${RUNNER_TEMP}/config-generated-first.py"
          uv run --locked python -m module.config.config_updater
          git diff --exit-code -- module/config/argument/args.json module/config/argument/menu.json module/config/config_generated.py config/template.json module/config/i18n/ru-RU.json module/config/i18n/en-US.json
          cmp "${RUNNER_TEMP}/args-first.json" module/config/argument/args.json
          cmp "${RUNNER_TEMP}/config-generated-first.py" module/config/config_generated.py
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          for path in Path(".").rglob("*.json"):
              if ".venv" not in path.parts:
                  json.loads(path.read_text(encoding="utf-8"))
          for path in Path(".").rglob("*.yaml"):
              if ".venv" not in path.parts:
                  list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
          PY
          git diff --check

      - name: Upload text-only independent review evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: global-en-part3-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/global-en-part3-review
          if-no-files-found: error
          retention-days: 14
