name: One-time remote default cleanup

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.head_ref == 'chatgpt/remove-upstream-announcements' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chatgpt/remove-upstream-announcements
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --group ci

      - name: Remove obsolete PyWebIO provider default
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("module/webui/remote_access.py")
          text = path.read_text(encoding="utf-8")
          old = '''    def _run(\n        self,\n        local_host="127.0.0.1",\n        local_port=25548,\n        server="app.pywebio.online",\n        server_port=1022,\n        remote_port="/",\n        setup_timeout=60,\n    ) -> None:\n'''
          new = '''    def _run(\n        self,\n        server: str,\n        local_host="127.0.0.1",\n        local_port=25548,\n        server_port=1022,\n        remote_port="/",\n        setup_timeout=60,\n    ) -> None:\n'''
          if text.count(old) != 1:
              raise SystemExit("remote_access.py: obsolete provider signature sentinel not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="")

          test_path = Path("tests/test_no_upstream_project_network_defaults.py")
          test_text = test_path.read_text(encoding="utf-8")
          anchor = '''    developer_tools = (ROOT / "module/webui/app_developer_tools.py").read_text(\n        encoding="utf-8"\n    )\n'''
          replacement = anchor + '''    remote_access = (ROOT / "module/webui/remote_access.py").read_text(\n        encoding="utf-8"\n    )\n'''
          if test_text.count(anchor) != 1:
              raise SystemExit("network cleanup test: developer_tools anchor not found exactly once")
          test_text = test_text.replace(anchor, replacement, 1)

          anchor = '''    # Экран удалённого доступа остаётся, но больше не рекламирует upstream provider.\n    assert 't("Gui.Remote.ConfigureHint")' in developer_tools\n    assert "app.azurlane.cloud" not in developer_tools\n'''
          replacement = anchor + '''\n    # SSH provider остаётся полностью настраиваемым: private runtime не имеет скрытого fallback-хоста.\n    assert "app.pywebio.online" not in remote_access\n    assert "server, server_port = _parse_host_port(State.deploy_config.SSHServer)" in remote_access\n    assert '"server": target' in remote_access\n'''
          if test_text.count(anchor) != 1:
              raise SystemExit("network cleanup test: remote UI contract anchor not found exactly once")
          test_path.write_text(test_text.replace(anchor, replacement, 1), encoding="utf-8", newline="")
          PY

      - name: Retire one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/cleanup-remote-default.yml
          printf '%s\n' 'remote default cleanup complete; remove marker with GitHub connector' > .github/remote-default-cleanup.done

      - name: Verify focused contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python -m py_compile module/webui/remote_access.py
          uv run --locked --group ci python -m pytest -q tests/test_no_upstream_project_network_defaults.py
          if git grep -n 'app.pywebio.online' -- .; then
            echo 'Obsolete PyWebIO remote provider default remains.' >&2
            exit 1
          fi
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --name-status
          git diff --cached --quiet && { echo 'Expected remote-default cleanup changes were not generated.' >&2; exit 1; }
          git commit -m "refactor(remote): удалить скрытый PyWebIO provider default"
          git push origin HEAD:chatgpt/remove-upstream-announcements
