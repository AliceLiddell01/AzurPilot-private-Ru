name: Stage 7 GUI repair final apply

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: write

concurrency:
  group: stage7-gui-repair-final-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply final validated gui.py repair
    if: github.event.pull_request.head.ref == 'codex/stage7-log-russianization-recovery'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify live refs
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse origin/personal/stable)" = "$BASE_SHA"
          test "$(git ls-remote --heads origin "$HEAD_REF" | awk '{print $1}')" = "$HEAD_SHA"

      - name: Decode trusted payload
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/stage7-final"
          mkdir -p "$work/extracted"
          cat \
            .codex/tmp/stage7-repair/payload.part00 \
            .codex/tmp/stage7-repair/payload.part01a \
            .codex/tmp/stage7-repair/payload.part01b \
            .codex/tmp/stage7-repair/payload.part02 \
            .codex/tmp/stage7-repair/payload.part03a \
            .codex/tmp/stage7-repair/payload.part03b \
            .codex/tmp/stage7-repair/payload.part04 \
            .codex/tmp/stage7-repair/payload.part05 \
            .codex/tmp/stage7-repair/payload.part06 \
            > "$work/payload.b64"
          printf '%s  %s\n' \
            a21bbf73719a5b382aa451f7bac398e6cd558a902b86fb1a52fa894c886861c0 \
            "$work/payload.b64" | sha256sum -c -
          base64 --decode "$work/payload.b64" > "$work/payload.tar.gz"
          printf '%s  %s\n' \
            fcbca93bb65bdedb8d1fb80bb1ae506d5d276490274ad97dd0c40ed352c6fd3e \
            "$work/payload.tar.gz" | sha256sum -c -
          python - "$work/payload.tar.gz" "$work/extracted" <<'PY'
          from pathlib import Path, PurePosixPath
          import sys
          import tarfile

          archive = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          expected = {
              "DELETE.txt",
              "dev_tools/stage7_gui_contract.py",
              "dev_tools/stage7_log_audit.py",
              "dev_tools/verify_stage7.py",
              "docs/stage7-recovery-migration-map.md",
              "gui.py",
              "tests/test_stage7_log_audit.py",
              "tests/test_stage7_process_lifecycle_logs.py",
              "tests/test_stage7_stable_contracts.py",
          }
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              names = {
                  member.name.removeprefix("./")
                  for member in members
                  if member.isfile()
              }
              if names != expected:
                  raise SystemExit(f"unexpected payload entries: {sorted(names ^ expected)}")
              for member in members:
                  normalized = member.name.removeprefix("./")
                  path = PurePosixPath(normalized)
                  if path.is_absolute() or ".." in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f"unsafe payload entry: {member.name}")
              bundle.extractall(destination, filter="data")
          PY

      - name: Apply exact fixture classification fix
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/stage7-final/extracted"
          python - "$work" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          audit = root / "dev_tools/stage7_log_audit.py"
          source = audit.read_text(encoding="utf-8")
          marker = '    "E:/path\\\\to/alas/alas.exe, /root/alas/, ./relative/path/log.txt",'
          replacement = marker + '\n    r"E:/path\\\\to/alas/alas.exe, /root/alas/, ./relative/path/log.txt",'
          if source.count(marker) != 1:
              raise SystemExit("developer fixture marker changed")
          audit.write_text(source.replace(marker, replacement, 1), encoding="utf-8")

          tests = root / "tests/test_stage7_log_audit.py"
          source = tests.read_text(encoding="utf-8")
          anchor = '\n\nif __name__ == "__main__":\n'
          regression = (
              "\n\nclass Stage7DeveloperFixtureRegressionTests(unittest.TestCase):\n"
              "    def test_escaped_path_example_is_developer_output(self) -> None:\n"
              "        from dev_tools.stage7_log_audit import _owner\n\n"
              "        self.assertEqual(\n"
              "            _owner(\n"
              "                \"module/logger.py\",\n"
              "                r\"E:/path\\\\to/alas/alas.exe, /root/alas/, ./relative/path/log.txt\",\n"
              "            ),\n"
              "            \"developer\",\n"
              "        )\n"
          )
          if source.count(anchor) != 1:
              raise SystemExit("test anchor changed")
          tests.write_text(source.replace(anchor, regression + anchor, 1), encoding="utf-8")
          PY

      - name: Verify pre-repair sources
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c <<'EOF'
          a7de027231db5d63dca736197430a7bae1854fa0af87146bc2b4df1aad41823f  gui.py
          026a87c9e2af03be8f211fdf9617c2763a7b7a873be9ffd85f4efef8dc70ad32  dev_tools/stage7_log_audit.py
          55a92b3851dc8f5a2ca93347166dbcf8126459e4b25246dfbf2106ed895b0dcd  dev_tools/verify_stage7.py
          3c9024b246edf4bf9d5f30a625caf0af33477232259df6525908ce5a6718e034  tests/test_stage7_log_audit.py
          15af35f1bb1f02eb1f98fd5d0e777441ab862a61e0ccc0a251c4e8c05a0539e0  tests/test_stage7_process_lifecycle_logs.py
          4a71cbfdd9a075c60273bb51426cdbe2e5b2ce860d6ff31adf862940287a55be  tests/test_stage7_stable_contracts.py
          8c24db470d13303981bb28ffc1975fd7de99bc67a27d01e948adffafa98c3959  docs/stage7-recovery-migration-map.md
          EOF
          test -f dev_tools/stage7_gui_stable_policy.py

      - name: Create repair commits
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/stage7-final/extracted"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          cp "$work/gui.py" gui.py
          cp "$work/dev_tools/stage7_gui_contract.py" dev_tools/stage7_gui_contract.py
          cp "$work/dev_tools/stage7_log_audit.py" dev_tools/stage7_log_audit.py
          cp "$work/dev_tools/verify_stage7.py" dev_tools/verify_stage7.py
          rm dev_tools/stage7_gui_stable_policy.py
          git add gui.py dev_tools/stage7_gui_contract.py dev_tools/stage7_log_audit.py dev_tools/verify_stage7.py
          git add -u dev_tools/stage7_gui_stable_policy.py
          git diff --cached --check
          git commit -m 'fix(stage7): включить gui.py в область русификации журналов'

          cp "$work/tests/test_stage7_log_audit.py" tests/test_stage7_log_audit.py
          cp "$work/tests/test_stage7_process_lifecycle_logs.py" tests/test_stage7_process_lifecycle_logs.py
          cp "$work/tests/test_stage7_stable_contracts.py" tests/test_stage7_stable_contracts.py
          git add tests/test_stage7_log_audit.py tests/test_stage7_process_lifecycle_logs.py tests/test_stage7_stable_contracts.py
          git diff --cached --check
          git commit -m 'test(stage7): защитить семантику WebUI supervisor'

          cp "$work/docs/stage7-recovery-migration-map.md" docs/stage7-recovery-migration-map.md
          rm -rf .codex/tmp/stage7-repair
          git add docs/stage7-recovery-migration-map.md
          git add -u .codex/tmp/stage7-repair
          git diff --cached --check
          git commit -m 'docs(stage7): актуализировать контракт восстановления gui.py'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Verify repair before push
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen
          uv run ruff check gui.py dev_tools/stage7_gui_contract.py dev_tools/stage7_log_audit.py dev_tools/verify_stage7.py tests/test_stage7_log_audit.py tests/test_stage7_process_lifecycle_logs.py tests/test_stage7_stable_contracts.py
          uv run python -m unittest -v tests/test_stage7_log_audit.py tests/test_stage7_process_lifecycle_logs.py tests/test_stage7_stable_contracts.py tests/test_webui_worker_registry.py tests/test_webui_no_reload_recovery.py
          uv run python -m dev_tools.verify_stage7 --base-ref origin/personal/stable --output-dir artifacts/stage7-repair-prepush
          git diff --check origin/personal/stable...HEAD
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Push without history rewrite
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git ls-remote --heads origin "$HEAD_REF" | awk '{print $1}')" = "$HEAD_SHA"
          test "$(git ls-remote --heads origin personal/stable | awk '{print $1}')" = "$BASE_SHA"
          git push origin "HEAD:$HEAD_REF"
