name: One-time external host inventory

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: read

jobs:
  inventory:
    if: ${{ github.head_ref == 'chatgpt/remove-upstream-announcements' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Inventory external hosts in tracked text files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import collections
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import urlsplit

          TEXT_SUFFIXES = {
              ".css", ".html", ".ini", ".js", ".json", ".md", ".py", ".ps1",
              ".sh", ".toml", ".txt", ".xml", ".yaml", ".yml",
          }
          URL_RE = re.compile(r"(?i)\b(?:https?|wss?|stun|turn)://[^\s<>'\"`]+")

          files = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          host_files: dict[str, set[str]] = collections.defaultdict(set)
          examples: dict[str, list[str]] = collections.defaultdict(list)

          for raw in files:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8", errors="surrogateescape"))
              if path.suffix.lower() not in TEXT_SUFFIXES and path.name not in {
                  "Dockerfile", "template", "requirements.txt", "requirements-in.txt"
              }:
                  continue
              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except OSError:
                  continue
              for match in URL_RE.finditer(text):
                  url = match.group(0).rstrip(".,);]}\\")
                  parsed = urlsplit(url)
                  host = (parsed.hostname or "").lower().rstrip(".")
                  if not host:
                      continue
                  host_files[host].add(path.as_posix())
                  if len(examples[host]) < 3:
                      examples[host].append(url[:240])

          print("=== EXTERNAL HOST INVENTORY ===")
          for host in sorted(host_files):
              print(f"HOST {host} FILES {len(host_files[host])}")
              for filename in sorted(host_files[host])[:12]:
                  print(f"  FILE {filename}")
              for url in examples[host]:
                  print(f"  URL  {url}")

          suspicious = []
          markers = (
              ".cn", "aliyun", "alibaba", "tencent", "baidu", "bilibili", "biligame",
              "gitcode", "gitee", "coding.net", "163.com", "netease", "qq.com",
              "xiaomi", "deepseek", "fastgit", "kgithub", "maa.plus", "yituliu",
              "penguin", "azurlane.cloud", "pywebio.online", "appetizer", "yppp.net",
          )
          for host in sorted(host_files):
              if host.endswith(".cn") or any(marker in host for marker in markers):
                  suspicious.append(host)

          print("=== REVIEW CANDIDATES ===")
          for host in suspicious:
              print(f"CANDIDATE {host}")
              for filename in sorted(host_files[host]):
                  print(f"  FILE {filename}")
          PY
