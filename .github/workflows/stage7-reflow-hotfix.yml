name: Apply Stage 7 reflow hotfix

on:
  push:
    branches:
      - codex/stage7-log-russianization-recovery
    paths:
      - .github/workflows/stage7-reflow-hotfix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply exact CSS reflow patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("assets/gui/css/alas.css")
          text = path.read_text(encoding="utf-8")

          old_scroll = """    overflow-x: auto;
              overflow-y: auto;
              overscroll-behavior: contain;
          }
          """
          new_scroll = """    overflow-x: auto;
              overflow-y: auto;
              overscroll-behavior-x: contain;
              overscroll-behavior-y: auto;
          }
          """
          if old_scroll not in text:
              raise SystemExit("Expected traceback scroll block was not found")
          text = text.replace(old_scroll, new_scroll, 1)

          marker = ".rich-traceback-container,\n.rich-traceback-container * {"
          reflow_css = """.modal:has(.rich-traceback-container) {
              align-items: flex-start !important;
              box-sizing: border-box;
              overflow-y: auto !important;
              padding-block: 1rem;
          }

          .modal:has(.rich-traceback-container) > .modal-dialog {
              margin-block: auto;
          }

          """
          if reflow_css not in text:
              if marker not in text:
                  raise SystemExit("Expected traceback font block marker was not found")
              text = text.replace(marker, reflow_css + marker, 1)

          path.write_text(text, encoding="utf-8")
          PY

          git diff --check

      - name: Commit hotfix
        shell: bash
        run: |
          if git diff --quiet -- assets/gui/css/alas.css; then
            echo "No CSS changes required"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gui/css/alas.css
          git commit -m "fix(stage7): restore bidirectional scroll at browser zoom"
          git push origin HEAD:codex/stage7-log-russianization-recovery
