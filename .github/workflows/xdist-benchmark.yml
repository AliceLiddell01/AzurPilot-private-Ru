name: Временный benchmark xdist

on:
  push:
    branches:
      - codex/test-platform-modernization

permissions:
  contents: read

jobs:
  benchmark:
    name: xdist -n ${{ matrix.workers }}
    if: ${{ github.ref == 'refs/heads/codex/test-platform-modernization' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        workers: [2, 4, 6, 8, auto]
    env:
      CI_POSTGRES_ADMIN_USER: azurpilot_ci_admin
      CI_POSTGRES_ADMIN_PASSWORD: ci-admin-${{ github.run_id }}-${{ github.run_attempt }}
      CI_POSTGRES_OWNER_USER: azurpilot_ci_owner
      CI_POSTGRES_MIGRATOR_USER: azurpilot_ci_migrator
      CI_POSTGRES_MIGRATOR_PASSWORD: ci-migrator-${{ github.run_id }}-${{ github.run_attempt }}
      AZURPILOT_POSTGRES_HOST: 127.0.0.1
      AZURPILOT_POSTGRES_PORT: "5432"
      AZURPILOT_POSTGRES_DATABASE: azurpilot_ci
      AZURPILOT_POSTGRES_USER: azurpilot_ci
      AZURPILOT_POSTGRES_PASSWORD: ci-app-${{ github.run_id }}-${{ github.run_attempt }}
      AZURPILOT_POSTGRES_SSLMODE: disable
      AZURPILOT_POSTGRES_MIGRATOR_HOST: 127.0.0.1
      AZURPILOT_POSTGRES_MIGRATOR_PORT: "5432"
      AZURPILOT_POSTGRES_MIGRATOR_DATABASE: azurpilot_ci
      AZURPILOT_POSTGRES_MIGRATOR_USER: azurpilot_ci_migrator
      AZURPILOT_POSTGRES_MIGRATOR_PASSWORD: ci-migrator-${{ github.run_id }}-${{ github.run_attempt }}
      AZURPILOT_POSTGRES_MIGRATOR_SSLMODE: disable
      AZURPILOT_POSTGRES_DISPOSABLE: "1"
      AZURPILOT_POSTGRES_DISPOSABLE_HOST: 127.0.0.1
      AZURPILOT_POSTGRES_DISPOSABLE_PORT: "5432"
      AZURPILOT_POSTGRES_DISPOSABLE_DATABASE: azurpilot_ci
      AZURPILOT_POSTGRES_DISPOSABLE_USER: azurpilot_ci
      AZURPILOT_POSTGRES_DISPOSABLE_SCRATCH_DATABASE: azurpilot_ci_restore
    services:
      postgres:
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: azurpilot_ci_admin
          POSTGRES_PASSWORD: ci-admin-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U azurpilot_ci_admin -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Получить exact head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Проверить exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Установить uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          version: "0.12.13"

      - name: Установить Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.7"

      - name: Проверить uv.lock
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check

      - name: Синхронизировать CI-окружение
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked --group ci

      - name: Подготовить PostgreSQL и Alembic cycle
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python - <<'PY'
          import os
          import psycopg
          from psycopg import sql

          with psycopg.connect(
              host=os.environ["AZURPILOT_POSTGRES_HOST"],
              port=os.environ["AZURPILOT_POSTGRES_PORT"],
              dbname="postgres",
              user=os.environ["CI_POSTGRES_ADMIN_USER"],
              password=os.environ["CI_POSTGRES_ADMIN_PASSWORD"],
              autocommit=True,
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      sql.SQL(
                          "CREATE ROLE {} NOLOGIN NOSUPERUSER "
                          "NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
                      ).format(
                          sql.Identifier(os.environ["CI_POSTGRES_OWNER_USER"]),
                      )
                  )
                  cursor.execute(
                      sql.SQL(
                          "CREATE ROLE {} LOGIN PASSWORD {} NOSUPERUSER "
                          "NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
                      ).format(
                          sql.Identifier(os.environ["CI_POSTGRES_MIGRATOR_USER"]),
                          sql.Literal(os.environ["CI_POSTGRES_MIGRATOR_PASSWORD"]),
                      )
                  )
                  cursor.execute(
                      sql.SQL("GRANT {} TO {}").format(
                          sql.Identifier(os.environ["CI_POSTGRES_OWNER_USER"]),
                          sql.Identifier(os.environ["CI_POSTGRES_MIGRATOR_USER"]),
                      )
                  )
                  cursor.execute(
                      sql.SQL(
                          "CREATE ROLE {} LOGIN PASSWORD {} NOSUPERUSER "
                          "NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
                      ).format(
                          sql.Identifier(os.environ["AZURPILOT_POSTGRES_USER"]),
                          sql.Literal(os.environ["AZURPILOT_POSTGRES_PASSWORD"]),
                      )
                  )
                  cursor.execute(
                      sql.SQL("CREATE DATABASE {} OWNER {}").format(
                          sql.Identifier(os.environ["AZURPILOT_POSTGRES_DATABASE"]),
                          sql.Identifier(os.environ["CI_POSTGRES_OWNER_USER"]),
                      )
                  )
                  cursor.execute(
                      sql.SQL("CREATE DATABASE {} OWNER {}").format(
                          sql.Identifier(
                              os.environ[
                                  "AZURPILOT_POSTGRES_DISPOSABLE_SCRATCH_DATABASE"
                              ]
                          ),
                          sql.Identifier(os.environ["CI_POSTGRES_OWNER_USER"]),
                      )
                  )
          PY
          export AZURPILOT_POSTGRES_USER="${CI_POSTGRES_MIGRATOR_USER}"
          export AZURPILOT_POSTGRES_PASSWORD="${CI_POSTGRES_MIGRATOR_PASSWORD}"
          export AZURPILOT_POSTGRES_DISPOSABLE_USER="${CI_POSTGRES_MIGRATOR_USER}"
          export PGOPTIONS="-c role=${CI_POSTGRES_OWNER_USER}"
          uv run --locked alembic upgrade head
          uv run --locked alembic current --check-heads
          uv run --locked alembic check
          uv run --locked alembic downgrade base
          uv run --locked alembic upgrade head
          uv run --locked alembic current --check-heads
          uv run --locked alembic check
          unset PGOPTIONS
          export AZURPILOT_POSTGRES_USER="azurpilot_ci"
          export AZURPILOT_POSTGRES_PASSWORD="ci-app-${{ github.run_id }}-${{ github.run_attempt }}"
          export AZURPILOT_POSTGRES_DISPOSABLE_USER="azurpilot_ci"
          uv run --locked python - <<'PY'
          import os
          import psycopg
          from psycopg import sql

          with psycopg.connect(
              host=os.environ["AZURPILOT_POSTGRES_HOST"],
              port=os.environ["AZURPILOT_POSTGRES_PORT"],
              dbname=os.environ["AZURPILOT_POSTGRES_DATABASE"],
              user=os.environ["CI_POSTGRES_ADMIN_USER"],
              password=os.environ["CI_POSTGRES_ADMIN_PASSWORD"],
              autocommit=True,
          ) as connection:
              with connection.cursor() as cursor:
                  app = sql.Identifier(os.environ["AZURPILOT_POSTGRES_USER"])
                  owner = sql.Identifier(os.environ["CI_POSTGRES_OWNER_USER"])
                  cursor.execute(sql.SQL("GRANT CONNECT ON DATABASE {} TO {}").format(
                      sql.Identifier(os.environ["AZURPILOT_POSTGRES_DATABASE"]), app
                  ))
                  cursor.execute(sql.SQL("GRANT USAGE ON SCHEMA azurpilot TO {}").format(app))
                  cursor.execute(sql.SQL("GRANT SELECT ON TABLE alembic_version TO {}").format(app))
                  cursor.execute(sql.SQL(
                      "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA azurpilot TO {}"
                  ).format(app))
                  cursor.execute(sql.SQL(
                      "GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA azurpilot TO {}"
                  ).format(app))
                  cursor.execute(sql.SQL("SET ROLE {}").format(owner))
                  cursor.execute(sql.SQL(
                      "ALTER DEFAULT PRIVILEGES IN SCHEMA azurpilot "
                      "GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO {}"
                  ).format(app))
                  cursor.execute(sql.SQL(
                      "ALTER DEFAULT PRIVILEGES IN SCHEMA azurpilot "
                      "GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO {}"
                  ).format(app))
          PY

      - name: Измерить полный pytest для выбранного числа workers
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/azurpilot-xdist-benchmark"
          mkdir -p "$artifact_dir"
          worker_args=()
          if [[ "${{ matrix.workers }}" == "auto" ]]; then
            worker_args=(-n auto)
          else
            worker_args=(-n "${{ matrix.workers }}")
          fi
          start_ms="$(date +%s%3N)"
          uv run --locked --group ci python \
            -m pytest \
            -q \
            --dist=loadgroup \
            "${worker_args[@]}" \
            --cov=module \
            --cov=campaign \
            --cov=tools \
            --cov-branch \
            --cov-report=xml:"${artifact_dir}/coverage.xml" \
            --cov-report=term-missing:skip-covered \
            --junitxml="${artifact_dir}/pytest.xml" \
            tests
          end_ms="$(date +%s%3N)"
          duration_ms="$((end_ms - start_ms))"
          {
            echo "### xdist benchmark: -n ${{ matrix.workers }}"
            echo
            echo "- duration_ms: ${duration_ms}"
            echo "- commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "xdist benchmark workers=${{ matrix.workers }} duration_ms=${duration_ms} commit=${GITHUB_SHA}"
