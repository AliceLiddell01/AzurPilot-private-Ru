name: TEMP Event artifact refresh

on:
  push:
    branches:
      - refactor/stage5-event-architecture
    paths:
      - .github/workflows/temp-event-artifact-refresh.yml

permissions:
  contents: write

concurrency:
  group: temp-event-artifact-refresh
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"

jobs:
  refresh:
    name: Пересборка production artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - name: Validate environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --group ci

      - name: Rebuild committed production artifact
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --group ci python - <<'PY'
          from module.event_datamine.artifact import build_artifact, write_artifact
          from module.event_datamine.compiler import EventCompiler
          from module.event_datamine.discovery import discover_major_events, resolve_current_candidate
          from module.event_datamine.registry import write_registry
          from module.event_datamine.source import ShareCfgLoader, SourceSnapshot
          from tests.event_fixture_helpers import (
              CURRENT_FIXTURE_ROOT,
              artifact_active_time,
              current_fixture_identity,
              production_artifact,
              production_artifact_path,
          )

          _, server, repository, revision, activity_id = current_fixture_identity()
          loader = ShareCfgLoader(
              SourceSnapshot(CURRENT_FIXTURE_ROOT, server, repository, revision)
          )
          candidate = resolve_current_candidate(
              discover_major_events(loader),
              server=server,
              now=artifact_active_time(),
          )
          if candidate is None or candidate.activity_id != activity_id:
              raise SystemExit("Fixture не разрешилась в ожидаемое текущее событие")

          compiled = EventCompiler(loader).compile(activity_id).to_dict()
          previous = production_artifact()
          rebuilt = build_artifact(
              compiled,
              compiler_version=str(previous.get("compiler_version") or "1"),
              role=str(previous.get("role") or "production"),
              metadata=previous.get("metadata"),
          )
          write_artifact(production_artifact_path(), rebuilt)
          write_registry()
          PY

      - name: Verify generated scope and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          expected = {
              "module/event_datamine/data/index.json",
              "module/event_datamine/data/production/en-51101.json",
          }
          output = subprocess.check_output(
              ["git", "status", "--porcelain"],
              text=True,
          )
          actual = {line[3:] for line in output.splitlines() if line.strip()}
          if actual != expected:
              raise SystemExit(
                  f"Неожиданный scope после пересборки: {sorted(actual)}; ожидалось {sorted(expected)}"
              )
          PY
          git diff --check
          uv run --locked --group ci python -m pytest -q \
            tests/test_event_current_en.py::test_committed_current_artifact_and_production_resolver_use_fixture_result \
            tests/test_event_registry.py

      - name: Commit artifact and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-event-artifact-refresh.yml
          git add -- \
            module/event_datamine/data/index.json \
            module/event_datamine/data/production/en-51101.json
          python - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/temp-event-artifact-refresh.yml",
              "module/event_datamine/data/index.json",
              "module/event_datamine/data/production/en-51101.json",
          }
          output = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"],
              text=True,
          )
          actual = {line for line in output.splitlines() if line}
          if actual != expected:
              raise SystemExit(
                  f"Неожиданный staged scope: {sorted(actual)}; ожидалось {sorted(expected)}"
              )
          PY
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(event-datamine): синхронизировать production artifact"
          git push origin HEAD:refactor/stage5-event-architecture
