name: Temporary screenshot benchmark locale sync

on:
  pull_request:
    paths:
      - ".github/workflows/screenshot-benchmark-locale-sync.yml"

permissions:
  contents: write

concurrency:
  group: screenshot-benchmark-locale-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout writable head branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Add canonical locale keys
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("module/config/i18n/en-US.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          tasks = data["Task"]
          if "ScreenshotIntervalBenchmark" not in tasks:
              rebuilt = {}
              for key, value in tasks.items():
                  rebuilt[key] = value
                  if key == "OcrBenchmark":
                      rebuilt["ScreenshotIntervalBenchmark"] = {
                          "name": "Screenshot Interval Benchmark",
                          "help": (
                              "Automatically measures screenshot frequency on the "
                              "campaign screen and in free META Battle Simulation. "
                              "Profile settings are not changed automatically."
                          ),
                      }
              data["Task"] = rebuilt
          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit canonical locale
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module/config/i18n/en-US.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Canonical locale already synchronized"
            exit 0
          fi
          git commit -m "fix(i18n): синхронизировать ключи screenshot benchmark"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
