name: CI unittest discovery probe

on:
  pull_request:
    branches:
      - personal/stable
    paths:
      - ".github/workflows/ci-discovery-probe.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"
      - name: Run discovery
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked
          uv run --locked python -m unittest discover -v -s tests -p 'test_*.py'
          uv run --locked pytest -q tests/test_opsi_data_logger_hardening.py
          git diff --check
          test -z "$(git status --porcelain)"
