name: Stage 7 repair git bundle

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: read

jobs:
  bundle:
    name: Build exact-head diagnostic bundle
    if: github.event.pull_request.head.ref == 'codex/stage7-log-russianization-recovery'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build repository bundle
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/stage7-repair-bundle
          git update-ref refs/stage7-repair/base "$PR_BASE_SHA"
          git update-ref refs/stage7-repair/head "$PR_HEAD_SHA"
          git bundle create artifacts/stage7-repair-bundle/repository.bundle \
            refs/stage7-repair/base refs/stage7-repair/head
          git bundle verify artifacts/stage7-repair-bundle/repository.bundle
          printf '%s\n' "$PR_BASE_SHA" > artifacts/stage7-repair-bundle/BASE
          printf '%s\n' "$PR_HEAD_SHA" > artifacts/stage7-repair-bundle/HEAD
          sha256sum artifacts/stage7-repair-bundle/repository.bundle \
            > artifacts/stage7-repair-bundle/SHA256SUMS

      - name: Upload diagnostic bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage7-repair-git-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/stage7-repair-bundle
          if-no-files-found: error
          retention-days: 3
