name: Probe personal stable ruleset

on:
  pull_request:
    branches:
      - personal/stable
    paths:
      - ".github/workflows/ci-reset-final-tree-builder.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-reset-ruleset-probe-${{ github.sha }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout probe output path
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/ruleset-probe.json
            .github/workflows/ci-reset-final-tree-builder.yml
          ref: codex/ci-reset

      - name: Read effective rules and repository ruleset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RULESET_ID: "20179789"
        run: |
          set -euo pipefail

          effective_file="${RUNNER_TEMP}/effective-rules.json"
          effective_http_code="$(curl --silent --show-error \
            --output "$effective_file" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/rules/branches/personal%2Fstable")"

          details_file="${RUNNER_TEMP}/ruleset-details.json"
          details_http_code="$(curl --silent --show-error \
            --output "$details_file" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/rulesets/${RULESET_ID}")"

          python - "$effective_http_code" "$effective_file" "$details_http_code" "$details_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          def load(path: str):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except json.JSONDecodeError:
                  return {"message": "Non-JSON response omitted"}

          output = {
              "effective_rules_http_code": int(sys.argv[1]),
              "effective_rules": load(sys.argv[2]),
              "ruleset_details_http_code": int(sys.argv[3]),
              "ruleset_details": load(sys.argv[4]),
          }
          Path('.github/ruleset-probe.json').write_text(
              json.dumps(output, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -f -- .github/ruleset-probe.json
          git commit -m "chore: record ruleset details"
          git push origin HEAD:codex/ci-reset
