name: Validate replacement workflow

on:
  pull_request:
    branches:
      - personal/stable
    paths:
      - ".github/workflows/ci-reset-final-tree-builder.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-reset-actionlint-${{ github.sha }}
  cancel-in-progress: false

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact replacement workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/ci.yml
          ref: 1b511ecfc7e293ce4d486a946151a6b0cbb655a4

      - name: Run pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          actionlint_version='1.7.12'
          actionlint_archive="actionlint_${actionlint_version}_linux_amd64.tar.gz"
          actionlint_sha256='8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          actionlint_dir="${RUNNER_TEMP}/actionlint"
          mkdir -p "$actionlint_dir"
          curl --fail --location --silent --show-error \
            --output "${actionlint_dir}/${actionlint_archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}/${actionlint_archive}"
          printf '%s  %s\n' "$actionlint_sha256" "${actionlint_dir}/${actionlint_archive}" \
            | sha256sum --check --strict
          tar -xzf "${actionlint_dir}/${actionlint_archive}" -C "$actionlint_dir" actionlint
          "${actionlint_dir}/actionlint" .github/workflows/ci.yml
