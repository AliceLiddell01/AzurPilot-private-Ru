name: Patch CI Reset materialization

on:
  pull_request:
    branches:
      - personal/stable
    paths:
      - ".github/workflows/ci-reset-final-tree-builder.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-reset-materialization-patch-${{ github.sha }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout materialized files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/generated-ci.yml.txt
            .github/workflows/ci-reset-final-tree-builder.yml
            tests/test_ocr_rpc_security.py
          ref: codex/ci-reset

      - name: Patch generated CI and RPC test source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/generated-ci.yml.txt')
          text = workflow.read_text(encoding='utf-8')
          old_git = "$gitCommand = Get-Command git -CommandType Application -ErrorAction Stop"
          new_git = "$gitCommand = Get-Command git -CommandType Application -ErrorAction Stop | Select-Object -First 1"
          old_uv = "$uvCommand = Get-Command uv -CommandType Application -ErrorAction Stop"
          new_uv = "$uvCommand = Get-Command uv -CommandType Application -ErrorAction Stop | Select-Object -First 1"
          if old_git not in text:
              raise SystemExit('generated CI: git command resolution pattern not found')
          if old_uv not in text:
              raise SystemExit('generated CI: uv command resolution pattern not found')
          workflow.write_text(
              text.replace(old_git, new_git).replace(old_uv, new_uv),
              encoding='utf-8',
          )

          test_path = Path('tests/test_ocr_rpc_security.py')
          data = test_path.read_bytes()
          if b'\x00' not in data:
              raise SystemExit('RPC security test: expected embedded null bytes were not found')
          test_path.write_bytes(data.replace(b'\x00', b'\\x00'))
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -f -- .github/generated-ci.yml.txt tests/test_ocr_rpc_security.py
          git commit -m "build: patch generated CI and RPC test source"
          git push origin HEAD:codex/ci-reset
