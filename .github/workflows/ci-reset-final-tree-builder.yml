name: Probe personal stable ruleset

on:
  pull_request:
    branches:
      - personal/stable
    paths:
      - ".github/workflows/ci-reset-final-tree-builder.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-reset-ruleset-probe-${{ github.sha }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout probe output path
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/ruleset-probe.json
            .github/workflows/ci-reset-final-tree-builder.yml
          ref: codex/ci-reset

      - name: Read effective rules for personal stable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          response_file="${RUNNER_TEMP}/ruleset-response.json"
          http_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/rules/branches/personal%2Fstable")"

          python - "$http_code" "$response_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          http_code = int(sys.argv[1])
          response_path = Path(sys.argv[2])
          try:
              body = json.loads(response_path.read_text(encoding='utf-8'))
          except json.JSONDecodeError:
              body = {"message": "Non-JSON response omitted"}

          output = {
              "http_code": http_code,
              "body": body,
          }
          Path('.github/ruleset-probe.json').write_text(
              json.dumps(output, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -f -- .github/ruleset-probe.json
          git commit -m "chore: record effective ruleset probe"
          git push origin HEAD:codex/ci-reset
