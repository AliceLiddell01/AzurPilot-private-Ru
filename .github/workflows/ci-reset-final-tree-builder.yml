name: Build CI Reset final tree

on:
  pull_request:
    branches:
      - personal/stable
    paths:
      - ".github/workflows/ci-reset-final-tree-builder.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-reset-final-tree-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout final-tree inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .codex/context/08-VERIFICATION.md
            .github/scripts/ci-reset-builder.py.gz.b64.0
            .github/scripts/ci-reset-builder.py.gz.b64.1
            .github/workflows/ci-reset-final-tree-builder.yml
            .github/workflows/ci.yml
            docs/ci.md
            pyproject.toml
            tests/test_ocr_debug_privacy.py
            tests/test_ocr_rpc_security.py
            uv.lock
          ref: codex/ci-reset

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - name: Materialize non-workflow files
        shell: bash
        run: |
          set -euo pipefail

          cat .github/scripts/ci-reset-builder.py.gz.b64.* \
            | base64 --decode \
            | gzip --decompress > "${RUNNER_TEMP}/build_ci_reset_replacement.py"
          python "${RUNNER_TEMP}/build_ci_reset_replacement.py"
          uv lock
          uv lock --check
          cp .github/workflows/ci.yml .github/generated-ci.yml.txt

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -- \
            .codex/context/08-VERIFICATION.md \
            .github/generated-ci.yml.txt \
            docs/ci.md \
            pyproject.toml \
            tests/test_ocr_debug_privacy.py \
            tests/test_ocr_rpc_security.py \
            uv.lock
          git commit -m "build: materialize corrected CI Reset files"
          git push origin HEAD:codex/ci-reset

          final_commit="$(git rev-parse HEAD)"
          printf 'MATERIALIZED_COMMIT=%s\n' "$final_commit"
