name: Apply CI cleanup

on:
  pull_request:
    branches:
      - personal/stable
    paths:
      - ".github/workflows/ci-cleanup-apply.yml"

permissions:
  contents: write

concurrency:
  group: apply-ci-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/ci-reset' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Apply classified cleanup
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply_ci_cleanup.py
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "ci: удалить Stage/evidence инфраструктуру"
          git push origin HEAD:codex/ci-reset
