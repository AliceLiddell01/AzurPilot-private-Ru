name: PR 10 audit maintenance

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: write

concurrency:
  group: pr10-audit-maintenance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-audit:
    if: github.event.pull_request.number == 10
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Exclude README from Russianization audit
        shell: python
        run: |
          from pathlib import Path

          audit_path = Path('dev_tools/russianization_audit.py')
          source = audit_path.read_text(encoding='utf-8')

          old_constants = '''EXCLUDED_PREFIXES = {
              ".git/", ".venv/", "venv/", "node_modules/", "dist/", "build/",
              "__pycache__/", ".pytest_cache/", ".ruff_cache/", ".mypy_cache/",
              "github/workflows/", "github/stage4_",
              RESULTS_RELATIVE.as_posix() + "/",
          }
          '''
          new_constants = '''EXCLUDED_PATHS = {"README.md"}
          EXCLUDED_PREFIXES = {
              ".git/", ".venv/", "venv/", "node_modules/", "dist/", "build/",
              "__pycache__/", ".pytest_cache/", ".ruff_cache/", ".mypy_cache/",
              "github/workflows/", "github/stage4_",
              RESULTS_RELATIVE.as_posix() + "/",
          }
          '''
          if old_constants not in source:
              raise SystemExit('Expected EXCLUDED_PREFIXES block was not found')
          source = source.replace(old_constants, new_constants, 1)

          old_function = '''def is_excluded(path: str) -> bool:
              normalized = normalize_path(path)
              return any(normalized == prefix.rstrip("/") or normalized.startswith(prefix) for prefix in EXCLUDED_PREFIXES)
          '''
          new_function = '''def is_excluded(path: str) -> bool:
              normalized = normalize_path(path)
              if normalized in EXCLUDED_PATHS:
                  return True
              return any(normalized == prefix.rstrip("/") or normalized.startswith(prefix) for prefix in EXCLUDED_PREFIXES)
          '''
          if old_function not in source:
              raise SystemExit('Expected is_excluded function was not found')
          source = source.replace(old_function, new_function, 1)
          audit_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/test_russianization_audit.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '''    def test_check_mode_is_read_only(self) -> None:
          '''
          addition = '''    def test_readme_is_excluded_from_audit_inputs(self) -> None:
              first = self._engine().build_outputs()
              self._write("README.md", "Полностью изменённая документация.\\n")
              second = self._engine().build_outputs()

              self.assertTrue(is_excluded("README.md"))
              self.assertEqual(first, second)

          '''
          if marker not in tests:
              raise SystemExit('Expected test insertion point was not found')
          tests = tests.replace(marker, addition + marker, 1)
          test_path.write_text(tests, encoding='utf-8')

      - name: Verify implementation and regenerate baseline
        run: |
          uv run ruff check dev_tools/russianization_audit.py tests/test_russianization_audit.py --select E9,F63,F7,F82 --ignore F821,F722
          uv run python -m unittest -v tests/test_russianization_audit.py
          uv run python -m dev_tools.russianization_audit --write
          uv run python -m dev_tools.russianization_audit --check

      - name: Restore permanent CI and commit the fix
        shell: bash
        run: |
          set -euo pipefail
          git show origin/personal/stable:.github/workflows/lint.yml > .github/workflows/lint.yml
          rm -f .github/workflows/pr10-remove-readme-from-audit.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add .github/workflows/lint.yml
          git add dev_tools/russianization_audit.py
          git add tests/test_russianization_audit.py
          git add dev_tools/russianization/results
          git add --all .github/workflows/pr10-remove-readme-from-audit.yml
          git diff --cached --check

          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi

          git commit -m 'fix(audit): исключить README из входных данных'
          git push origin HEAD:docs/full-russian-interface
