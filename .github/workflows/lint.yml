name: Lint

on: [push, pull_request]

permissions:
  contents: write

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: uv sync
      - name: Run ruff
        run: uv run ruff check . --select E9,F63,F7,F82 --ignore F821,F722
      - name: Run Stage 3 regression tests
        run: >-
          uv run python -m unittest -v
          tests/test_deploy_location.py
          tests/test_stage3d_deploy_set.py
          tests/test_stage3d_legacy_installer.py
          tests/test_stage3d_templates.py
          tests/test_stage3d_webui_settings.py
          tests/test_stage3e_release_cleanup.py
      - name: Run Stage 4 audit unit tests
        run: uv run python -m unittest -v tests/test_russianization_audit.py
      - name: Check Stage 4 audit baseline
        run: uv run python -m dev_tools.russianization_audit --check

  button-config-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: uv sync --no-dev
      - name: Run button_extract
        run: uv run -m dev_tools.button_extract
      - name: Run config_updater
        run: uv run -m module.config.config_updater
      - name: Check for differences
        run: |
          git diff --exit-code --ignore-space-at-eol

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $scriptRoot = Join-Path -Path $PWD -ChildPath 'scripts'
          $scriptFiles = @(
              Get-ChildItem -LiteralPath $scriptRoot -Recurse -File |
                  Where-Object {
                      $_.Extension -in @(
                          '.ps1'
                          '.psm1'
                      )
                  }
          )
          $parseFailures = [System.Collections.Generic.List[string]]::new()

          foreach ($scriptFile in $scriptFiles) {
              $tokens = $null
              $parseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $scriptFile.FullName,
                  [ref]$tokens,
                  [ref]$parseErrors
              )

              foreach ($parseError in $parseErrors) {
                  $parseFailures.Add(
                      '{0}:{1}: {2}' -f
                      $scriptFile.FullName,
                      $parseError.Extent.StartLineNumber,
                      $parseError.Message
                  )
              }
          }

          if ($parseFailures.Count -gt 0) {
              throw ($parseFailures -join [Environment]::NewLine)
          }
      - name: Analyze PowerShell scripts
        shell: pwsh
        run: |
          $analyzerParameters = @{
              Path = (Join-Path -Path $PWD -ChildPath 'scripts')
              Recurse = $true
              Severity = @(
                  'Error'
                  'Warning'
              )
              ExcludeRule = @(
                  'PSUseBOMForUnicodeEncodedFile'
              )
          }
          $findings = @(
              Invoke-ScriptAnalyzer @analyzerParameters
          )

          if ($findings.Count -gt 0) {
              $details = $findings |
                  Format-List |
                  Out-String
              throw $details
          }

  stage4-finalize:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      - name: Install final source and CI definition
        run: python .github/stage4_finalize.py
      - name: Run Stage 4 audit unit tests
        run: python -m unittest -v tests/test_russianization_audit.py
      - name: Generate final Stage 4 audit results
        run: python -m dev_tools.russianization_audit --write
      - name: Check Stage 4 audit determinism
        run: python -m dev_tools.russianization_audit --check
      - name: Check patch formatting
        run: git diff --check
      - name: Audit new files for secret patterns
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          roots = [
              Path('.github/workflows/lint.yml'),
              Path('dev_tools/russianization_audit.py'),
              Path('tests/test_russianization_audit.py'),
              Path('dev_tools/russianization/results'),
          ]
          patterns = [
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'\bgh[pousr]_[A-Za-z0-9]{20,}\b'),
              re.compile(r'\bgithub_pat_[A-Za-z0-9_]+\b'),
              re.compile(r'\bAKIA[0-9A-Z]{16}\b'),
              re.compile(r'https://(?:discord(?:app)?\.com)/api/webhooks/\d+/[A-Za-z0-9_-]+'),
          ]
          findings = []
          paths = []
          for root in roots:
              if root.is_dir():
                  paths.extend(sorted(path for path in root.rglob('*') if path.is_file()))
              elif root.is_file():
                  paths.append(root)
          for path in paths:
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for line_number, line in enumerate(text.splitlines(), start=1):
                  if any(pattern.search(line) for pattern in patterns):
                      findings.append(f'{path}:{line_number}')
          if findings:
              raise SystemExit('Potential secret patterns found at: ' + ', '.join(findings))
          print('Manual secret-pattern audit: no matches.')
          PY
      - name: Commit final Stage 4 audit
        shell: bash
        run: |
          git rm .github/stage4_finalize.py
          git add dev_tools/russianization_audit.py
          git add tests/test_russianization_audit.py
          git add dev_tools/russianization/results
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(audit): verify committed Stage 4 baselines'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
