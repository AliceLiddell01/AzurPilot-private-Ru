name: Stage 7 validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  functional-tests:
    name: Python functional and regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact head with filtered history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 10
        with:
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Synchronize locked dependencies
        run: uv sync --frozen

      - name: Run Ruff
        run: uv run ruff check . --select E9,F63,F7,F82 --ignore F821,F722

      - name: Run Stage 3 regression tests
        run: >-
          uv run python -m unittest -v
          tests/test_deploy_location.py
          tests/test_stage3d_deploy_set.py
          tests/test_stage3d_legacy_installer.py
          tests/test_stage3d_templates.py
          tests/test_stage3d_webui_settings.py
          tests/test_stage3e_release_cleanup.py

      - name: Run Stage 4 audit tests
        run: uv run python -m unittest -v tests/test_russianization_audit.py

      - name: Run Stage 5 regression tests
        run: >-
          uv run python -m unittest -v
          tests/test_stage5_deploy_language_migration.py
          tests/test_stage5_locale_runtime.py
          tests/test_stage5_server_separation.py
          tests/test_stage5_generator.py

      - name: Run Stage 5 verifier
        run: uv run python -m dev_tools.verify_stage5

      - name: Run Stage 6 regression tests
        run: >-
          uv run python -m unittest -v
          tests/test_stage6_ui_russianization.py
          tests/test_webui_worker_registry.py
          tests/test_webui_no_reload_recovery.py

      - name: Run Stage 6 verifier
        run: uv run python -m dev_tools.verify_stage6

      - name: Run Stage 7 semantic verifier
        env:
          STAGE7_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/personal/stable' }}
        run: >-
          uv run python -m dev_tools.verify_stage7
          --base-ref "$STAGE7_BASE_REF"
          --output-dir artifacts/stage7

      - name: Publish Stage 7 summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/stage7/report.md ]]; then
            cat artifacts/stage7/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Stage 7 report was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Stage 7 semantic diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage7-semantic-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/stage7
          if-no-files-found: error
          retention-days: 14

      - name: Run Stage 8A regression tests
        run: >-
          uv run python -m unittest -v
          tests/test_stage8a_device_log_audit.py
          tests/test_stage8a_semantic_contract.py
          tests/test_stage8a_device_acceptance.py

      - name: Run Stage 8A semantic verifier
        run: >-
          uv run python -m dev_tools.verify_stage8a
          --output-dir artifacts/stage8a

      - name: Publish Stage 8A summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/stage8a/report.md ]]; then
            cat artifacts/stage8a/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Stage 8A report was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Stage 8A semantic diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage8a-semantic-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/stage8a
          if-no-files-found: error
          retention-days: 14

      - name: Collect functional failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/functional
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "uv=$(uv --version 2>&1)"
            echo "python=$(uv run python --version 2>&1)"
            echo
            echo '--- git status --short ---'
            git status --short
            echo
            echo '--- uv packages ---'
            uv pip list
          } > artifacts/functional/diagnostics.txt 2>&1
          git diff --binary > artifacts/functional/working-tree.diff
          git diff --check > artifacts/functional/diff-check.txt 2>&1

      - name: Upload functional failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functional-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/functional
          if-no-files-found: error
          retention-days: 14

  browser-validation:
    name: Stage 7 Playwright DOM and security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 10
        with:
          fetch-depth: 1
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Synchronize locked dependencies
        run: uv sync --frozen

      - name: Install Playwright runner
        run: |
          uv pip install playwright==1.55.0
          uv run playwright install --with-deps chromium

      - name: Run browser traceback checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/stage7-browser
          timeout --signal=TERM --kill-after=15s 10m \
            uv run python tests/run_stage7_webui_traceback_browser.py \
              > artifacts/stage7-browser/report.json

      - name: Verify Chromium process cleanup
        shell: bash
        run: |
          set -euo pipefail
          if pgrep -af 'playwright.*chromium|chromium.*playwright' > artifacts/stage7-browser/processes.txt; then
            cat artifacts/stage7-browser/processes.txt
            exit 1
          fi
          echo 'No orphaned Playwright Chromium processes.' > artifacts/stage7-browser/processes.txt

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage7-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/stage7-browser
          if-no-files-found: error
          retention-days: 14

  generated-checks:
    name: Generated baselines and idempotence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 10
        with:
          fetch-depth: 1
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Synchronize locked dependencies
        run: uv sync --frozen

      - name: Prepare generated diagnostics directory
        run: mkdir -p artifacts/generated

      - name: Check Russianization audit baseline
        continue-on-error: true
        run: uv run python -m dev_tools.russianization_audit --check

      - name: Check Stage 6 audit baseline
        continue-on-error: true
        run: uv run python -m dev_tools.stage6_active_ui_audit --check

      - name: Verify deterministic and idempotent generators
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m dev_tools.button_extract
          uv run python -m module.config.config_updater
          git diff --binary > artifacts/generated/first.diff
          git status --short > artifacts/generated/first-status.txt

          uv run python -m dev_tools.button_extract
          uv run python -m module.config.config_updater
          git diff --binary > artifacts/generated/second.diff
          git status --short > artifacts/generated/second-status.txt

          cmp artifacts/generated/first.diff artifacts/generated/second.diff
          cmp artifacts/generated/first-status.txt artifacts/generated/second-status.txt
          git diff --exit-code --ignore-space-at-eol

      - name: Check diff formatting
        run: git diff --check

      - name: Collect generated failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          {
            echo "commit=$(git rev-parse HEAD)"
            echo
            echo '--- git status --short ---'
            git status --short
          } > artifacts/generated/diagnostics.txt 2>&1
          git diff --binary > artifacts/generated/failure-working-tree.diff
          git diff --check > artifacts/generated/diff-check.txt 2>&1

      - name: Upload generated diff artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-diff-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/generated
          if-no-files-found: error
          retention-days: 14

  repository-audit:
    name: Repository and secret audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact head with filtered history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 10
        with:
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Synchronize locked dependencies
        run: uv sync --frozen

      - name: Check forbidden deletions, archives and secret patterns
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            diff_range="${PR_BASE_SHA}..HEAD"
          elif [[ -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != '0000000000000000000000000000000000000000' ]]; then
            diff_range="${PUSH_BEFORE_SHA}..HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            diff_range='HEAD^..HEAD'
          else
            echo 'No parent commit is available for the diff audit.'
            exit 0
          fi

          forbidden_deletions="$(git diff --name-status --diff-filter=D "$diff_range" | awk '$2 ~ /^assets\// || $2 ~ /^module\/config\/i18n\/(en-US|ja-JP|zh-CN|zh-MIAO|zh-TW)\.json$/ { print }')"
          if [[ -n "$forbidden_deletions" ]]; then
            echo 'Stage 7 attempted forbidden locale or asset deletions.'
            echo "$forbidden_deletions"
            exit 1
          fi

          DIFF_RANGE="$diff_range" uv run python - <<'PY'
          import os
          import re
          import subprocess

          raw_diff = subprocess.run(
              ['git', 'diff', '--unified=0', '--no-color', os.environ['DIFF_RANGE']],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          diff = '\n'.join(
              line[1:]
              for line in raw_diff.splitlines()
              if line.startswith('+') and not line.startswith('+++')
          )
          patterns = {
              'private key': r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
              'GitHub token': r'\b(?:ghp|github_pat)_[A-Za-z0-9_]{20,}\b',
              'AWS access key': r'\bAKIA[0-9A-Z]{16}\b',
              'webhook URL': r'https://(?:discord(?:app)?\.com/api/webhooks|hooks\.slack\.com/services)/[^\s]+',
          }
          matched = [name for name, pattern in patterns.items() if re.search(pattern, diff)]
          if matched:
              raise SystemExit('Potential secret patterns detected: ' + ', '.join(matched))
          print('Secret pattern audit: no matches.')
          PY

          unexpected_archives="$(git diff --name-only --diff-filter=AM "$diff_range" | awk 'tolower($0) ~ /\.(7z|rar|zip|tar|tgz|gz|bz2|xz|dump|bak|backup)$/ { print }')"
          if [[ -n "$unexpected_archives" ]]; then
            echo 'Unexpected archive, dump or backup files were added:'
            echo "$unexpected_archives"
            exit 1
          fi

      - name: Run specialized Gitleaks scan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="gitleaks_${version}_linux_x64.tar.gz"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          archive_sha256='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          curl --fail --location --silent --show-error --output "$archive" "${release_url}/${archive}"
          printf '%s  %s\n' "$archive_sha256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks

          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            diff_range="${PR_BASE_SHA}..HEAD"
          elif [[ -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != '0000000000000000000000000000000000000000' ]]; then
            diff_range="${PUSH_BEFORE_SHA}..HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            diff_range='HEAD^..HEAD'
          else
            diff_range='HEAD'
          fi

          ./gitleaks git --redact --no-banner --verbose --log-opts="$diff_range" .

      - name: Collect repository audit failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/repository-audit
          {
            echo "commit=$(git rev-parse HEAD)"
            echo
            echo '--- git status --short ---'
            git status --short
          } > artifacts/repository-audit/diagnostics.txt 2>&1
          git diff --binary > artifacts/repository-audit/working-tree.diff

      - name: Upload repository audit failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-audit-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/repository-audit
          if-no-files-found: error
          retention-days: 14

  powershell-validation:
    name: PowerShell parser and PSScriptAnalyzer
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 10
        with:
          fetch-depth: 1
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Synchronize locked dependencies
        run: uv sync --frozen

      - name: Parse all PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error ("Parse errors in {0}:`n{1}" -f $_.FullName, ($errors | Out-String))
            }
          }

          if ($failed) {
            throw "PowerShell parse validation failed."
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $analyzerParameters = @{
            Path = (Join-Path -Path $PWD -ChildPath 'scripts')
            Recurse = $true
            Severity = @(
              'Error'
              'Warning'
            )
            ExcludeRule = @(
              'PSUseBOMForUnicodeEncodedFile'
            )
          }
          $results = @(Invoke-ScriptAnalyzer @analyzerParameters)
          $results | Format-Table -AutoSize
          if ($results.Count -gt 0) {
            throw "PSScriptAnalyzer reported findings."
          }

      - name: Run Windows WebUI smoke and verify process shutdown
        run: uv run python -m dev_tools.stage6_webui_smoke

      - name: Run no-reload orphan recovery regression
        run: uv run python -m unittest -v tests/test_webui_no_reload_recovery.py

      - name: Run Stage 8A target-selection contract on Windows
        run: uv run python -m unittest -v tests/test_stage8a_device_acceptance.py

      - name: Collect PowerShell failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $artifactDirectory = Join-Path -Path $PWD -ChildPath 'artifacts/powershell'
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null
          @(
            "commit=$(git rev-parse HEAD)"
            "pwsh=$($PSVersionTable.PSVersion)"
            "uv=$(uv --version)"
            "python=$(uv run python --version)"
            ''
            '--- git status --short ---'
            (git status --short | Out-String)
          ) | Set-Content -Path (Join-Path $artifactDirectory 'diagnostics.txt') -Encoding utf8
          git diff --binary | Set-Content -Path (Join-Path $artifactDirectory 'working-tree.diff') -Encoding utf8

      - name: Upload PowerShell failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: powershell-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/powershell
          if-no-files-found: error
          retention-days: 14
