name: Stage 5 final audit baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage5-final-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-final-baseline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 3

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync

      - name: Restore intended permanent workflow in the audit worktree
        env:
          FINAL_WORKFLOW_COMMIT: d38499e59dbaaeb06d9b6f9c6ed5ce50e17c57c4
        run: git show "${FINAL_WORKFLOW_COMMIT}:.github/workflows/lint.yml" > .github/workflows/lint.yml

      - name: Generate and verify final audit baseline
        run: |
          uv run python -m dev_tools.russianization_audit --write
          uv run python -m dev_tools.russianization_audit --check
          git diff --check

      - name: Publish final audit baseline
        shell: bash
        env:
          TARGET_BRANCH: chatgpt/stage5-single-russian-locale
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows/lint.yml
          git add \
            dev_tools/russianization/results/summary.json \
            dev_tools/russianization/results/ui_strings.json \
            dev_tools/russianization/results/first_party_logs.json \
            dev_tools/russianization/results/asset_manifest.json \
            dev_tools/russianization/results/locale_dependency_map.json \
            dev_tools/russianization/results/asset_decisions.json \
            dev_tools/russianization/results/en_global_required.json \
            dev_tools/russianization/results/stage4_report.md \
            dev_tools/russianization/results/deploy_language_migration.md

          if git diff --cached --quiet; then
            echo 'Final audit baseline is already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(stage5): finalize Russianization audit baseline'
          git fetch origin "$TARGET_BRANCH"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
