name: Stage 5 publish

on: [push, pull_request]

permissions:
  contents: write

jobs:
  stage5-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Detect Stage 5 transport
        id: transport
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == 'pull_request' && -f .github/stage5_apply.py ]]; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: uv sync
      - name: Apply Stage 5 implementation
        if: steps.transport.outputs.active == 'true'
        run: |
          python .github/stage5_apply.py
          rm -rf .github/stage5_apply.py .github/stage5_payload
      - name: Run generators
        if: steps.transport.outputs.active == 'true'
        run: |
          uv run -m dev_tools.button_extract
          uv run -m module.config.config_updater
          git diff --binary > /tmp/stage5-generator-first.diff
          uv run -m dev_tools.button_extract
          uv run -m module.config.config_updater
          git diff --binary > /tmp/stage5-generator-second.diff
          cmp /tmp/stage5-generator-first.diff /tmp/stage5-generator-second.diff
      - name: Regenerate audit baselines
        if: steps.transport.outputs.active == 'true'
        run: |
          uv run python -m dev_tools.russianization_audit --write
          uv run python -m dev_tools.russianization_audit --check
      - name: Capture generated patch
        if: steps.transport.outputs.active == 'true'
        run: |
          git diff --binary > /tmp/stage5-generated.patch
          git status --short > /tmp/stage5-status.txt
      - name: Upload generated patch
        if: steps.transport.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stage5-generated-${{ github.run_id }}
          path: |
            /tmp/stage5-generated.patch
            /tmp/stage5-status.txt
          if-no-files-found: error
      - name: Run ruff
        if: steps.transport.outputs.active == 'true'
        run: uv run ruff check . --select E9,F63,F7,F82 --ignore F821,F722
      - name: Run Stage 3 regression tests
        if: steps.transport.outputs.active == 'true'
        run: >-
          uv run python -m unittest -v
          tests/test_deploy_location.py
          tests/test_stage3d_deploy_set.py
          tests/test_stage3d_legacy_installer.py
          tests/test_stage3d_templates.py
          tests/test_stage3d_webui_settings.py
          tests/test_stage3e_release_cleanup.py
      - name: Run Stage 4 audit tests
        if: steps.transport.outputs.active == 'true'
        run: uv run python -m unittest -v tests/test_russianization_audit.py
      - name: Run Stage 5 migration tests
        if: steps.transport.outputs.active == 'true'
        run: uv run python -m unittest -v tests/test_stage5_deploy_language_migration.py
      - name: Run Stage 5 locale runtime tests
        if: steps.transport.outputs.active == 'true'
        run: uv run python -m unittest -v tests/test_stage5_locale_runtime.py
      - name: Run Stage 5 server separation tests
        if: steps.transport.outputs.active == 'true'
        run: uv run python -m unittest -v tests/test_stage5_server_separation.py
      - name: Run Stage 5 generator tests
        if: steps.transport.outputs.active == 'true'
        run: uv run python -m unittest -v tests/test_stage5_generator.py
      - name: Run Stage 5 verifier
        if: steps.transport.outputs.active == 'true'
        run: uv run python -m dev_tools.verify_stage5
      - name: Check diff formatting
        if: steps.transport.outputs.active == 'true'
        run: git diff --check
      - name: Check forbidden deletions and secrets
        if: steps.transport.outputs.active == 'true'
        shell: bash
        run: |
          forbidden_deletions="$({ git diff --name-status --diff-filter=D || true; } | awk '$2 ~ /^assets\// || $2 ~ /^module\/config\/i18n\/(en-US|ja-JP|zh-CN|zh-MIAO|zh-TW)\.json$/ { print }')"
          if [[ -n "$forbidden_deletions" ]]; then
            echo 'Stage 5 attempted forbidden locale or asset deletions.'
            echo "$forbidden_deletions"
            exit 1
          fi
          python - <<'PY'
          import re
          import subprocess
          diff = subprocess.run(['git', 'diff', '--unified=0', '--no-color'], check=True, capture_output=True, text=True).stdout
          patterns = {
              'private key': r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
              'GitHub token': r'\b(?:ghp|github_pat)_[A-Za-z0-9_]{20,}\b',
              'AWS access key': r'\bAKIA[0-9A-Z]{16}\b',
              'webhook URL': r'https://(?:discord(?:app)?\.com/api/webhooks|hooks\.slack\.com/services)/[^\s]+',
          }
          matched = [name for name, pattern in patterns.items() if re.search(pattern, diff)]
          if matched:
              raise SystemExit('Potential secret patterns detected: ' + ', '.join(matched))
          print('Secret pattern audit: no matches.')
          PY
      - name: Publish Stage 5 implementation
        if: steps.transport.outputs.active == 'true'
        shell: bash
        run: |
          git add -A
          git config user.name 'AliceLiddell01'
          git config user.email 'leaf.fairy@proton.me'
          git commit -m 'feat(stage5): enforce single Russian locale'
          git push origin HEAD:chatgpt/stage5-single-russian-locale
      - name: No-op after publication
        if: steps.transport.outputs.active != 'true'
        run: echo 'Stage 5 transport is not active.'
