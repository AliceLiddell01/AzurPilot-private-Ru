name: Stage 5 audit baseline commit

on:
  pull_request:

permissions:
  actions: read
  contents: write

concurrency:
  group: stage5-audit-baseline-commit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare-commit:
    name: Create validated detached commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Download validated audit baseline
        uses: actions/download-artifact@v4
        with:
          name: stage5-audit-baseline-94e95b7f93fe73e1507df37bbd3baab34117564a
          path: /tmp/stage5-audit-baseline
          github-token: ${{ github.token }}
          run-id: 30689616664

      - name: Verify artifact files
        run: |
          set -euo pipefail
          cd /tmp/stage5-audit-baseline
          printf '%s  %s\n' \
            'cab158ee74bac5ffd3f3deeb019495fe566e96784a5da2e915c6a5ef2e5f0240' 'summary.json' \
            'a885f3239bec6e6233e1a2fac4c2e40ba7aa723d9ea45f09abbe6697b8e39058' 'first_party_logs.json' \
            '276beb4d92111e6a582cc9517bdc471886ad8286b4087dc7a43fec65fd47088f' 'asset_manifest.json' \
            'fd8847a1abc9656d2652ed64da667e69a3736e6987486c83f71a355a0825c0c8' 'locale_dependency_map.json' \
            '9a4f14ce28fc85fac975a8723fa1e66a6f88d1d132d81edd6a9afa17aa1578f6' 'stage4_report.md' |
            sha256sum --check --strict

          actual_files="$(find . -maxdepth 1 -type f -printf '%f\n' | sort)"
          expected_files="$(printf '%s\n' \
            asset_manifest.json \
            first_party_logs.json \
            locale_dependency_map.json \
            stage4_report.md \
            summary.json)"
          test "$actual_files" = "$expected_files"

      - name: Restore validated files and permanent workflow
        env:
          PERMANENT_WORKFLOW_COMMIT: 022d79b991fb5276861ddae6034cf7d84528092d
        run: |
          set -euo pipefail
          cp /tmp/stage5-audit-baseline/summary.json dev_tools/russianization/results/summary.json
          cp /tmp/stage5-audit-baseline/first_party_logs.json dev_tools/russianization/results/first_party_logs.json
          cp /tmp/stage5-audit-baseline/asset_manifest.json dev_tools/russianization/results/asset_manifest.json
          cp /tmp/stage5-audit-baseline/locale_dependency_map.json dev_tools/russianization/results/locale_dependency_map.json
          cp /tmp/stage5-audit-baseline/stage4_report.md dev_tools/russianization/results/stage4_report.md
          git show "${PERMANENT_WORKFLOW_COMMIT}:.github/workflows/lint.yml" > .github/workflows/lint.yml

          git add -- \
            .github/workflows/lint.yml \
            dev_tools/russianization/results/summary.json \
            dev_tools/russianization/results/first_party_logs.json \
            dev_tools/russianization/results/asset_manifest.json \
            dev_tools/russianization/results/locale_dependency_map.json \
            dev_tools/russianization/results/stage4_report.md
          git diff --cached --check

      - name: Audit staged diff for secret patterns
        run: |
          python - <<'PY'
          import re
          import subprocess

          diff = subprocess.run(
              ['git', 'diff', '--cached', '--unified=0', '--no-color'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          patterns = {
              'private key': r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
              'GitHub token': r'\b(?:ghp|github_pat)_[A-Za-z0-9_]{20,}\b',
              'AWS access key': r'\bAKIA[0-9A-Z]{16}\b',
              'webhook URL': r'https://(?:discord(?:app)?\.com/api/webhooks|hooks\.slack\.com/services)/[^\s]+',
          }
          matched = [name for name, pattern in patterns.items() if re.search(pattern, diff)]
          if matched:
              raise SystemExit('Potential secret patterns detected: ' + ', '.join(matched))
          print('Secret pattern audit: no matches.')
          PY

      - name: Create detached Git commit
        id: detached
        uses: actions/github-script@v7
        env:
          BASE_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const baseSha = process.env.BASE_SHA;
            const paths = [
              '.github/workflows/lint.yml',
              'dev_tools/russianization/results/summary.json',
              'dev_tools/russianization/results/first_party_logs.json',
              'dev_tools/russianization/results/asset_manifest.json',
              'dev_tools/russianization/results/locale_dependency_map.json',
              'dev_tools/russianization/results/stage4_report.md',
            ];

            const baseCommit = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: baseSha,
            });

            const tree = [];
            for (const path of paths) {
              const blob = await github.rest.git.createBlob({
                owner,
                repo,
                content: fs.readFileSync(path).toString('base64'),
                encoding: 'base64',
              });
              tree.push({
                path,
                mode: '100644',
                type: 'blob',
                sha: blob.data.sha,
              });
            }

            const newTree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: baseCommit.data.tree.sha,
              tree,
            });
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'chore(stage5): refresh Russianization audit baseline',
              tree: newTree.data.sha,
              parents: [baseSha],
            });

            core.info(`Detached commit: ${commit.data.sha}`);
            core.setOutput('sha', commit.data.sha);
            fs.writeFileSync('/tmp/stage5-detached-commit.txt', `${commit.data.sha}\n`);

      - name: Upload detached commit SHA
        uses: actions/upload-artifact@v4
        with:
          name: stage5-detached-commit-${{ github.event.pull_request.head.sha }}
          path: /tmp/stage5-detached-commit.txt
          if-no-files-found: error
          retention-days: 1
