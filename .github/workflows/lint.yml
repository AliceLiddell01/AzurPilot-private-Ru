name: Operation Siren Data Logger targeted validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opsi-data-logger-targeted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted-validation:
    name: Data Logger targeted tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/opsi-data-logger
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install project dependencies
        run: uv sync --frozen

      - name: Compile changed Python modules
        run: >-
          uv run python -m py_compile
          module/config/opsi_data_logger.py
          module/os/tasks/explore.py
          module/os/tasks/voucher.py
          module/shop/shop_voucher.py
          module/webui/lang.py
          tests/test_opsi_data_logger.py

      - name: Run targeted tests and restore workflow
        shell: bash
        run: |
          set +e
          uv pip install pytest
          install_exit=$?
          test_exit=$install_exit
          if [[ $install_exit -eq 0 ]]; then
            uv run python -m pytest -q tests/test_opsi_data_logger.py
            test_exit=$?
          fi

          git show 89fae04e3ac62acb73b71eec9c14f49ee27e9bc1:.github/workflows/lint.yml > .github/workflows/lint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/lint.yml
          git diff --cached --check
          git commit -m 'ci: завершить точечную проверку Data Logger'
          git push origin HEAD:fix/opsi-data-logger
          push_exit=$?

          if [[ $push_exit -ne 0 ]]; then
            exit $push_exit
          fi
          exit $test_exit
