name: Stage 8A payload application

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: write

concurrency:
  group: stage8a-payload-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    name: Verify and apply Stage 8A payload
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: codex/stage8a-device-adb-logs

      - name: Verify payload and create commits
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          branch="$(git branch --show-current)"
          if [[ "$branch" != 'codex/stage8a-device-adb-logs' ]]; then
            echo "Unexpected branch: $branch"
            exit 1
          fi

          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo 'Checkout head does not match the pull request head.'
            exit 1
          fi

          cat .stage8a/runtime-* > .stage8a/runtime.diff.gz
          cat .stage8a/infra-* > .stage8a/infra.tar.gz

          printf '%s  %s\n' \
            '10f302352b503b01780241a49b9d662bc526147d47147cc12253c73c57222ad4' \
            '.stage8a/runtime.diff.gz' \
            | sha256sum --check --strict
          printf '%s  %s\n' \
            '15259b172e4bf5b6d6e0286e017dd7c277439cd9664a67a675768511f80a9f07' \
            '.stage8a/infra.tar.gz' \
            | sha256sum --check --strict

          gzip -dc .stage8a/runtime.diff.gz \
            | sed \
                -e 's#--- /mnt/data/stage8a_work/source/#--- a/#' \
                -e 's#+++ /mnt/data/stage8a_work/patched/#+++ b/#' \
            > /tmp/stage8a-runtime.diff

          git apply --check --whitespace=error-all /tmp/stage8a-runtime.diff
          git apply --index --whitespace=error-all /tmp/stage8a-runtime.diff

          unexpected_runtime="$(
            git diff --cached --name-only \
              | grep -Ev '^(module/device/|module/webui/api\.py$)' \
              || true
          )"
          if [[ -n "$unexpected_runtime" ]]; then
            echo 'Runtime payload contains files outside Stage 8A scope:'
            echo "$unexpected_runtime"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(stage8a): русифицировать device, ADB и backend logs'

          unsafe_archive="$(
            tar -tzf .stage8a/infra.tar.gz \
              | grep -E '(^/|(^|/)\.\.(/|$))' \
              || true
          )"
          if [[ -n "$unsafe_archive" ]]; then
            echo 'Infrastructure archive contains unsafe paths:'
            echo "$unsafe_archive"
            exit 1
          fi

          tar -xzf .stage8a/infra.tar.gz -C .
          rm -rf .stage8a
          rm -f .github/workflows/stage8a-source-bundle.yml

          if ! grep -qx 'name: Stage 7 validation' .github/workflows/lint.yml; then
            echo 'Final validation workflow was not restored.'
            exit 1
          fi
          if grep -q 'temporary Stage 8A source bundle' .github/workflows/lint.yml; then
            echo 'Bootstrap steps remain in the final validation workflow.'
            exit 1
          fi

          git add -A
          payload_residue="$(
            git diff --cached --name-status \
              | awk '$2 ~ /^\.stage8a\// && $1 != "D" { print }'
          )"
          if [[ -n "$payload_residue" ]]; then
            echo 'Payload files would remain in the final commit:'
            echo "$payload_residue"
            exit 1
          fi
          git commit -m 'test(stage8a): добавить semantic verifier и acceptance'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Synchronize locked dependencies
        run: uv sync --frozen

      - name: Validate exact generated commits
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m unittest -v \
            tests/test_stage8a_device_log_audit.py \
            tests/test_stage8a_semantic_contract.py \
            tests/test_stage8a_device_acceptance.py
          uv run python -m dev_tools.verify_stage8a \
            --output-dir artifacts/stage8a-payload
          git diff --check HEAD~2..HEAD
          test -z "$(git status --short)"

      - name: Push validated commits
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:codex/stage8a-device-adb-logs
