name: Stage 5 audit baseline refresh

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: stage5-audit-baseline-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh-baseline:
    name: Validate and export audit baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync

      - name: Restore permanent validation workflow
        env:
          PERMANENT_WORKFLOW_COMMIT: 022d79b991fb5276861ddae6034cf7d84528092d
        run: git show "${PERMANENT_WORKFLOW_COMMIT}:.github/workflows/lint.yml" > .github/workflows/lint.yml

      - name: Run Ruff
        run: uv run ruff check . --select E9,F63,F7,F82 --ignore F821,F722

      - name: Run Stage 3 regression tests
        run: >-
          uv run python -m unittest -v
          tests/test_deploy_location.py
          tests/test_stage3d_deploy_set.py
          tests/test_stage3d_legacy_installer.py
          tests/test_stage3d_templates.py
          tests/test_stage3d_webui_settings.py
          tests/test_stage3e_release_cleanup.py

      - name: Run Stage 4 audit tests
        run: uv run python -m unittest -v tests/test_russianization_audit.py

      - name: Run Stage 5 regression tests
        run: >-
          uv run python -m unittest -v
          tests/test_stage5_deploy_language_migration.py
          tests/test_stage5_locale_runtime.py
          tests/test_stage5_server_separation.py
          tests/test_stage5_generator.py

      - name: Generate and verify audit baseline
        run: |
          uv run python -m dev_tools.russianization_audit --write
          uv run python -m dev_tools.russianization_audit --check

      - name: Verify deterministic generators
        run: |
          uv run -m dev_tools.button_extract
          uv run -m module.config.config_updater
          git diff --binary > /tmp/generator-first.diff
          uv run -m dev_tools.button_extract
          uv run -m module.config.config_updater
          git diff --binary > /tmp/generator-second.diff
          cmp /tmp/generator-first.diff /tmp/generator-second.diff

      - name: Run Stage 5 verifier
        run: uv run python -m dev_tools.verify_stage5

      - name: Stage exact generated outputs and permanent workflow
        run: |
          git add -- \
            .github/workflows/lint.yml \
            dev_tools/russianization/results/summary.json \
            dev_tools/russianization/results/first_party_logs.json \
            dev_tools/russianization/results/asset_manifest.json \
            dev_tools/russianization/results/locale_dependency_map.json \
            dev_tools/russianization/results/stage4_report.md
          git diff --cached --check
          git diff --exit-code -- \
            dev_tools/russianization/results/ui_strings.json \
            dev_tools/russianization/results/terminology.json \
            dev_tools/russianization/results/technical_allowlist.json \
            dev_tools/russianization/results/asset_decisions.json \
            dev_tools/russianization/results/en_global_required.json \
            dev_tools/russianization/results/deploy_language_migration.md \
            dev_tools/russianization/results/stage5_9_test_matrix.md

      - name: Audit staged diff for secret patterns
        run: |
          python - <<'PY'
          import re
          import subprocess

          diff = subprocess.run(
              ['git', 'diff', '--cached', '--unified=0', '--no-color'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          patterns = {
              'private key': r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
              'GitHub token': r'\b(?:ghp|github_pat)_[A-Za-z0-9_]{20,}\b',
              'AWS access key': r'\bAKIA[0-9A-Z]{16}\b',
              'webhook URL': r'https://(?:discord(?:app)?\.com/api/webhooks|hooks\.slack\.com/services)/[^\s]+',
          }
          matched = [name for name, pattern in patterns.items() if re.search(pattern, diff)]
          if matched:
              raise SystemExit('Potential secret patterns detected: ' + ', '.join(matched))
          print('Secret pattern audit: no matches.')
          PY

      - name: Upload generated audit baseline
        uses: actions/upload-artifact@v4
        with:
          name: stage5-audit-baseline-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            dev_tools/russianization/results/summary.json
            dev_tools/russianization/results/first_party_logs.json
            dev_tools/russianization/results/asset_manifest.json
            dev_tools/russianization/results/locale_dependency_map.json
            dev_tools/russianization/results/stage4_report.md
