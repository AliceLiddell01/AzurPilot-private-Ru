name: Stage 6 validation

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage6-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-commit-audit-baseline:
    name: Generate and commit Russianization audit baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/opsi-data-logger
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Restore final workflow and generate baseline
        run: |
          git show 89fae04e3ac62acb73b71eec9c14f49ee27e9bc1:.github/workflows/lint.yml > .github/workflows/lint.yml
          uv run python -m dev_tools.russianization_audit --write

      - name: Commit generated baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/lint.yml dev_tools/russianization/results
          git diff --cached --check
          git commit -m 'chore(audit): обновить baseline русификации'
          git push origin HEAD:fix/opsi-data-logger
