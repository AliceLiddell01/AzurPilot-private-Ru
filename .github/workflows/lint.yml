name: Lint

on: [push, pull_request]

permissions:
  contents: write

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: uv sync
      - name: Run ruff
        run: uv run ruff check . --select E9,F63,F7,F82 --ignore F821,F722
      - name: Run Stage 3 regression tests
        run: >-
          uv run python -m unittest -v
          tests/test_deploy_location.py
          tests/test_stage3d_deploy_set.py
          tests/test_stage3d_legacy_installer.py
          tests/test_stage3d_templates.py
          tests/test_stage3d_webui_settings.py
          tests/test_stage3e_release_cleanup.py
      - name: Run Stage 4 audit unit tests
        run: uv run python -m unittest -v tests/test_russianization_audit.py
      - name: Check Stage 4 audit baseline
        run: uv run python -m dev_tools.russianization_audit --check

  button-config-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: uv sync --no-dev
      - name: Run button_extract
        run: uv run -m dev_tools.button_extract
      - name: Run config_updater
        run: uv run -m module.config.config_updater
      - name: Check for differences
        run: |
          git diff --exit-code --ignore-space-at-eol

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $scriptRoot = Join-Path -Path $PWD -ChildPath 'scripts'
          $scriptFiles = @(
              Get-ChildItem -LiteralPath $scriptRoot -Recurse -File |
                  Where-Object {
                      $_.Extension -in @(
                          '.ps1'
                          '.psm1'
                      )
                  }
          )
          $parseFailures = [System.Collections.Generic.List[string]]::new()

          foreach ($scriptFile in $scriptFiles) {
              $tokens = $null
              $parseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $scriptFile.FullName,
                  [ref]$tokens,
                  [ref]$parseErrors
              )

              foreach ($parseError in $parseErrors) {
                  $parseFailures.Add(
                      '{0}:{1}: {2}' -f
                      $scriptFile.FullName,
                      $parseError.Extent.StartLineNumber,
                      $parseError.Message
                  )
              }
          }

          if ($parseFailures.Count -gt 0) {
              throw ($parseFailures -join [Environment]::NewLine)
          }
      - name: Analyze PowerShell scripts
        shell: pwsh
        run: |
          $analyzerParameters = @{
              Path = (Join-Path -Path $PWD -ChildPath 'scripts')
              Recurse = $true
              Severity = @(
                  'Error'
                  'Warning'
              )
              ExcludeRule = @(
                  'PSUseBOMForUnicodeEncodedFile'
              )
          }
          $findings = @(
              Invoke-ScriptAnalyzer @analyzerParameters
          )

          if ($findings.Count -gt 0) {
              $details = $findings |
                  Format-List |
                  Out-String
              throw $details
          }

  stage4-sync-base:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      - name: Merge current personal/stable
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin personal/stable
          git merge --no-edit origin/personal/stable
      - name: Run Stage 4 audit unit tests
        run: python -m unittest -v tests/test_russianization_audit.py
      - name: Regenerate audit baseline after base update
        run: python -m dev_tools.russianization_audit --write
      - name: Verify regenerated baseline
        run: python -m dev_tools.russianization_audit --check
      - name: Check patch formatting
        run: git diff --check
      - name: Commit and publish base synchronization
        shell: bash
        run: |
          git add dev_tools/russianization/results
          if ! git diff --cached --quiet; then
            git commit -m 'chore(audit): refresh baseline after stable update'
          fi
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
