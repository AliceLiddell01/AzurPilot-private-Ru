name: Lint

on: [push, pull_request]

permissions:
  contents: write

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: uv sync
      - name: Run ruff
        run: uv run ruff check . --select E9,F63,F7,F82 --ignore F821,F722
      - name: Run Stage 3 regression tests
        run: >-
          uv run python -m unittest -v
          tests/test_deploy_location.py
          tests/test_stage3d_deploy_set.py
          tests/test_stage3d_legacy_installer.py
          tests/test_stage3d_templates.py
          tests/test_stage3d_webui_settings.py
          tests/test_stage3e_release_cleanup.py
      - name: Run Stage 4 audit unit tests
        run: uv run python -m unittest -v tests/test_russianization_audit.py
      - name: Check Stage 4 audit baseline
        run: uv run python -m dev_tools.russianization_audit --check

  button-config-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: uv sync --no-dev
      - name: Run button_extract
        run: uv run -m dev_tools.button_extract
      - name: Run config_updater
        run: uv run -m module.config.config_updater
      - name: Check for differences
        run: |
          git diff --exit-code --ignore-space-at-eol

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $scriptRoot = Join-Path -Path $PWD -ChildPath 'scripts'
          $scriptFiles = @(
              Get-ChildItem -LiteralPath $scriptRoot -Recurse -File |
                  Where-Object {
                      $_.Extension -in @(
                          '.ps1'
                          '.psm1'
                      )
                  }
          )
          $parseFailures = [System.Collections.Generic.List[string]]::new()

          foreach ($scriptFile in $scriptFiles) {
              $tokens = $null
              $parseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $scriptFile.FullName,
                  [ref]$tokens,
                  [ref]$parseErrors
              )

              foreach ($parseError in $parseErrors) {
                  $parseFailures.Add(
                      '{0}:{1}: {2}' -f
                      $scriptFile.FullName,
                      $parseError.Extent.StartLineNumber,
                      $parseError.Message
                  )
              }
          }

          if ($parseFailures.Count -gt 0) {
              throw ($parseFailures -join [Environment]::NewLine)
          }
      - name: Analyze PowerShell scripts
        shell: pwsh
        run: |
          $analyzerParameters = @{
              Path = (Join-Path -Path $PWD -ChildPath 'scripts')
              Recurse = $true
              Severity = @(
                  'Error'
                  'Warning'
              )
              ExcludeRule = @(
                  'PSUseBOMForUnicodeEncodedFile'
              )
          }
          $findings = @(
              Invoke-ScriptAnalyzer @analyzerParameters
          )

          if ($findings.Count -gt 0) {
              $details = $findings |
                  Format-List |
                  Out-String
              throw $details
          }

  stage5-apply:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chatgpt/stage5-single-russian-locale'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage5-single-russian-locale
          fetch-depth: 1
      - name: Detect Stage 5 transport
        id: transport
        shell: bash
        run: |
          if [[ -f .github/stage5_apply.py ]]; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo 'Stage 5 transport is already removed; nothing to publish.'
          fi
      - name: Set up Python
        if: steps.transport.outputs.active == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      - name: Install uv
        if: steps.transport.outputs.active == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        if: steps.transport.outputs.active == 'true'
        run: uv sync
      - name: Apply Stage 5 implementation
        if: steps.transport.outputs.active == 'true'
        run: |
          python .github/stage5_apply.py
          rm -rf .github/stage5_apply.py .github/stage5_payload
      - name: Generate active configuration artifacts
        if: steps.transport.outputs.active == 'true'
        run: |
          uv run -m dev_tools.button_extract
          uv run -m module.config.config_updater
          git diff --binary > /tmp/stage5-generator-first.diff
          uv run -m dev_tools.button_extract
          uv run -m module.config.config_updater
          git diff --binary > /tmp/stage5-generator-second.diff
          cmp /tmp/stage5-generator-first.diff /tmp/stage5-generator-second.diff
      - name: Regenerate and verify audit baselines
        if: steps.transport.outputs.active == 'true'
        run: |
          uv run python -m dev_tools.russianization_audit --write
          uv run python -m dev_tools.russianization_audit --check
      - name: Run Ruff
        if: steps.transport.outputs.active == 'true'
        run: uv run ruff check . --select E9,F63,F7,F82 --ignore F821,F722
      - name: Run Stage 3 regression tests
        if: steps.transport.outputs.active == 'true'
        run: >-
          uv run python -m unittest -v
          tests/test_deploy_location.py
          tests/test_stage3d_deploy_set.py
          tests/test_stage3d_legacy_installer.py
          tests/test_stage3d_templates.py
          tests/test_stage3d_webui_settings.py
          tests/test_stage3e_release_cleanup.py
      - name: Run Stage 4 and Stage 5 tests
        if: steps.transport.outputs.active == 'true'
        run: >-
          uv run python -m unittest -v
          tests/test_russianization_audit.py
          tests/test_stage5_deploy_language_migration.py
          tests/test_stage5_locale_runtime.py
          tests/test_stage5_server_separation.py
          tests/test_stage5_generator.py
      - name: Run disposable migration verifier
        if: steps.transport.outputs.active == 'true'
        run: uv run python -m dev_tools.verify_stage5
      - name: Check formatting and forbidden deletions
        if: steps.transport.outputs.active == 'true'
        shell: bash
        run: |
          git diff --check
          forbidden_deletions="$({ git diff --name-status --diff-filter=D || true; } | awk '$2 ~ /^assets\// || $2 ~ /^module\/config\/i18n\/(en-US|ja-JP|zh-CN|zh-MIAO|zh-TW)\.json$/ { print }')"
          if [[ -n "$forbidden_deletions" ]]; then
            echo 'Stage 5 attempted forbidden locale or asset deletions.'
            echo "$forbidden_deletions"
            exit 1
          fi
      - name: Audit changed content for secret patterns
        if: steps.transport.outputs.active == 'true'
        run: |
          python - <<'PY'
          import re
          import subprocess

          diff = subprocess.run(
              ['git', 'diff', '--unified=0', '--no-color'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          patterns = {
              'private key': r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
              'GitHub token': r'\b(?:ghp|github_pat)_[A-Za-z0-9_]{20,}\b',
              'AWS access key': r'\bAKIA[0-9A-Z]{16}\b',
              'webhook URL': r'https://(?:discord(?:app)?\.com/api/webhooks|hooks\.slack\.com/services)/[^\s]+',
          }
          matched = [name for name, pattern in patterns.items() if re.search(pattern, diff)]
          if matched:
              raise SystemExit('Potential secret patterns detected: ' + ', '.join(matched))
          print('Secret pattern audit: no matches.')
          PY
      - name: Commit and publish Stage 5 implementation
        if: steps.transport.outputs.active == 'true'
        shell: bash
        run: |
          git status --short
          git add -A
          git config user.name 'AliceLiddell01'
          git config user.email 'leaf.fairy@proton.me'
          git commit -m 'refactor(i18n): isolate single ru-RU runtime locale'
          git push origin HEAD:chatgpt/stage5-single-russian-locale
