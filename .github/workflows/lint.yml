name: Stage 6 validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage6-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-audit-baseline:
    name: Generate Russianization audit artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Restore final workflow content for deterministic audit
        run: git show 89fae04e3ac62acb73b71eec9c14f49ee27e9bc1:.github/workflows/lint.yml > .github/workflows/lint.yml

      - name: Generate Russianization audit baseline
        run: uv run python -m dev_tools.russianization_audit --write

      - name: Upload generated baseline
        uses: actions/upload-artifact@v4
        with:
          name: russianization-audit-baseline
          path: dev_tools/russianization/results
          if-no-files-found: error
          retention-days: 1
