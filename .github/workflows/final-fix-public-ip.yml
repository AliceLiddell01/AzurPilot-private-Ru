name: One-time final public IP cleanup

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.head_ref == 'chatgpt/remove-upstream-announcements' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: chatgpt/remove-upstream-announcements
          fetch-depth: 1

      - name: Remove hidden public-IP lookup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script = Path('deploy/docker/deploy-image.sh')
          text = script.read_text(encoding='utf-8')
          old = '''get_public_ip() {\n    local ip\n    if ip="$(curl -fsSL --max-time 5 "https://ifconfig.me/ip" 2>/dev/null)"; then\n        printf '%s\\n' "${ip}"\n        return\n    fi\n    t ip_failed\n}\n'''
          new = '''get_public_ip() {\n    # Публичный IP нельзя определить локально без внешнего сервиса.\n    # Не делаем скрытый запрос: адрес передаётся владельцем явно при необходимости.\n    if [ -n "${AZURPILOT_PUBLIC_IP:-}" ]; then\n        printf '%s\\n' "${AZURPILOT_PUBLIC_IP}"\n        return\n    fi\n    t ip_failed\n}\n'''
          if text.count(old) != 1:
              raise SystemExit('deploy-image.sh: public-IP sentinel not found exactly once')
          script.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')

          test = Path('tests/test_no_upstream_project_network_defaults.py')
          test_text = test.read_text(encoding='utf-8')
          old_test = '    assert "https://ifconfig.me/ip" in docker_deploy\n'
          new_test = (
              '    assert "https://ifconfig.me/ip" not in docker_deploy\n'
              '    assert "AZURPILOT_PUBLIC_IP" in docker_deploy\n'
          )
          if test_text.count(old_test) != 1:
              raise SystemExit('network test: ifconfig assertion not found exactly once')
          test.write_text(test_text.replace(old_test, new_test, 1), encoding='utf-8', newline='')
          PY

          bash -n deploy/docker/deploy-image.sh
          ! grep -F 'https://ifconfig.me/ip' deploy/docker/deploy-image.sh
          grep -F 'AZURPILOT_PUBLIC_IP' deploy/docker/deploy-image.sh
          rm .github/workflows/final-fix-public-ip.yml
          git diff --check

      - name: Commit final fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No public-IP changes generated.' >&2; exit 1; }
          git commit -m "refactor(docker): убрать скрытый public IP lookup"
          git push origin HEAD:chatgpt/remove-upstream-announcements
