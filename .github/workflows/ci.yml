name: CI

on:
  pull_request:
    branches:
      - personal/stable
  push:
    branches:
      - personal/stable
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI_POSTGRES_ADMIN_USER: stage2_admin
      CI_POSTGRES_ADMIN_PASSWORD: stage2-admin-${{ github.run_id }}-${{ github.run_attempt }}
      AZURPILOT_POSTGRES_HOST: 127.0.0.1
      AZURPILOT_POSTGRES_PORT: "5432"
      AZURPILOT_POSTGRES_DATABASE: azurpilot_ci
      AZURPILOT_POSTGRES_USER: azurpilot_ci
      AZURPILOT_POSTGRES_PASSWORD: stage2-app-${{ github.run_id }}-${{ github.run_attempt }}
      AZURPILOT_POSTGRES_SSLMODE: disable
    services:
      postgres:
        image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
        env:
          POSTGRES_USER: stage2_admin
          POSTGRES_PASSWORD: stage2-admin-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stage2_admin -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Получить exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 10
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Проверить exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Установить uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          version: "0.11.32"

      - name: Установить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - name: Проверить структуру translation-only от PR base
        id: translation_gate
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/translate-') }}
        timeout-minutes: 10
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
          verifier="${RUNNER_TEMP}/translation_structural_gate.py"
          git show "${PR_BASE_SHA}:dev_tools/translation_structural_gate.py" > "$verifier"
          python tools/ci_heartbeat.py \
            --label "Структурная проверка translation-only" \
            --heartbeat-seconds 60 \
            --log-file "${RUNNER_TEMP}/azurpilot-ci-python/translation-gate.log" \
            -- python "$verifier" \
              --repository "$GITHUB_WORKSPACE" \
              --base "$PR_BASE_SHA" \
              --head "$PR_HEAD_SHA"

      - name: Проверить uv.lock
        id: python_lock
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci_heartbeat.py \
            --label "Проверка uv.lock" \
            --heartbeat-seconds 0 \
            --log-file "${RUNNER_TEMP}/azurpilot-ci-python/uv-lock.log" \
            -- uv lock --check

      - name: Синхронизировать CI-окружение
        id: python_sync
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci_heartbeat.py \
            --label "Синхронизация CI-окружения" \
            --heartbeat-seconds 60 \
            --log-file "${RUNNER_TEMP}/azurpilot-ci-python/uv-sync.log" \
            -- uv sync --locked --group ci

      - name: Проверить PostgreSQL 18 и Alembic cycle
        id: python_postgresql
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python - <<'PY'
          import os
          import psycopg
          from psycopg import sql

          with psycopg.connect(
              host=os.environ["AZURPILOT_POSTGRES_HOST"],
              port=os.environ["AZURPILOT_POSTGRES_PORT"],
              dbname="postgres",
              user=os.environ["CI_POSTGRES_ADMIN_USER"],
              password=os.environ["CI_POSTGRES_ADMIN_PASSWORD"],
              autocommit=True,
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      sql.SQL(
                          "CREATE ROLE {} LOGIN PASSWORD {} NOSUPERUSER "
                          "NOCREATEDB NOCREATEROLE NOREPLICATION"
                      ).format(
                          sql.Identifier(os.environ["AZURPILOT_POSTGRES_USER"]),
                          sql.Literal(os.environ["AZURPILOT_POSTGRES_PASSWORD"]),
                      )
                  )
                  cursor.execute(
                      sql.SQL("CREATE DATABASE {} OWNER {}").format(
                          sql.Identifier(os.environ["AZURPILOT_POSTGRES_DATABASE"]),
                          sql.Identifier(os.environ["AZURPILOT_POSTGRES_USER"]),
                      )
                  )
          PY
          python tools/ci_heartbeat.py \
            --label "Alembic base → head" \
            --heartbeat-seconds 0 \
            --log-file "${RUNNER_TEMP}/azurpilot-ci-python/alembic-upgrade.log" \
            -- uv run --locked alembic upgrade head
          uv run --locked alembic current --check-heads
          uv run --locked alembic check
          uv run --locked alembic downgrade base
          uv run --locked alembic upgrade head
          uv run --locked alembic current --check-heads
          uv run --locked alembic check

      - name: Проверить Ruff
        id: python_ruff
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci_heartbeat.py \
            --label "Проверка Ruff" \
            --heartbeat-seconds 0 \
            --log-file "${RUNNER_TEMP}/azurpilot-ci-python/ruff.log" \
            -- uv run --locked ruff check . --select E9,F63,F7,F82 --ignore F821,F722

      - name: Проверить компиляцию Python
        id: python_compile
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          compile_script="${RUNNER_TEMP}/ci_compile.py"
          cat > "$compile_script" <<'PY'
          import compileall
          from pathlib import Path

          roots = (
              Path("alas.py"),
              Path("gui.py"),
              Path("mcp_server_sse.py"),
              Path("module"),
              Path("dev_tools"),
              Path("tests"),
              Path("tools"),
          )
          failed = False
          for root in roots:
              if not root.exists():
                  continue
              if root.is_file():
                  failed = not compileall.compile_file(root, quiet=1) or failed
              else:
                  failed = not compileall.compile_dir(root, quiet=1) or failed
          if failed:
              raise SystemExit("Компиляция Python завершилась ошибкой.")
          PY

          python tools/ci_heartbeat.py \
            --label "Компиляция Python" \
            --heartbeat-seconds 60 \
            --log-file "${RUNNER_TEMP}/azurpilot-ci-python/compile.log" \
            -- uv run --locked python "$compile_script"

      - name: Запустить полный pytest
        id: python_pytest
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/azurpilot-ci-python"
          mkdir -p "$artifact_dir"
          python tools/ci_heartbeat.py \
            --label "Полный pytest" \
            --heartbeat-seconds 60 \
            --log-file "${artifact_dir}/pytest.log" \
            -- uv run --locked --group ci python -m pytest \
              -q \
              --junitxml="${artifact_dir}/pytest.xml" \
              tests

      - name: Проверить генератор assets
        id: python_assets
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci_heartbeat.py \
            --label "Генератор assets" \
            --heartbeat-seconds 60 \
            --log-file "${RUNNER_TEMP}/azurpilot-ci-python/button-extract.log" \
            -- uv run --locked -m dev_tools.button_extract

      - name: Проверить генератор конфигурации
        id: python_config
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci_heartbeat.py \
            --label "Генератор конфигурации" \
            --heartbeat-seconds 60 \
            --log-file "${RUNNER_TEMP}/azurpilot-ci-python/config-updater.log" \
            -- uv run --locked -m module.config.config_updater

      - name: Проверить чистоту рабочего дерева
        id: python_tree
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Записать итог Python
        if: always()
        shell: bash
        run: |
          {
            echo '### Python — ${{ job.status }}'
            echo
            echo 'Commit: `${{ github.event.pull_request.head.sha || github.sha }}`'
            echo
            echo 'При падении полный лог этапов и `pytest.xml` находятся в `python-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Собрать диагностику Python
        if: failure()
        shell: bash
        run: |
          set +e
          artifact_dir="${RUNNER_TEMP}/azurpilot-ci-python"
          mkdir -p "$artifact_dir"
          {
            echo "commit=$(git rev-parse HEAD 2>/dev/null)"
            echo "uv=$(uv --version 2>&1)"
            echo "python=$(python --version 2>&1)"
            echo
            echo '--- git status --short ---'
            git status --short
            echo
            echo '--- git diff --check ---'
            git diff --check
          } > "${artifact_dir}/diagnostics.txt" 2>&1
          git diff --binary > "${artifact_dir}/working-tree.diff" 2>&1

      - name: Загрузить диагностику Python
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/azurpilot-ci-python
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Получить exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 10
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Проверить exact head
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $gitCommand = Get-Command git -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $gitExecutable = $gitCommand.Path
          $expectedHead = '${{ github.event.pull_request.head.sha || github.sha }}'
          $gitArguments = @(
              'rev-parse'
              'HEAD'
          )
          $actualHead = & $gitExecutable @gitArguments
          $gitExitCode = $LASTEXITCODE

          if ($gitExitCode -ne 0) {
              throw ('git rev-parse завершился с кодом {0}.' -f $gitExitCode)
          }

          $actualHeadValue = [string]($actualHead | Select-Object -Last 1)

          if ($actualHeadValue -ne $expectedHead) {
              throw ('Получен неожиданный HEAD: {0}' -f $actualHeadValue)
          }

      - name: Установить uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          version: "0.11.32"

      - name: Установить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - name: Проверить uv.lock
        id: windows_lock
        timeout-minutes: 5
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $pythonCommand = Get-Command python -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $pythonExecutable = $pythonCommand.Path
          $uvCommand = Get-Command uv -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $uvExecutable = $uvCommand.Path
          $runnerPath = Join-Path -Path $PWD -ChildPath 'tools/ci_heartbeat.py'
          $logPath = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'azurpilot-ci-windows/uv-lock.log'
          $runnerArguments = @(
              $runnerPath
              '--label'
              'Проверка uv.lock'
              '--heartbeat-seconds'
              '0'
              '--log-file'
              $logPath
              '--'
              $uvExecutable
              'lock'
              '--check'
          )
          & $pythonExecutable @runnerArguments
          $runnerExitCode = $LASTEXITCODE

          if ($runnerExitCode -ne 0) {
              throw ('Проверка uv.lock завершилась с кодом {0}.' -f $runnerExitCode)
          }

      - name: Синхронизировать Windows-окружение
        id: windows_sync
        timeout-minutes: 15
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $pythonCommand = Get-Command python -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $pythonExecutable = $pythonCommand.Path
          $uvCommand = Get-Command uv -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $uvExecutable = $uvCommand.Path
          $runnerPath = Join-Path -Path $PWD -ChildPath 'tools/ci_heartbeat.py'
          $logPath = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'azurpilot-ci-windows/uv-sync.log'
          $runnerArguments = @(
              $runnerPath
              '--label'
              'Синхронизация Windows-окружения'
              '--heartbeat-seconds'
              '60'
              '--log-file'
              $logPath
              '--'
              $uvExecutable
              'sync'
              '--locked'
          )
          & $pythonExecutable @runnerArguments
          $runnerExitCode = $LASTEXITCODE

          if ($runnerExitCode -ne 0) {
              throw ('Синхронизация Windows-окружения завершилась с кодом {0}.' -f $runnerExitCode)
          }

      - name: Проверить PowerShell Parser
        id: windows_parser
        timeout-minutes: 10
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $gitCommand = Get-Command git -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $gitExecutable = $gitCommand.Path
          $gitArguments = @(
              'ls-files'
              '--'
              '*.ps1'
              '*.psm1'
          )
          $powerShellFiles = @(& $gitExecutable @gitArguments)
          $gitExitCode = $LASTEXITCODE

          if ($gitExitCode -ne 0) {
              throw ('git ls-files завершился с кодом {0}.' -f $gitExitCode)
          }

          $parseFindings = [System.Collections.Generic.List[string]]::new()

          foreach ($relativePath in $powerShellFiles) {
              $tokens = $null
              $parseErrors = $null
              $scriptPath = Join-Path -Path $PWD -ChildPath $relativePath

              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $scriptPath,
                  [ref]$tokens,
                  [ref]$parseErrors
              )

              foreach ($parseError in $parseErrors) {
                  $parseFindings.Add(
                      ('{0}:{1}: {2}' -f $relativePath, $parseError.Extent.StartLineNumber, $parseError.Message)
                  )
              }
          }

          $artifactDirectory = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'azurpilot-ci-windows'
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null
          $logPath = Join-Path -Path $artifactDirectory -ChildPath 'powershell-parser.log'

          if ($parseFindings.Count -gt 0) {
              $parseFindings | Set-Content -LiteralPath $logPath -Encoding utf8
              $message = $parseFindings | Out-String
              throw "PowerShell Parser обнаружил замечания:`n$message"
          }

          'PowerShell Parser: замечаний нет.' | Set-Content -LiteralPath $logPath -Encoding utf8

      - name: Установить PSScriptAnalyzer
        id: windows_pssa_install
        timeout-minutes: 10
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $pythonCommand = Get-Command python -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $pythonExecutable = $pythonCommand.Path
          $pwshCommand = Get-Command pwsh -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $pwshExecutable = $pwshCommand.Path
          $runnerPath = Join-Path -Path $PWD -ChildPath 'tools/ci_heartbeat.py'
          $installScript = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'install-psscriptanalyzer.ps1'
          $logPath = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'azurpilot-ci-windows/psscriptanalyzer-install.log'

          @'
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -RequiredVersion '1.25.0' -Scope CurrentUser -Force
          '@ | Set-Content -LiteralPath $installScript -Encoding utf8

          $runnerArguments = @(
              $runnerPath
              '--label'
              'Установка PSScriptAnalyzer'
              '--heartbeat-seconds'
              '60'
              '--log-file'
              $logPath
              '--'
              $pwshExecutable
              '-NoLogo'
              '-NoProfile'
              '-File'
              $installScript
          )
          & $pythonExecutable @runnerArguments
          $runnerExitCode = $LASTEXITCODE

          if ($runnerExitCode -ne 0) {
              throw ('Установка PSScriptAnalyzer завершилась с кодом {0}.' -f $runnerExitCode)
          }

      - name: Запустить PSScriptAnalyzer
        id: windows_pssa
        timeout-minutes: 15
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $gitCommand = Get-Command git -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $gitExecutable = $gitCommand.Path
          $gitArguments = @(
              'ls-files'
              '--'
              '*.ps1'
              '*.psm1'
          )
          $powerShellFiles = @(& $gitExecutable @gitArguments)
          $gitExitCode = $LASTEXITCODE

          if ($gitExitCode -ne 0) {
              throw ('git ls-files завершился с кодом {0}.' -f $gitExitCode)
          }

          $analysisFindings = [System.Collections.Generic.List[object]]::new()
          $totalFiles = $powerShellFiles.Count
          $processedFiles = 0
          $lastProgressAt = [DateTimeOffset]::UtcNow

          foreach ($relativePath in $powerShellFiles) {
              $scriptPath = Join-Path -Path $PWD -ChildPath $relativePath
              $findings = @(Invoke-ScriptAnalyzer -Path $scriptPath -Severity Error, Warning)

              foreach ($finding in $findings) {
                  $analysisFindings.Add($finding)
              }

              $processedFiles += 1
              $now = [DateTimeOffset]::UtcNow

              if (($now - $lastProgressAt).TotalSeconds -ge 60) {
                  Write-Host (
                      '[heartbeat] PSScriptAnalyzer: обработано {0}/{1} файлов.' -f
                      $processedFiles,
                      $totalFiles
                  )
                  $lastProgressAt = $now
              }
          }

          $artifactDirectory = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'azurpilot-ci-windows'
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null
          $logPath = Join-Path -Path $artifactDirectory -ChildPath 'psscriptanalyzer.log'

          if ($analysisFindings.Count -gt 0) {
              $message = $analysisFindings | Format-Table -AutoSize | Out-String
              $message | Set-Content -LiteralPath $logPath -Encoding utf8
              throw "PSScriptAnalyzer обнаружил замечания:`n$message"
          }

          'PSScriptAnalyzer: замечаний нет.' | Set-Content -LiteralPath $logPath -Encoding utf8

      - name: Запустить Windows-регрессии
        id: windows_tests
        timeout-minutes: 20
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $pythonCommand = Get-Command python -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $pythonExecutable = $pythonCommand.Path
          $uvCommand = Get-Command uv -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $uvExecutable = $uvCommand.Path
          $runnerPath = Join-Path -Path $PWD -ChildPath 'tools/ci_heartbeat.py'
          $logPath = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'azurpilot-ci-windows/windows-regressions.log'
          $runnerArguments = @(
              $runnerPath
              '--label'
              'Windows-регрессии'
              '--heartbeat-seconds'
              '60'
              '--log-file'
              $logPath
              '--'
              $uvExecutable
              'run'
              '--locked'
              'python'
              '-m'
              'unittest'
              '-v'
              'tests.test_webui_no_reload_recovery'
              'tests.test_device_acceptance'
              'tests.test_powershell_contracts'
              'tests.test_deploy_set'
              'tests.test_webui_deploy_settings'
              'tests.test_persistence_contracts'
          )
          & $pythonExecutable @runnerArguments
          $runnerExitCode = $LASTEXITCODE

          if ($runnerExitCode -ne 0) {
              throw ('Windows-регрессии завершились с кодом {0}.' -f $runnerExitCode)
          }

      - name: Проверить чистоту рабочего дерева
        id: windows_tree
        timeout-minutes: 5
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $gitCommand = Get-Command git -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $gitExecutable = $gitCommand.Path
          $gitArguments = @(
              'diff'
              '--check'
          )
          & $gitExecutable @gitArguments
          $gitExitCode = $LASTEXITCODE

          if ($gitExitCode -ne 0) {
              throw ('git diff --check завершился с кодом {0}.' -f $gitExitCode)
          }

          $gitArguments = @(
              'status'
              '--porcelain'
          )
          $status = @(& $gitExecutable @gitArguments)
          $gitExitCode = $LASTEXITCODE

          if ($gitExitCode -ne 0) {
              throw ('git status завершился с кодом {0}.' -f $gitExitCode)
          }

          if ($status.Count -gt 0) {
              $message = $status | Out-String
              throw "Windows job оставила рабочее дерево изменённым:`n$message"
          }

      - name: Записать итог Windows
        if: always()
        shell: pwsh
        run: |
          @(
              '### Windows — ${{ job.status }}'
              ''
              'Commit: `${{ github.event.pull_request.head.sha || github.sha }}`'
              ''
              'При падении логи Parser, PSScriptAnalyzer и Windows-регрессий находятся в `windows-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}`.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Собрать диагностику Windows
        if: failure()
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $gitCommand = Get-Command git -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $gitExecutable = $gitCommand.Path
          $artifactDirectory = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'azurpilot-ci-windows'
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null

          $metadataPath = Join-Path -Path $artifactDirectory -ChildPath 'metadata.txt'
          @(
              ('commit={0}' -f '${{ github.event.pull_request.head.sha || github.sha }}')
              ('pwsh={0}' -f $PSVersionTable.PSVersion)
              ('runner={0}' -f $env:RUNNER_OS)
          ) | Set-Content -LiteralPath $metadataPath -Encoding utf8

          $gitArguments = @(
              'status'
              '--short'
          )
          $statusOutput = @(& $gitExecutable @gitArguments 2>&1)
          $gitExitCode = $LASTEXITCODE

          if ($gitExitCode -ne 0) {
              $statusOutput += ('git status завершился с кодом {0}.' -f $gitExitCode)
          }

          $statusPath = Join-Path -Path $artifactDirectory -ChildPath 'status.txt'
          $statusOutput | Set-Content -LiteralPath $statusPath -Encoding utf8

          $gitArguments = @(
              'diff'
              '--binary'
          )
          $diffOutput = @(& $gitExecutable @gitArguments 2>&1)
          $gitExitCode = $LASTEXITCODE

          if ($gitExitCode -ne 0) {
              $diffOutput += ('git diff завершился с кодом {0}.' -f $gitExitCode)
          }

          $diffPath = Join-Path -Path $artifactDirectory -ChildPath 'working-tree.diff'
          $diffOutput | Set-Content -LiteralPath $diffPath -Encoding utf8

      - name: Загрузить диагностику Windows
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/azurpilot-ci-windows
          if-no-files-found: error
          retention-days: 14

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Получить exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 10
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Проверить exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Получить ограниченную историю PR без historical blobs
        id: security_history
        if: ${{ github.event_name == 'pull_request' }}
        timeout-minutes: 10
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git fetch --no-tags --filter=blob:none --deepen=100 origin "$PR_HEAD_REF"
          if ! git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --filter=blob:none --depth=1 origin "$PR_BASE_SHA"
          fi

      - name: Установить uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          version: "0.11.32"

      - name: Установить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - name: Проверить uv.lock
        id: security_lock
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci_heartbeat.py \
            --label "Проверка uv.lock" \
            --heartbeat-seconds 0 \
            --log-file "${RUNNER_TEMP}/azurpilot-ci-security/uv-lock.log" \
            -- uv lock --check

      - name: Синхронизировать Security-окружение
        id: security_sync
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci_heartbeat.py \
            --label "Синхронизация Security-окружения" \
            --heartbeat-seconds 60 \
            --log-file "${RUNNER_TEMP}/azurpilot-ci-security/uv-sync.log" \
            -- uv sync --locked --group ci

      - name: Установить Gitleaks
        id: security_gitleaks_install
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail

          version='8.30.1'
          archive="gitleaks_${version}_linux_x64.tar.gz"
          archive_sha256='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          tool_dir="${RUNNER_TEMP}/gitleaks"
          artifact_dir="${RUNNER_TEMP}/azurpilot-ci-security"

          mkdir -p "$tool_dir" "$artifact_dir"
          {
            echo '[ci] Загрузка Gitleaks.'
            curl --fail --location --silent --show-error --output "${tool_dir}/${archive}" "$release_url"
            printf '%s  %s\n' "$archive_sha256" "${tool_dir}/${archive}" | sha256sum --check --strict
            tar -xzf "${tool_dir}/${archive}" -C "$tool_dir" gitleaks
          } 2>&1 | tee "${artifact_dir}/gitleaks-install.log"

      - name: Проверить исходники и диапазон коммитов Gitleaks
        id: security_gitleaks
        timeout-minutes: 15
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          gitleaks="${RUNNER_TEMP}/gitleaks/gitleaks"
          artifact_dir="${RUNNER_TEMP}/azurpilot-ci-security"
          scan_paths=(
            .github
            .codex
            config
            deploy
            dev_tools
            docs
            module
            scripts
            tests
            tools
            AGENTS.md
            README.md
            alas.py
            gui.py
            mcp_server_sse.py
            pyproject.toml
            uv.lock
          )

          for scan_path in "${scan_paths[@]}"; do
            if [[ -e "$scan_path" ]]; then
              scan_name="${scan_path//\//_}"
              python tools/ci_heartbeat.py \
                --label "Gitleaks: ${scan_path}" \
                --heartbeat-seconds 60 \
                --log-file "${artifact_dir}/gitleaks-dir-${scan_name}.log" \
                -- "$gitleaks" dir --redact --no-banner --verbose "$scan_path"
            fi
          done

          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            range_start="$PR_BASE_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != '0000000000000000000000000000000000000000' ]]; then
            range_start="$PUSH_BEFORE_SHA"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            range_start='HEAD^'
          else
            range_start=''
          fi

          if [[ -n "$range_start" ]] && ! git cat-file -e "${range_start}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$range_start"
          fi

          if [[ -n "$range_start" ]]; then
            python tools/ci_heartbeat.py \
              --label "Gitleaks: история коммитов" \
              --heartbeat-seconds 60 \
              --log-file "${artifact_dir}/gitleaks-history.log" \
              -- "$gitleaks" git --redact --no-banner --verbose --log-opts="${range_start}..HEAD" .
          else
            python tools/ci_heartbeat.py \
              --label "Gitleaks: текущий HEAD" \
              --heartbeat-seconds 60 \
              --log-file "${artifact_dir}/gitleaks-history.log" \
              -- "$gitleaks" git --redact --no-banner --verbose --log-opts='HEAD' .
          fi

      - name: Проверить рискованные добавленные файлы
        id: security_risky_files
        timeout-minutes: 5
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            range_start="$PR_BASE_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != '0000000000000000000000000000000000000000' ]]; then
            range_start="$PUSH_BEFORE_SHA"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            range_start='HEAD^'
          else
            range_start=''
          fi

          if [[ -n "$range_start" ]] && ! git cat-file -e "${range_start}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$range_start"
          fi

          if [[ -n "$range_start" ]]; then
            diff_range="${range_start}..HEAD"
          else
            diff_range='HEAD'
          fi

          DIFF_RANGE="$diff_range" uv run --locked python - <<'PY'
          import os
          import subprocess
          from pathlib import PurePosixPath

          output = subprocess.run(
              ["git", "diff", "--name-status", "--diff-filter=AM", os.environ["DIFF_RANGE"]],
              check=True,
              capture_output=True,
              text=True,
          ).stdout

          risky_names = {
              ".env",
              "credentials.json",
              "cookies.json",
              "session.json",
              "id_rsa",
              "id_ed25519",
          }
          risky_suffixes = {
              ".key",
              ".p12",
              ".pfx",
              ".pem",
              ".jks",
              ".keystore",
              ".log",
              ".dump",
              ".bak",
          }

          findings = []
          for line in output.splitlines():
              _, path = line.split("\t", 1)
              pure = PurePosixPath(path)
              lower_name = pure.name.lower()
              if lower_name in risky_names or any(lower_name.endswith(suffix) for suffix in risky_suffixes):
                  findings.append(path)

          if findings:
              raise SystemExit("Обнаружены рискованные добавленные файлы:\n" + "\n".join(findings))
          PY

      - name: Запустить security/privacy регрессии
        id: security_tests
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci_heartbeat.py \
            --label "Security/privacy регрессии" \
            --heartbeat-seconds 60 \
            --log-file "${RUNNER_TEMP}/azurpilot-ci-security/security-regressions.log" \
            -- uv run --locked python -m unittest -v \
              tests.test_binary_log_audit \
              tests.test_binary_log_audit_arguments \
              tests.test_exception_context_audit \
              tests.test_event_datamine_security \
              tests.test_device_security \
              tests.test_ocr_debug_privacy \
              tests.test_ocr_rpc_security \
              tests.test_ocr_rpc_runtime \
              tests.test_ocr_acceptance \
              tests.test_opsi_zone_ocr_acceptance \
              tests.test_persistence_contracts

      - name: Установить закреплённый browser runner
        id: security_browser_install
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci_heartbeat.py \
            --label "Установка Chromium для Playwright" \
            --heartbeat-seconds 60 \
            --log-file "${RUNNER_TEMP}/azurpilot-ci-security/playwright-install.log" \
            -- uv run --locked --group ci playwright install --with-deps chromium

      - name: Запустить WebUI traceback security regression
        id: security_webui_unit
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci_heartbeat.py \
            --label "WebUI traceback security regression" \
            --heartbeat-seconds 60 \
            --log-file "${RUNNER_TEMP}/azurpilot-ci-security/webui-traceback.log" \
            -- uv run --locked python -m unittest -v tests.test_webui_traceback_security

      - name: Запустить браузерную DOM security regression
        id: security_browser
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="${RUNNER_TEMP}/azurpilot-ci-security"
          browser_dir="${RUNNER_TEMP}/webui-security"
          mkdir -p "$artifact_dir" "$browser_dir"

          heartbeat_pid=''
          stop_heartbeat() {
            if [[ -n "$heartbeat_pid" ]]; then
              kill "$heartbeat_pid" 2>/dev/null || true
              wait "$heartbeat_pid" 2>/dev/null || true
            fi
          }
          trap stop_heartbeat EXIT

          started_at=$(date +%s)
          (
            while sleep 60; do
              now=$(date +%s)
              elapsed=$((now - started_at))
              echo "[heartbeat] Браузерная DOM security regression: процесс работает ${elapsed} с."
            done
          ) &
          heartbeat_pid=$!

          set +e
          timeout --signal=TERM --kill-after=15s 10m \
            uv run --locked python tests/run_webui_traceback_browser.py \
              > "${browser_dir}/report.json" \
              2> "${artifact_dir}/browser.stderr.log"
          browser_exit_code=$?
          set -e

          stop_heartbeat
          heartbeat_pid=''
          trap - EXIT

          if [[ -s "${artifact_dir}/browser.stderr.log" ]]; then
            cat "${artifact_dir}/browser.stderr.log" >&2
          fi

          if [[ "$browser_exit_code" -ne 0 ]]; then
            echo "Браузерная DOM security regression завершилась с кодом ${browser_exit_code}." >&2
            exit "$browser_exit_code"
          fi

          if pgrep -af 'playwright.*chromium|chromium.*playwright' \
            > "${browser_dir}/processes.txt"; then
            cat "${browser_dir}/processes.txt"
            exit 1
          fi

          echo 'Осиротевшие процессы Playwright Chromium не обнаружены.' \
            > "${browser_dir}/processes.txt"

      - name: Проверить чистоту рабочего дерева
        id: security_tree
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Записать итог Security
        if: always()
        shell: bash
        run: |
          {
            echo '### Security — ${{ job.status }}'
            echo
            echo 'Commit: `${{ github.event.pull_request.head.sha || github.sha }}`'
            echo
            echo 'При падении redacted Gitleaks-логи, security-тесты и browser evidence находятся в `security-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Собрать диагностику Security
        if: failure()
        shell: bash
        run: |
          set +e
          artifact_dir="${RUNNER_TEMP}/azurpilot-ci-security"
          mkdir -p "$artifact_dir"
          {
            echo "commit=$(git rev-parse HEAD 2>/dev/null)"
            echo
            echo '--- git status --short ---'
            git status --short
            echo
            echo '--- git diff --check ---'
            git diff --check
          } > "${artifact_dir}/diagnostics.txt" 2>&1
          git diff --binary > "${artifact_dir}/working-tree.diff" 2>&1

          if [[ -d "${RUNNER_TEMP}/webui-security" ]]; then
            cp -R "${RUNNER_TEMP}/webui-security" "${artifact_dir}/browser"
          fi

      - name: Загрузить диагностику Security
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/azurpilot-ci-security
          if-no-files-found: error
          retention-days: 14
