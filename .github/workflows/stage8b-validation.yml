name: Stage 8B validation

on:
  pull_request:
    paths:
      - "module/ocr/**"
      - "module/daemon/ocr_benchmark.py"
      - "module/campaign/campaign_ocr.py"
      - "module/os/sea_miles_ocr.py"
      - "module/device/device.py"
      - "module/config/config.py"
      - "module/config/config_generated.py"
      - "module/config/argument/**"
      - "module/config/i18n/ru-RU.json"
      - "config/template.json"
      - "bin/ocr_models/**"
      - "dev_tools/stage8b_*.py"
      - "dev_tools/verify_stage8b.py"
      - "tests/test_stage8b_*.py"
      - "tests/test_stage5_locale_runtime.py"
      - ".github/workflows/stage8b-validation.yml"

permissions:
  contents: read

concurrency:
  group: stage8b-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  STAGE8B_BASE_REF: 045162c35ae7583860c88d6d899640ef3a6a1abb

jobs:
  stage8b-verifier:
    name: Stage 8B OCR semantic, output and security gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch immutable Stage 8B base
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "$STAGE8B_BASE_REF"
          git rev-parse --verify "$STAGE8B_BASE_REF^{commit}"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"

      - name: Synchronize locked dependencies
        run: uv sync --frozen

      - name: Verify exact head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse "$STAGE8B_BASE_REF^{commit}")" = "$STAGE8B_BASE_REF"
          printf 'exact_head=%s\n' "$(git rev-parse HEAD)" | tee artifacts-exact-head.txt
          printf 'immutable_base=%s\n' "$STAGE8B_BASE_REF" | tee -a artifacts-exact-head.txt

      - name: Run Ruff on Stage 8B code
        shell: bash
        run: |
          uv run ruff check \
            --extend-per-file-ignores "dev_tools/stage8b_ocr_acceptance.py:PLC0415" \
            --extend-per-file-ignores "dev_tools/stage8b_ocr_log_audit.py:FLY002" \
            --extend-per-file-ignores "dev_tools/stage8b_ocr_log_audit.py:PIE810" \
            --extend-per-file-ignores "dev_tools/stage8b_output_probe.py:I001" \
            --extend-per-file-ignores "dev_tools/stage8b_output_probe.py:PLC0415" \
            --extend-per-file-ignores "dev_tools/stage8b_real_output_probe.py:I001" \
            --extend-per-file-ignores "dev_tools/stage8b_real_output_probe.py:PLC0415" \
            --extend-per-file-ignores "dev_tools/stage8b_security_audit.py:RUF101" \
            --extend-per-file-ignores "dev_tools/verify_stage8b.py:BLE001" \
            --extend-per-file-ignores "dev_tools/verify_stage8b.py:I001" \
            --extend-per-file-ignores "tests/test_stage8b_prompt_scenario_matrix.py:F401" \
            --extend-per-file-ignores "tests/test_stage8b_prompt_scenario_matrix.py:I001" \
            --extend-per-file-ignores "tests/test_stage8b_prompt_scenario_matrix.py:PLC0415" \
            --extend-per-file-ignores "tests/test_stage8b_prompt_scenario_matrix.py:PLR2004" \
            --extend-per-file-ignores "tests/test_stage8b_prompt_scenario_matrix.py:RUF034" \
            --extend-per-file-ignores "tests/test_stage8b_prompt_scenario_matrix.py:SLF001" \
            --extend-per-file-ignores "tests/test_stage8b_reparse_privacy.py:SIM117" \
            --extend-per-file-ignores "tests/test_stage8b_reparse_privacy.py:SLF001" \
            --extend-per-file-ignores "tests/test_stage8b_rpc_runtime.py:SLF001" \
            --extend-per-file-ignores "tests/test_stage8b_runtime_scenario_matrix.py:I001" \
            --extend-per-file-ignores "tests/test_stage8b_runtime_scenario_matrix.py:PLC0415" \
            --extend-per-file-ignores "tests/test_stage8b_runtime_scenario_matrix.py:PLR2004" \
            --extend-per-file-ignores "tests/test_stage8b_runtime_scenario_matrix.py:SIM117" \
            --extend-per-file-ignores "tests/test_stage8b_security_review.py:I001" \
            dev_tools/stage8b_acceptance_contract.py \
            dev_tools/stage8b_evidence_policy.py \
            dev_tools/stage8b_model_scope.py \
            dev_tools/stage8b_ocr_acceptance.py \
            dev_tools/stage8b_ocr_log_audit.py \
            dev_tools/stage8b_opsi_zone_acceptance.py \
            dev_tools/stage8b_output_contract.py \
            dev_tools/stage8b_output_probe.py \
            dev_tools/stage8b_real_output_contract.py \
            dev_tools/stage8b_real_output_probe.py \
            dev_tools/stage8b_security_audit.py \
            dev_tools/stage8b_semantic_policy.py \
            dev_tools/verify_stage8b.py \
            module/ocr/stage8b_privacy.py \
            module/ocr/stage8b_rpc_security.py \
            tests/test_stage8b_ocr_acceptance.py \
            tests/test_stage8b_opsi_zone_acceptance.py \
            tests/test_stage8b_output_contract.py \
            tests/test_stage8b_prompt_scenario_matrix.py \
            tests/test_stage8b_reparse_privacy.py \
            tests/test_stage8b_rpc_runtime.py \
            tests/test_stage8b_runtime_scenario_matrix.py \
            tests/test_stage8b_security_review.py \
            tests/test_stage8b_semantic_contract.py

      - name: Run Operation Siren zone acceptance contracts
        shell: bash
        run: |
          mkdir -p artifacts/stage8b
          set -o pipefail
          uv run python -m unittest -v \
            tests.test_stage8b_opsi_zone_acceptance \
            2>&1 | tee artifacts/stage8b/opsi-zone-acceptance-contracts.log

      - name: Run Stage 8B verifier
        shell: bash
        run: |
          set -euo pipefail

          heartbeat_pid=''
          cleanup_heartbeat() {
            if [[ -n "$heartbeat_pid" ]]; then
              kill "$heartbeat_pid" 2>/dev/null || true
              wait "$heartbeat_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_heartbeat EXIT

          (
            while true; do
              sleep 60
              echo "Stage 8B verifier is still running at $(date --utc --iso-8601=seconds)"
            done
          ) &
          heartbeat_pid=$!

          timeout --signal=TERM --kill-after=30s 20m \
            uv run python -m dev_tools.verify_stage8b \
              --base-ref "$STAGE8B_BASE_REF" \
              --output-dir artifacts/stage8b

      - name: Run RPC runtime regression tests
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 5m \
            uv run python -m unittest -v \
              tests.test_stage8b_rpc_runtime \
            2>&1 | tee artifacts/stage8b/rpc-runtime.log

      - name: Check diff formatting
        run: git diff --check

      - name: Publish Stage 8B summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/stage8b/report.md ]]; then
            cat artifacts/stage8b/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Stage 8B report was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p artifacts/stage8b-failure
          git status --short > artifacts/stage8b-failure/git-status.txt
          git diff --check > artifacts/stage8b-failure/diff-check.txt 2>&1 || true
          git diff --binary > artifacts/stage8b-failure/working-tree.diff
          cp artifacts-exact-head.txt artifacts/stage8b-failure/exact-head.txt

      - name: Upload Stage 8B evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stage8b-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/stage8b
            artifacts/stage8b-failure
            artifacts-exact-head.txt
          if-no-files-found: error
          retention-days: 14

  stage8b-required-gate:
    name: Stage 8B required gate
    needs: stage8b-verifier
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful Stage 8B verifier
        shell: bash
        run: |
          test "${{ needs.stage8b-verifier.result }}" = "success"
