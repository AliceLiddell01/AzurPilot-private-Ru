name: One-time event calculator network cleanup

on:
  pull_request:
    branches:
      - personal/stable

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.head_ref == 'chatgpt/remove-upstream-announcements' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chatgpt/remove-upstream-announcements
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --group ci

      - name: Make event wiki networking explicit opt-in
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one sentinel, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8", newline="")

          replace_once(
              "module/webui/event_calculator.py",
              '''def load_event_calculator(force_refresh: bool = False) -> Dict[str, Any]:\n    """读取 Wiki 活动计算器数据，失败时回退到缓存。"""\n    cache = _read_cache()\n    cache_valid = cache.get("cache_version") == CACHE_VERSION\n    if cache and cache_valid and not force_refresh:\n        return {**cache, "from_cache": True}\n\n    try:\n        response = requests.get(WIKI_RAW_URL, timeout=10)\n        response.raise_for_status()\n        data = parse_event_calculator(response.text)\n        if not data["shop_items"] or not data["stages"]:\n            raise ValueError("таблица калькулятора события в Wiki заполнена не полностью")\n        _write_cache(data)\n        return {**data, "from_cache": False}\n    except Exception as e:\n        logger.warning(f"[WebUI — Калькулятор] Не удалось получить калькулятор события Wiki: {e}")\n        if cache:\n            return {**cache, "from_cache": True, "error": str(e)}\n        return {"error": str(e), "from_cache": False}\n''',
              '''def load_event_calculator(force_refresh: bool = False) -> Dict[str, Any]:\n    """Прочитать локальный кэш; обращаться к внешней Wiki только по явному запросу."""\n    cache = _read_cache()\n    cache_valid = cache.get("cache_version") == CACHE_VERSION\n    if cache and cache_valid and not force_refresh:\n        return {**cache, "from_cache": True}\n\n    if not force_refresh:\n        return {\n            "error": (\n                "Локальный кэш калькулятора события отсутствует или устарел. "\n                "Нажмите «Загрузить данные Wiki», чтобы явно выполнить внешний запрос "\n                "к wiki.biligame.com."\n            ),\n            "from_cache": False,\n            "needs_refresh": True,\n        }\n\n    try:\n        response = requests.get(WIKI_RAW_URL, timeout=10)\n        response.raise_for_status()\n        data = parse_event_calculator(response.text)\n        if not data["shop_items"] or not data["stages"]:\n            raise ValueError("таблица калькулятора события в Wiki заполнена не полностью")\n        _write_cache(data)\n        return {**data, "from_cache": False}\n    except Exception as e:\n        logger.warning(f"[WebUI — Калькулятор] Не удалось получить калькулятор события Wiki: {e}")\n        if cache and cache_valid:\n            return {**cache, "from_cache": True, "error": str(e)}\n        return {"error": str(e), "from_cache": False}\n''',
          )

          replace_once(
              "module/webui/app_event_tools.py",
              '''            put_text(\n                "Автоматически загружает из Wiki Azur Lane магазин события, дату окончания и PT карт. Результат можно записать в общие настройки события."\n            )\n''',
              '''            put_text(\n                "Использует локальный кэш данных события. Внешний запрос к wiki.biligame.com "\n                "выполняется только после явного нажатия кнопки загрузки/обновления Wiki. "\n                "Результат можно записать в общие настройки события."\n            )\n''',
          )

          replace_once(
              "module/webui/app_event_tools.py",
              '''                put_button(\n                    label="Повторить загрузку из Wiki",\n                    onclick=lambda: self._render_event_calculator(\n                        self.alas_config.read_file(self.alas_name), True\n                    ),\n                    color="warning",\n                )\n''',
              '''                put_button(\n                    label=(\n                        "Загрузить данные Wiki"\n                        if data.get("needs_refresh")\n                        else "Повторить загрузку из Wiki"\n                    ),\n                    onclick=lambda: self._render_event_calculator(\n                        self.alas_config.read_file(self.alas_name), True\n                    ),\n                    color="warning",\n                )\n''',
          )
          PY

      - name: Add behavioral regression tests
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/test_event_calculator_network_opt_in.py <<'PY'
          from __future__ import annotations

          import json
          import tempfile
          import unittest
          from pathlib import Path
          from unittest.mock import patch

          import module.webui.event_calculator as calculator


          class EventCalculatorNetworkOptInTests(unittest.TestCase):
              def test_default_load_never_contacts_external_wiki_without_cache(self) -> None:
                  with tempfile.TemporaryDirectory() as tmpdir:
                      cache_file = str(Path(tmpdir) / "event.json")
                      with (
                          patch.object(calculator, "CACHE_FILE", cache_file),
                          patch.object(calculator.requests, "get") as request,
                      ):
                          data = calculator.load_event_calculator()

                  request.assert_not_called()
                  self.assertTrue(data["needs_refresh"])
                  self.assertFalse(data["from_cache"])
                  self.assertIn("явно выполнить внешний запрос", data["error"])

              def test_default_load_uses_valid_local_cache_without_network(self) -> None:
                  with tempfile.TemporaryDirectory() as tmpdir:
                      cache_file = Path(tmpdir) / "event.json"
                      cache_file.write_text(
                          json.dumps(
                              {
                                  "cache_version": calculator.CACHE_VERSION,
                                  "shop_items": [{"name": "Cached", "price": 1, "quantity": 1}],
                                  "stages": [{"name": "D3", "points": 180}],
                              }
                          ),
                          encoding="utf-8",
                      )
                      with (
                          patch.object(calculator, "CACHE_FILE", str(cache_file)),
                          patch.object(calculator.requests, "get") as request,
                      ):
                          data = calculator.load_event_calculator()

                  request.assert_not_called()
                  self.assertTrue(data["from_cache"])
                  self.assertEqual(data["shop_items"][0]["name"], "Cached")

              def test_force_refresh_is_the_only_path_that_contacts_wiki(self) -> None:
                  parsed = {
                      "event_name": "Synthetic",
                      "end_date": "2026-08-31",
                      "shop_items": [{"name": "Item", "price": 100, "quantity": 1}],
                      "daily": [],
                      "extra": [],
                      "stages": [{"name": "D3", "points": 180}],
                      "source_url": calculator.WIKI_RAW_URL,
                      "updated_at": "2026-08-11 00:00:00",
                      "shop_total": 100,
                  }
                  with tempfile.TemporaryDirectory() as tmpdir:
                      cache_file = str(Path(tmpdir) / "event.json")
                      with (
                          patch.object(calculator, "CACHE_FILE", cache_file),
                          patch.object(calculator.requests, "get") as request,
                          patch.object(calculator, "parse_event_calculator", return_value=parsed),
                      ):
                          request.return_value.text = "synthetic wiki text"
                          request.return_value.raise_for_status.return_value = None
                          data = calculator.load_event_calculator(force_refresh=True)

                  request.assert_called_once_with(calculator.WIKI_RAW_URL, timeout=10)
                  self.assertFalse(data["from_cache"])
                  self.assertEqual(data["event_name"], "Synthetic")


          if __name__ == "__main__":
              unittest.main()
          PY

      - name: Extend network cleanup contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_no_upstream_project_network_defaults.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''    # Старый uiautomator2 installer больше не переключается на скрытый внешний fallback.\n'''
          block = '''    # Калькулятор события сохраняется, но его китайский Wiki endpoint больше не вызывается при открытии страницы.\n    event_calculator = (ROOT / "module/webui/event_calculator.py").read_text(encoding="utf-8")\n    event_tools = (ROOT / "module/webui/app_event_tools.py").read_text(encoding="utf-8")\n    assert "if not force_refresh:" in event_calculator\n    assert "needs_refresh" in event_calculator\n    assert "requests.get(WIKI_RAW_URL, timeout=10)" in event_calculator\n    assert "выполняется только после явного нажатия" in event_tools\n    assert "Загрузить данные Wiki" in event_tools\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit("network cleanup test: uiautomator2 anchor not found")
          path.write_text(text.replace(anchor, block + anchor, 1), encoding="utf-8", newline="")
          PY

      - name: Verify explicit-network behavior
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python -m py_compile module/webui/event_calculator.py module/webui/app_event_tools.py
          uv run --locked --group ci python -m pytest -q \
            tests/test_event_calculator_network_opt_in.py \
            tests/test_webui_event_calculator_security.py \
            tests/test_no_upstream_project_network_defaults.py
          git diff --check

      - name: Commit non-workflow cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module/webui/event_calculator.py module/webui/app_event_tools.py \
            tests/test_event_calculator_network_opt_in.py tests/test_no_upstream_project_network_defaults.py
          git diff --cached --name-status
          git diff --cached --quiet && { echo 'Expected event calculator cleanup changes were not generated.' >&2; exit 1; }
          git commit -m "refactor(webui): сделать загрузку event Wiki явной"
          git push origin HEAD:chatgpt/remove-upstream-announcements
