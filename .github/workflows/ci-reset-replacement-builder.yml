name: Build CI Reset replacement

on:
  pull_request:
    branches:
      - personal/stable
    paths:
      - ".github/workflows/ci-reset-replacement-builder.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-reset-replacement-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout iterative PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: codex/ci-reset

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - name: Build clean replacement history
        id: build
        shell: bash
        env:
          BASE_BRANCH: personal/stable
          REPLACEMENT_BRANCH: chatgpt/ci-reset
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          iterative_head="$(git rev-parse HEAD)"
          git fetch --no-tags origin "$BASE_BRANCH"
          base_sha="$(git rev-parse "origin/${BASE_BRANCH}")"
          printf 'iterative_head=%s\nbase_sha=%s\n' "$iterative_head" "$base_sha"

          patch_file="${RUNNER_TEMP}/ci-reset-final.patch"
          git diff --binary "$base_sha...$iterative_head" > "$patch_file"
          test -s "$patch_file"

          git switch --detach "$base_sha"
          git apply --binary "$patch_file"
          cat .github/scripts/ci-reset-builder.py.b64.* \
            | base64 --decode > "${RUNNER_TEMP}/build_ci_reset_replacement.py"
          python "${RUNNER_TEMP}/build_ci_reset_replacement.py"
          rm -f .github/scripts/ci-reset-builder.py.b64.*
          uv lock

          uv lock --check
          uv sync --locked --group ci
          uv run --locked ruff check . --select E9,F63,F7,F82 --ignore F821,F722
          uv run --locked python - <<'PY'
          import compileall
          from pathlib import Path

          roots = (
              Path("alas.py"),
              Path("gui.py"),
              Path("mcp_server_sse.py"),
              Path("module"),
              Path("dev_tools"),
              Path("tests"),
              Path("tools"),
          )
          failed = False
          for root in roots:
              if not root.exists():
                  continue
              if root.is_file():
                  failed = not compileall.compile_file(root, quiet=1) or failed
              else:
                  failed = not compileall.compile_dir(root, quiet=1) or failed
          if failed:
              raise SystemExit("Python compilation failed.")
          PY
          uv run --locked --group ci python -m pytest -q tests

          uv run --locked -m dev_tools.button_extract
          uv run --locked -m module.config.config_updater
          git diff --check

          actionlint_version='1.7.12'
          actionlint_archive="actionlint_${actionlint_version}_linux_amd64.tar.gz"
          actionlint_sha256='8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          actionlint_dir="${RUNNER_TEMP}/actionlint"
          mkdir -p "$actionlint_dir"
          curl --fail --location --silent --show-error \
            --output "${actionlint_dir}/${actionlint_archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}/${actionlint_archive}"
          printf '%s  %s\n' "$actionlint_sha256" "${actionlint_dir}/${actionlint_archive}" \
            | sha256sum --check --strict
          tar -xzf "${actionlint_dir}/${actionlint_archive}" -C "$actionlint_dir" actionlint
          "${actionlint_dir}/actionlint" .github/workflows/ci.yml

          gitleaks_version='8.30.1'
          gitleaks_archive="gitleaks_${gitleaks_version}_linux_x64.tar.gz"
          gitleaks_sha256='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          gitleaks_dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$gitleaks_dir"
          curl --fail --location --silent --show-error \
            --output "${gitleaks_dir}/${gitleaks_archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/${gitleaks_archive}"
          printf '%s  %s\n' "$gitleaks_sha256" "${gitleaks_dir}/${gitleaks_archive}" \
            | sha256sum --check --strict
          tar -xzf "${gitleaks_dir}/${gitleaks_archive}" -C "$gitleaks_dir" gitleaks
          "${gitleaks_dir}/gitleaks" dir --redact --no-banner .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all -- \
            .github \
            dev_tools \
            module \
            scripts \
            tools \
            pyproject.toml \
            uv.lock
          git commit -m "ci: заменить Stage-зависимые workflows кодоцентричным CI"

          git add --all -- tests
          git commit -m "test: сохранить OCR и RPC security regressions"

          git add --all -- docs .codex
          git commit -m "docs: описать воспроизводимый CI и ruleset contract"

          test -z "$(git status --porcelain)"
          git diff --check "$base_sha...HEAD"
          test "$(git rev-list --count "$base_sha..HEAD")" -eq 3

          "${gitleaks_dir}/gitleaks" dir --redact --no-banner .
          "${gitleaks_dir}/gitleaks" git --redact --no-banner \
            --log-opts="${base_sha}..HEAD" .

          final_sha="$(git rev-parse HEAD)"
          printf 'FINAL_SHA=%s\nBASE_SHA=%s\n' "$final_sha" "$base_sha"
          printf 'final_sha=%s\nbase_sha=%s\n' "$final_sha" "$base_sha" >> "$GITHUB_OUTPUT"

          set +e
          git push origin "HEAD:refs/heads/${REPLACEMENT_BRANCH}"
          push_exit_code=$?
          set -e
          printf 'PUSH_EXIT_CODE=%s\n' "$push_exit_code"

          rules_output="${RUNNER_TEMP}/ruleset.json"
          rules_http_code="$(curl --silent --show-error \
            --output "$rules_output" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/rules/branches/personal%2Fstable")"
          printf 'RULESET_HTTP_CODE=%s\n' "$rules_http_code"
          if [[ "$rules_http_code" == '200' ]]; then
            python -m json.tool "$rules_output"
          else
            sed -n '1,80p' "$rules_output"
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## CI Reset replacement builder'
            echo
            echo "- final SHA: ${{ steps.build.outputs.final_sha }}"
            echo "- base SHA: ${{ steps.build.outputs.base_sha }}"
            echo '- replacement branch: `chatgpt/ci-reset`'
          } >> "$GITHUB_STEP_SUMMARY"
