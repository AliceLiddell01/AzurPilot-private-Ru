name: Temporary WebUI test-list patch

on:
  push:
    branches:
      - fix/webui-no-reload-orphan-recovery

permissions:
  contents: write

jobs:
  patch-test-list:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Patch required Stage 6 test list
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/lint.yml')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          target = 'tests/test_webui_worker_registry.py'
          added = 'tests/test_webui_no_reload_recovery.py'

          if any(line.strip() == added for line in lines):
              raise SystemExit(0)

          for index, line in enumerate(lines):
              if line.strip() == target:
                  indentation = line[: len(line) - len(line.lstrip())]
                  lines.insert(index + 1, f'{indentation}{added}\n')
                  path.write_text(''.join(lines), encoding='utf-8')
                  break
          else:
              raise SystemExit('Stage 6 worker-registry test entry was not found')
          PY

      - name: Verify test-list update
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/lint.yml').read_text(encoding='utf-8')
          assert text.count('tests/test_webui_no_reload_recovery.py') == 1
          PY
          git diff --check

      - name: Commit test-list update
        run: |
          if git diff --quiet -- .github/workflows/lint.yml; then
            echo 'Stage 6 test list is already updated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/lint.yml
          git commit -m 'ci: запускать no-reload recovery regression'
          git push
